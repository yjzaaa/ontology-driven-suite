# ─── MI 集成契约（技术层，防腐层）──────────────────────────────────────────
# 职责：把「语义参数」映射成「DPA DTO 技术字段」，并声明技术执行细节。
# 唯一允许出现 URL/Method/凭据/参数映射的地方（边界 #3）。
model_id: masterdata.mi.update-subtable
model_type: MI
domain: masterdata
name: { zh: 更新子表数据集成, en: Update Subtable Data Integration }
version: 1.0.0
status: PUBLISHED
evidence_refs:
  - "ev:WS:ce9ad5ca:YiSha.Web/YiSha.Admin.Web/Areas/MasterData/Controllers/MasterDataPROnlineApprovalController.cs:UpdateSubtableDataList"
created_at: "2026-09-07T10:00:00+08:00"
created_by: declarative-action-spike
schema_version: 3.0.0

executor: DPA_HTTP              # 执行器类型（HTTP 防腐层）
effect: WRITE
method: POST
url_path: /MasterData/MasterDataPROnlineApproval/UpdateSubtableDataList
auth_mode: same_origin_cookie   # 同源 Cookie 转发（凭据不进入模型上下文）
timeout_seconds: 15
retries: 0                      # 写请求不重试
idempotency: no

# 参数映射：JMESPath（替代旧的 "{input.xxx}" 字符串模板 + _dig + 正则）。
# 源数据域固定为 {input, target}；结果即发往 DPA 的请求体字段。
param_mapping:
  ActiveStatu: "input.active_status"   # JMESPath
  DicType:     "target.dic_type"
  JsonIds:     "target.ids"

# 结构化禁止规则（封闭词表，引擎解释；业务取值在模型）
forbidden_params:
  - { param: target.ids, rule: nonempty_positive_ints, reason: 必须选中至少一个文档 }
  - { param: input.active_status, rule: "in:Active,Inactive", reason: 只允许 Active/Inactive }

error_mapping:
  "401": DPA_SESSION_EXPIRED
  "403": DPA_PERMISSION_DENIED
  "500": DPA_INTERNAL_ERROR
