<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DPA 本体 MVP · 会话工作台</title>
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; display: flex; height: 100vh; background: #f5f6f8; }
  aside { width: 240px; background: #1e2430; color: #cfd6e4; padding: 16px; box-sizing: border-box; }
  aside h1 { font-size: 16px; color: #fff; margin: 0 0 4px; }
  aside .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 8px; }
  .ok { background: #1d4d2b; color: #9fe0b3; } .bad { background: #5a2323; color: #f3b3b3; }
  aside ul { list-style: none; padding: 0; font-size: 13px; line-height: 2; }
  main { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin: 10px 0; } .user { text-align: right; } .user span { background: #2563eb; color: #fff; padding: 8px 14px; border-radius: 14px; display: inline-block; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 12px 16px; margin: 10px 0; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: #333; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; white-space: nowrap; }
  th { color: #666; font-weight: 600; }
  .proposal { border-left: 4px solid #d97706; }
  .proposal button { margin: 10px 8px 0 0; padding: 6px 18px; border: 0; border-radius: 6px; cursor: pointer; }
  .approve { background: #16a34a; color: #fff; } .reject { background: #dc2626; color: #fff; }
  .err { color: #b91c1c; font-size: 13px; } .route { color: #888; font-size: 12px; }
  #inputbar { display: flex; padding: 12px 20px; background: #fff; border-top: 1px solid #e3e6ea; }
  #inp { flex: 1; padding: 10px 14px; border: 1px solid #d6dae1; border-radius: 8px; font-size: 14px; }
  #send { margin-left: 10px; padding: 10px 22px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<aside>
  <h1>DPA 本体工作台</h1>
  <div style="font-size:12px">MVP 竖切 · masterdata</div>
  <div id="session" class="badge bad">DPA 会话：检测中…</div>
  <div id="wmode" class="badge" style="display:none"></div>
  <ul>
    <li>📦 对象：<b>PR 审批主数据文档</b>（本地库，由测试库一次性只读引导）</li>
    <li>🔍 读：本地检索（87 类文档 / 16774 行）</li>
    <li>✍️ 写：启停文档（HIGH，需批准 → 本地库落库）</li>
  </ul>
  <div style="font-size:12px;color:#8b93a5;line-height:1.6">
    写路径经真实 DPA 业务链执行。<br>先登录 <a style="color:#7aa7ff" href="http://localhost:5000" target="_blank">测试 DPA</a> 再操作。
  </div>
</aside>
<main>
  <div id="log"></div>
  <div id="inputbar">
    <input id="inp" placeholder="例：查审批主数据 9305733 / 停用 FY23_One-time Tooling" onkeydown="if(event.key==='Enter')send()">
    <button id="send" onclick="send()">发送</button>
  </div>
</main>
<script>
const log = document.getElementById('log');
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function add(html){ const d=document.createElement('div'); d.className='msg'; d.innerHTML=html; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }

function renderTable(ev){
  let h = `<div class="card"><h3>📦 ${esc(ev.display)}（${ev.rows.length} 行）</h3>`;
  if (ev.rows.length){
    h += '<table><tr>' + ev.columns.map(c=>`<th>${esc(c)}</th>`).join('') + '</tr>';
    for (const r of ev.rows.slice(0,15))
      h += '<tr>' + ev.columns.map(c=>{
        const key = Object.keys(r).find(k=>esc(r[k])!==undefined) && r[c] !== undefined ? c : Object.keys(r)[ev.columns.indexOf(c)];
        return `<td>${esc(r[key])}</td>`;}).join('') + '</tr>';
    h += '</table>';
  }
  return h + '</div>';
}

function renderProposal(ev){
  return `<div class="card proposal"><h3>✍️ 写提案（风险 ${esc(ev.risk)} · 状态 ${esc(ev.state)}）</h3>
    <div>提案 <b>${esc(ev.proposal_id)}</b>：${esc(ev.display)}</div>
    <div style="font-size:13px;color:#555">${esc(ev.change)}</div>
    <button class="approve" onclick="decide('${ev.proposal_id}','${ev.token}','approve',this)">批准并执行</button>
    <button class="reject" onclick="decide('${ev.proposal_id}','${ev.token}','reject',this)">拒绝</button>
    <div class="result"></div></div>`;
}

async function decide(pid, token, decision, btn){
  const box = btn.parentElement.querySelector('.result');
  btn.disabled = true;
  const r = await fetch('/api/approve', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({proposal_id: pid, decision, token})}).then(x=>x.json());
  box.innerHTML = r.status === 'SUCCEEDED'
    ? `<div style="color:#15803d;margin-top:8px">✅ 执行成功（审计收据已写入）</div>`
    : `<div style="color:#b91c1c;margin-top:8px">❌ ${esc(r.status)} ${esc(r.code||'')}：${esc(r.message||r.dpa_response||'')}</div>`;
}

async function send(){
  const inp = document.getElementById('inp'); const text = inp.value.trim();
  if (!text) return; inp.value = '';
  add(`<div class="user"><span>${esc(text)}</span></div>`);
  const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message: text})}).then(x=>x.json());
  for (const ev of r.events){
    if (ev.type === 'object_table') add(renderTable(ev));
    else if (ev.type === 'proposal_card') add(renderProposal(ev));
    else if (ev.type === 'route') add(`<div class="route">⚙️ ${esc(ev.note)}</div>`);
    else if (ev.type === 'error') add(`<div class="card err">⚠️ ${esc(ev.message)}</div>`);
  }
}

fetch('/api/session').then(r=>r.json()).then(s=>{
  const el = document.getElementById('session');
  el.textContent = s.dpa_session_bound ? 'DPA 会话：已绑定' : 'DPA 会话：未绑定（请先登录测试 DPA）';
  el.className = 'badge ' + (s.dpa_session_bound ? 'ok' : 'bad');
  const m = document.getElementById('wmode');
  m.style.display = 'inline-block';
  m.textContent = s.write_mode === 'dpa_http' ? '写模式：真实 DPA' : '写模式：本地沙箱 JSON';
  m.className = 'badge ' + (s.write_mode === 'dpa_http' ? 'bad' : 'ok');
});
add(`<div class="card"><h3>👋 试试这些</h3><div style="font-size:13px;line-height:1.9">
查审批主数据 9305733<br>停用 FY23_One-time Tooling（写提案 → 批准 → 本地库落库）<br>切换 .env GATEWAY_WRITE_MODE=dpa_http 可经 DPA 真实写</div></div>`);
</script>
</body>
</html>
