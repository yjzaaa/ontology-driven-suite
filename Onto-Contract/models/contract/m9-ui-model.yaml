version: "1.0.0"
model_type: "UI-Model"
description: "AI原生应用系统通用UI建模与生成规范"

# 1. 全局布局骨架 (Shell Layout)
# 定义应用的基础框架结构、边距及交互行为
layout_specification:
  shell_type: "triple-column-resizable" # 三栏可拖拽布局 (Sidebar | Main | AI-Chat)
  header:
    fixed: true
    height: "60px"
    components: ["logo", "title", "user_profile", "sidebar_toggle", "ai_toggle", "logout"]
    background: "#111827" # 深色导航栏
  sidebar:
    default_width: "250px"
    min_width: "150px"
    max_width: "500px"
    background: "#ffffff" # 白色底色
    navigation_style: "expandable-tree" # 树状目录结构
  main_area:
    style: "multi-tab" # 多标签页管理
    content_padding: "15px 15px 0 15px" # 间隙规范: 上、左、右固定为 15px
    background: "#f0f2f6"
    elevation: "flat" # 扁平化设计，移除阴影和立体感
    border_radius: "0px" # 移除圆角
  ai_panel:
    default_width: "400px"
    min_width: "300px"
    max_width: "800px"
    role: "AI-Assistant-Copilot"
    header_label: "AI 智能助理"
    assistant_label: "AI 助手"

# 2. 导航建模 (Navigation Tree)
# 定义树形菜单的层级、图标及触发的功能页面
navigation_model:
  node_structure:
    properties:
      id: "unique_id"
      label: "string"
      icon: "lucide_icon_name" # Lucide 图标库命名规范
      type: "category | leaf"
      action: "open_tab | link"
      payload: "functional_page_id"
  # 示例数据结构
  nodes:
    - id: "base_data"
      label: "基础数据"
      icon: "Database"
      children:
        - id: "supplier_entry"
          label: "供应商录入"
          icon: "PlusCircle"
          action: "open_tab"
          payload: "SupplierEntryPage"
        - id: "supplier_search"
          label: "供应商查询"
          icon: "Search"
          action: "open_tab"
          payload: "SupplierSearchPage"

# 3. 页面组件建模 (Functional Component Templates)
# 定义通用页面的布局模式，支持与领域对象模型 (m1-object-model) 绑定
component_definitions:
  # 搜索与表格展示页模式
  search_table_template:
    sections:
      - id: "filter_bar"
        layout: "grid-4-columns" # 4列网格查询条件
        binding: "m1_object_model.attributes (filterable: true)"
      - id: "result_table"
        actions: ["view", "edit", "delete", "export"]
        pagination: true
        selection_mode: "single"
  
  # 录入与维护页模式
  entry_form_template:
    types:
      # 单表维护 (如供应商)
      single_entity: 
        layout: "grid-2-columns" # 2列布局
        width: "100% (responsive)" # 宽度完全自适应
        binding: "m1_object_model.entity"
      # 主从表/1对多维护 (如采购订单)
      master_detail:
        layout: "form-top-table-bottom" # 上部表单，下部明细表
        master_section: "m1_object_model.entity"
        detail_section: "m1_object_model.relationships.items"

# 4. AI 交互协议 (AI-Native Interaction Protocol)
# 定义 AI 对话区的呈现能力及意图驱动 UI 的逻辑
ai_interaction_protocol:
  message_renders:
    text: "markdown-rich-text"
    table: 
      style: "responsive-mini-table" # 对话框内嵌入的自适应宽度表格
      theme: "match-system-ui"
    chart:
      engine: "echarts"
      style: "auto-fit-container" # 图标自动填满 AI 面板宽度
  
  # 语义意图到 UI 动作的映射映射
  intent_to_ui_mapping:
    - intent_pattern: "录入|新增|增加|创建 (.*)"
      action: "OPEN_TAB"
      mapping: "page_registry.find_by_entity($1)"
    - intent_pattern: "统计|分析 (.*)"
      action: "RENDER_INTERNAL_WIDGET"
      widget_type: "table | chart"

# 5. 视觉主题规范 (Design System Tokens)
visual_identity:
  colors:
    primary: "#2266e3" # 品牌蓝
    nav_bg: "#111827"  # 深色导航背景
    border: "#e2edf2"  # 边框
    background: "#f0f2f6"
  shorthands:
    flat_style: 
      shadow: "none"
      radius: "0px"
      border: "1px solid var(--divider-color)"
