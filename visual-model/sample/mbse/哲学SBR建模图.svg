<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义样式 -->
  <defs>
    <style>
      .component { stroke: #333; stroke-width: 2; }
      .ontology { fill: #E3F2FD; }
      .epistemology { fill: #FFE0B2; }
      .both { fill: #E8F5E9; }
      .synthesis { fill: #F3E5F5; }
      .modern { fill: #FFF9C4; }
      .text-title { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .text-philosopher { font-family: Arial, sans-serif; font-size: 9px; fill: #666; text-anchor: middle; }
      .text-period { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #D32F2F; }
      .arrow { fill: none; stroke-width: 2; }
      .influence { stroke: #1976D2; }
      .critique { stroke: #D32F2F; stroke-dasharray: 5,3; }
      .develop { stroke: #388E3C; }
      .synthesis-arrow { stroke: #9C27B0; stroke-dasharray: 3,3; }
    </style>
    
    <!-- 箭头标记 -->
    <marker id="arrow-influence" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2" />
    </marker>
    <marker id="arrow-critique" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#D32F2F" />
    </marker>
    <marker id="arrow-develop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#388E3C" />
    </marker>
    <marker id="arrow-synthesis" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9C27B0" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="700" y="25" style="font-size: 20px; font-weight: bold; text-anchor: middle; fill: #333;">
    西方哲学思想演进 - 本体论与认识论的发展脉络
  </text>

  <!-- 时间轴 -->
  <line x1="50" y1="60" x2="1350" y2="60" stroke="#999" stroke-width="3"/>
  <text x="50" y="80" class="text-period">公元前</text>
  <text x="350" y="80" class="text-period">中世纪</text>
  <text x="650" y="80" class="text-period">近代</text>
  <text x="1050" y="80" class="text-period">现代</text>

  <!-- ========== 古希腊时期 (BC 600-300) ========== -->
  
  <!-- 理念论 -->
  <rect x="80" y="120" width="140" height="70" rx="8" class="component ontology"/>
  <text x="150" y="145" class="text-title">理念论/形式论</text>
  <text x="150" y="160" class="text-philosopher">(柏拉图 Plato)</text>
  <text x="150" y="173" style="font-size: 8px; text-anchor: middle; fill: #666;">本体：理念世界</text>
  <text x="150" y="185" style="font-size: 8px; text-anchor: middle; fill: #666;">认识：回忆说</text>

  <!-- 实体论 -->
  <rect x="80" y="220" width="140" height="70" rx="8" class="component ontology"/>
  <text x="150" y="245" class="text-title">实体论/四因说</text>
  <text x="150" y="260" class="text-philosopher">(亚里士多德 Aristotle)</text>
  <text x="150" y="273" style="font-size: 8px; text-anchor: middle; fill: #666;">本体：实体与形式</text>
  <text x="150" y="285" style="font-size: 8px; text-anchor: middle; fill: #666;">认识：从感觉到理性</text>

  <!-- 原子论 -->
  <rect x="80" y="320" width="140" height="60" rx="8" class="component ontology"/>
  <text x="150" y="343" class="text-title">原子论</text>
  <text x="150" y="358" class="text-philosopher">(德谟克利特)</text>
  <text x="150" y="371" style="font-size: 8px; text-anchor: middle; fill: #666;">万物由原子构成</text>

  <!-- ========== 中世纪 (300-1400) ========== -->
  
  <!-- 神学本体论 -->
  <rect x="280" y="120" width="140" height="70" rx="8" class="component synthesis"/>
  <text x="350" y="145" class="text-title">神学本体论</text>
  <text x="350" y="160" class="text-philosopher">(奥古斯丁)</text>
  <text x="350" y="173" style="font-size: 8px; text-anchor: middle; fill: #666;">上帝是最高存在</text>
  <text x="350" y="185" style="font-size: 8px; text-anchor: middle; fill: #666;">信仰高于理性</text>

  <!-- 经院哲学 -->
  <rect x="280" y="220" width="140" height="70" rx="8" class="component synthesis"/>
  <text x="350" y="245" class="text-title">经院哲学</text>
  <text x="350" y="260" class="text-philosopher">(托马斯·阿奎那)</text>
  <text x="350" y="273" style="font-size: 8px; text-anchor: middle; fill: #666;">理性与信仰调和</text>
  <text x="350" y="285" style="font-size: 8px; text-anchor: middle; fill: #666;">共相与殊相</text>

  <!-- ========== 近代早期 (1500-1700) ========== -->
  
  <!-- 理性主义 -->
  <rect x="480" y="100" width="140" height="75" rx="8" class="component epistemology"/>
  <text x="550" y="125" class="text-title">天赋观念论</text>
  <text x="550" y="140" class="text-philosopher">(笛卡尔 Descartes)</text>
  <text x="550" y="153" style="font-size: 8px; text-anchor: middle; fill: #666;">我思故我在</text>
  <text x="550" y="165" style="font-size: 8px; text-anchor: middle; fill: #666;">理性先于经验</text>

  <!-- 经验主义 -->
  <rect x="480" y="200" width="140" height="75" rx="8" class="component epistemology"/>
  <text x="550" y="225" class="text-title">经验主义</text>
  <text x="550" y="240" class="text-philosopher">(洛克 Locke)</text>
  <text x="550" y="253" style="font-size: 8px; text-anchor: middle; fill: #666;">心灵白板说</text>
  <text x="550" y="265" style="font-size: 8px; text-anchor: middle; fill: #666;">知识源于经验</text>

  <!-- 单子论 -->
  <rect x="480" y="300" width="140" height="70" rx="8" class="component ontology"/>
  <text x="550" y="325" class="text-title">单子论</text>
  <text x="550" y="340" class="text-philosopher">(莱布尼茨 Leibniz)</text>
  <text x="550" y="353" style="font-size: 8px; text-anchor: middle; fill: #666;">世界由单子构成</text>
  <text x="550" y="365" style="font-size: 8px; text-anchor: middle; fill: #666;">预定和谐</text>

  <!-- 怀疑主义 -->
  <rect x="480" y="395" width="140" height="65" rx="8" class="component epistemology"/>
  <text x="550" y="418" class="text-title">温和怀疑论</text>
  <text x="550" y="433" class="text-philosopher">(休谟 Hume)</text>
  <text x="550" y="446" style="font-size: 8px; text-anchor: middle; fill: #666;">因果关系质疑</text>
  <text x="550" y="456" style="font-size: 8px; text-anchor: middle; fill: #666;">知识的界限</text>

  <!-- ========== 近代晚期 (1700-1900) ========== -->
  
  <!-- 先验哲学 -->
  <rect x="680" y="150" width="150" height="80" rx="8" class="component both"/>
  <text x="755" y="175" class="text-title">先验唯心论</text>
  <text x="755" y="190" class="text-philosopher">(康德 Kant)</text>
  <text x="755" y="203" style="font-size: 8px; text-anchor: middle; fill: #666;">物自体与现象</text>
  <text x="755" y="215" style="font-size: 8px; text-anchor: middle; fill: #666;">先验综合判断</text>
  <text x="755" y="227" style="font-size: 8px; text-anchor: middle; fill: #666;">范畴与直观</text>

  <!-- 绝对唯心论 -->
  <rect x="680" y="260" width="150" height="75" rx="8" class="component synthesis"/>
  <text x="755" y="285" class="text-title">绝对唯心论</text>
  <text x="755" y="300" class="text-philosopher">(黑格尔 Hegel)</text>
  <text x="755" y="313" style="font-size: 8px; text-anchor: middle; fill: #666;">绝对精神</text>
  <text x="755" y="325" style="font-size: 8px; text-anchor: middle; fill: #666;">辩证法三段论</text>

  <!-- 唯意志论 -->
  <rect x="680" y="360" width="150" height="70" rx="8" class="component ontology"/>
  <text x="755" y="385" class="text-title">唯意志论</text>
  <text x="755" y="400" class="text-philosopher">(叔本华 Schopenhauer)</text>
  <text x="755" y="413" style="font-size: 8px; text-anchor: middle; fill: #666;">意志是世界本质</text>
  <text x="755" y="425" style="font-size: 8px; text-anchor: middle; fill: #666;">表象与意志</text>

  <!-- 实证主义 -->
  <rect x="680" y="455" width="150" height="70" rx="8" class="component epistemology"/>
  <text x="755" y="480" class="text-title">实证主义</text>
  <text x="755" y="495" class="text-philosopher">(孔德 Comte)</text>
  <text x="755" y="508" style="font-size: 8px; text-anchor: middle; fill: #666;">科学实证方法</text>
  <text x="755" y="520" style="font-size: 8px; text-anchor: middle; fill: #666;">可验证性原则</text>

  <!-- ========== 现代哲学 (1900-) ========== -->
  
  <!-- 现象学 -->
  <rect x="900" y="100" width="150" height="75" rx="8" class="component epistemology"/>
  <text x="975" y="125" class="text-title">现象学</text>
  <text x="975" y="140" class="text-philosopher">(胡塞尔 Husserl)</text>
  <text x="975" y="153" style="font-size: 8px; text-anchor: middle; fill: #666;">回到事物本身</text>
  <text x="975" y="165" style="font-size: 8px; text-anchor: middle; fill: #666;">现象学还原</text>

  <!-- 存在主义 -->
  <rect x="900" y="200" width="150" height="80" rx="8" class="component both"/>
  <text x="975" y="225" class="text-title">存在主义</text>
  <text x="975" y="240" class="text-philosopher">(海德格尔/萨特)</text>
  <text x="975" y="253" style="font-size: 8px; text-anchor: middle; fill: #666;">存在先于本质</text>
  <text x="975" y="265" style="font-size: 8px; text-anchor: middle; fill: #666;">此在与世界</text>
  <text x="975" y="277" style="font-size: 8px; text-anchor: middle; fill: #666;">自由与责任</text>

  <!-- 逻辑实证主义 -->
  <rect x="900" y="305" width="150" height="75" rx="8" class="component epistemology"/>
  <text x="975" y="330" class="text-title">逻辑实证主义</text>
  <text x="975" y="345" class="text-philosopher">(维特根斯坦/卡尔纳普)</text>
  <text x="975" y="358" style="font-size: 8px; text-anchor: middle; fill: #666;">语言逻辑分析</text>
  <text x="975" y="370" style="font-size: 8px; text-anchor: middle; fill: #666;">意义的证实原则</text>

  <!-- 科学哲学 -->
  <rect x="900" y="405" width="150" height="70" rx="8" class="component epistemology"/>
  <text x="975" y="430" class="text-title">科学哲学</text>
  <text x="975" y="445" class="text-philosopher">(波普尔/库恩)</text>
  <text x="975" y="458" style="font-size: 8px; text-anchor: middle; fill: #666;">证伪主义</text>
  <text x="975" y="470" style="font-size: 8px; text-anchor: middle; fill: #666;">范式革命</text>

  <!-- 结构主义 -->
  <rect x="900" y="500" width="150" height="70" rx="8" class="component both"/>
  <text x="975" y="525" class="text-title">结构主义</text>
  <text x="975" y="540" class="text-philosopher">(列维-斯特劳斯/福柯)</text>
  <text x="975" y="553" style="font-size: 8px; text-anchor: middle; fill: #666;">深层结构分析</text>
  <text x="975" y="565" style="font-size: 8px; text-anchor: middle; fill: #666;">话语权力</text>

  <!-- ========== 后现代 ========== -->
  
  <!-- 解构主义 -->
  <rect x="1120" y="150" width="150" height="70" rx="8" class="component modern"/>
  <text x="1195" y="175" class="text-title">解构主义</text>
  <text x="1195" y="190" class="text-philosopher">(德里达 Derrida)</text>
  <text x="1195" y="203" style="font-size: 8px; text-anchor: middle; fill: #666;">延异与踪迹</text>
  <text x="1195" y="215" style="font-size: 8px; text-anchor: middle; fill: #666;">反本质主义</text>

  <!-- 后现代主义 -->
  <rect x="1120" y="245" width="150" height="75" rx="8" class="component modern"/>
  <text x="1195" y="270" class="text-title">后现代主义</text>
  <text x="1195" y="285" class="text-philosopher">(利奥塔/鲍德里亚)</text>
  <text x="1195" y="298" style="font-size: 8px; text-anchor: middle; fill: #666;">元叙事的终结</text>
  <text x="1195" y="310" style="font-size: 8px; text-anchor: middle; fill: #666;">拟像与超真实</text>

  <!-- 分析哲学 -->
  <rect x="1120" y="345" width="150" height="70" rx="8" class="component epistemology"/>
  <text x="1195" y="370" class="text-title">分析哲学</text>
  <text x="1195" y="385" class="text-philosopher">(罗素/奎因)</text>
  <text x="1195" y="398" style="font-size: 8px; text-anchor: middle; fill: #666;">语言分析方法</text>
  <text x="1195" y="410" style="font-size: 8px; text-anchor: middle; fill: #666;">逻辑原子论</text>

  <!-- 实用主义 -->
  <rect x="1120" y="440" width="150" height="70" rx="8" class="component epistemology"/>
  <text x="1195" y="465" class="text-title">实用主义</text>
  <text x="1195" y="480" class="text-philosopher">(詹姆斯/杜威)</text>
  <text x="1195" y="493" style="font-size: 8px; text-anchor: middle; fill: #666;">真理的效用标准</text>
  <text x="1195" y="505" style="font-size: 8px; text-anchor: middle; fill: #666;">经验与行动</text>

  <!-- ========== 关系连接 ========== -->
  
  <!-- 古希腊内部 -->
  <path d="M 150 190 L 150 215" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="165" y="205" style="font-size: 8px; fill: #D32F2F;">批判理念论</text>

  <path d="M 150 290 L 150 315" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="165" y="305" style="font-size: 8px; fill: #1976D2;">影响</text>

  <!-- 古希腊到中世纪 -->
  <path d="M 220 155 L 275 155" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="247" y="148" style="font-size: 8px; fill: #1976D2;">继承</text>

  <path d="M 220 255 L 275 255" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="247" y="248" style="font-size: 8px; fill: #1976D2;">亚里士多德主义</text>

  <!-- 中世纪内部 -->
  <path d="M 350 190 L 350 215" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="365" y="205" style="font-size: 8px; fill: #388E3C;">发展</text>

  <!-- 中世纪到近代 -->
  <path d="M 420 255 Q 450 175, 475 137" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="440" y="195" style="font-size: 8px; fill: #D32F2F;">反对经院哲学</text>

  <!-- 近代早期理性主义与经验主义 -->
  <path d="M 550 175 L 550 195" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="565" y="187" style="font-size: 8px; fill: #D32F2F;">对立</text>

  <path d="M 550 275 L 550 295" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="565" y="287" style="font-size: 8px; fill: #1976D2;">影响</text>

  <path d="M 550 370 L 550 390" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="565" y="382" style="font-size: 8px; fill: #D32F2F;">质疑</text>

  <!-- 近代到康德 -->
  <path d="M 620 137 L 675 190" class="arrow synthesis-arrow" marker-end="url(#arrow-synthesis)"/>
  <text x="640" y="160" style="font-size: 8px; fill: #9C27B0;">综合</text>

  <path d="M 620 237 L 675 190" class="arrow synthesis-arrow" marker-end="url(#arrow-synthesis)"/>
  <text x="640" y="220" style="font-size: 8px; fill: #9C27B0;">综合</text>

  <path d="M 620 427 Q 650 320, 675 230" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="635" y="330" style="font-size: 8px; fill: #1976D2;">启发</text>

  <!-- 康德之后 -->
  <path d="M 755 230 L 755 255" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="770" y="245" style="font-size: 8px; fill: #388E3C;">发展</text>

  <path d="M 755 335 L 755 355" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="770" y="348" style="font-size: 8px; fill: #D32F2F;">批判</text>

  <path d="M 755 430 L 755 450" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="770" y="442" style="font-size: 8px; fill: #388E3C;">影响</text>

  <!-- 近代到现代 -->
  <path d="M 830 190 L 895 137" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="860" y="160" style="font-size: 8px; fill: #388E3C;">发展</text>

  <path d="M 830 297 L 895 240" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="860" y="270" style="font-size: 8px; fill: #1976D2;">影响</text>

  <path d="M 830 490 L 895 342" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="860" y="420" style="font-size: 8px; fill: #1976D2;">科学方法</text>

  <!-- 现代内部 -->
  <path d="M 975 175 L 975 195" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="990" y="187" style="font-size: 8px; fill: #388E3C;">发展</text>

  <path d="M 975 280 Q 1040 290, 1040 342" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="1010" y="310" style="font-size: 8px; fill: #1976D2;">影响</text>

  <path d="M 975 380 L 975 400" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="990" y="392" style="font-size: 8px; fill: #D32F2F;">批判</text>

  <path d="M 975 475 L 975 495" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="990" y="487" style="font-size: 8px; fill: #1976D2;">影响</text>

  <!-- 现代到后现代 -->
  <path d="M 1050 240 L 1115 185" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="1075" y="210" style="font-size: 8px; fill: #D32F2F;">解构</text>

  <path d="M 1050 535 L 1115 282" class="arrow critique" marker-end="url(#arrow-critique)"/>
  <text x="1075" y="410" style="font-size: 8px; fill: #D32F2F;">批判</text>

  <path d="M 1050 342 L 1115 380" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="1075" y="365" style="font-size: 8px; fill: #388E3C;">发展</text>

  <path d="M 1050 440 L 1115 475" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="1075" y="460" style="font-size: 8px; fill: #1976D2;">影响</text>

  <!-- 后现代内部 -->
  <path d="M 1195 220 L 1195 240" class="arrow develop" marker-end="url(#arrow-develop)"/>
  <text x="1210" y="232" style="font-size: 8px; fill: #388E3C;">发展</text>

  <path d="M 1195 320 Q 1230 340, 1230 370" class="arrow influence" marker-end="url(#arrow-influence)"/>
  <text x="1235" y="345" style="font-size: 8px; fill: #1976D2;">对话</text>

  <!-- 图例 -->
  <g transform="translate(50, 600)">
    <text x="0" y="0" style="font-size: 13px; font-weight: bold; fill: #333;">图例说明</text>
    
    <line x1="0" y1="20" x2="40" y2="20" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-influence)"/>
    <text x="50" y="24" style="font-size: 10px; fill: #333;">影响/继承关系</text>
    
    <line x1="0" y1="38" x2="40" y2="38" stroke="#D32F2F" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-critique)"/>
    <text x="50" y="42" style="font-size: 10px; fill: #333;">批判/反对关系</text>
    
    <line x1="0" y1="56" x2="40" y2="56" stroke="#388E3C" stroke-width="2" marker-end="url(#arrow-develop)"/>
    <text x="50" y="60" style="font-size: 10px; fill: #333;">发展/深化关系</text>
    
    <line x1="0" y1="74" x2="40" y2="74" stroke="#9C27B0" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-synthesis)"/>
    <text x="50" y="78" style="font-size: 10px; fill: #333;">综合/调和关系</text>
    
    <rect x="250" y="10" width="40" height="20" rx="3" fill="#E3F2FD" stroke="#333" stroke-width="1"/>
    <text x="300" y="24" style="font-size: 10px; fill: #333;">本体论为主</text>
    
    <rect x="400" y="10" width="40" height="20" rx="3" fill="#FFE0B2" stroke="#333" stroke-width="1"/>
    <text x="450" y="24" style="font-size: 10px; fill: #333;">认识论为主</text>
    
