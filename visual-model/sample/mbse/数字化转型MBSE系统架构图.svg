  </text>
  <text x="700" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="#666666">
    基于模型驱动系统工程的数字化转型复杂系统建模
  </text>

  <!-- 战略层 (Strategy Layer) -->
