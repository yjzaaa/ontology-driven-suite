  <text x="510" y="380" font-family="Arial" font-size="12" fill="#424242">• 数据采集与治理</text>
  <text x="510" y="395" font-family="Arial" font-size="12" fill="#424242">• 数据分析与洞察</text>
  <text x="510" y="410" font-family="Arial" font-size="12" fill="#424242">• 数据驱动决策</text>

