<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1976D2"/>
    </marker>
    <marker id="arrow-blue-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="10 0, 0 4, 10 8" fill="#1976D2"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#388E3C"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#F57C00"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#D32F2F"/>
    </marker>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#3949AB"/>
    </linearGradient>
    <linearGradient id="legend-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="#FAFBFC"/>

  <!-- 标题区 -->
  <rect x="0" y="0" width="1600" height="100" fill="url(#title-grad)"/>
  <text x="800" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">
    Palantir APEX · 自主规划与执行 · 供应链本体论可视化
  </text>
  <text x="800" y="78" text-anchor="middle" font-size="14" fill="#C5CAE9">
    Fortune 100 CPG 案例 · Foundry 整合 S&amp;OE 与 S&amp;OP · 6 个月创造 $100M+ 价值
  </text>

  <!-- 阶段标签带 -->
  <g font-size="11" fill="#90A4AE" font-weight="600">
    <text x="135" y="295" text-anchor="middle">① 数据接入</text>
    <text x="250" y="295" text-anchor="middle">② 语义建模</text>
    <text x="490" y="295" text-anchor="middle">③ 根因检测</text>
    <text x="730" y="295" text-anchor="middle">④ 预测引擎</text>
    <text x="975" y="295" text-anchor="middle">⑤ 自主执行</text>
    <text x="1215" y="295" text-anchor="middle">⑥ 价值输出</text>
  </g>

  <!-- ============ 外部环境层 ============ -->

  <!-- ERP/TMS/WMS 数据源（云形） -->
  <g filter="url(#soft-shadow)">
    <path d="M 60,210
             C 35,210 30,180 55,168
             C 50,140 90,135 105,153
             C 115,128 155,128 165,150
             C 185,135 215,150 210,175
             C 235,175 240,205 215,210 Z"
          fill="#F5F5F5" stroke="#757575" stroke-width="2"/>
    <text x="135" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#424242">ERP / TMS / WMS</text>
    <text x="135" y="192" text-anchor="middle" font-size="10" fill="#616161">企业供应链数据源</text>
  </g>

  <!-- KPI 业务成果（云形） -->
  <g filter="url(#soft-shadow)">
    <path d="M 1180,215
             C 1155,215 1150,185 1175,173
             C 1170,145 1210,140 1225,158
             C 1235,133 1290,133 1300,155
             C 1320,140 1470,150 1465,175
             C 1495,175 1500,210 1475,215 Z"
          fill="#F5F5F5" stroke="#757575" stroke-width="2"/>
    <text x="1335" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#424242">业务成果 KPI</text>
    <text x="1335" y="180" text-anchor="middle" font-size="10" fill="#616161">$100M+ 价值 · 9,700+ 自动移动</text>
    <text x="1335" y="196" text-anchor="middle" font-size="10" fill="#616161">$69M 防短单 · $15.6M 重分配 · $3M 重排</text>
  </g>

  <!-- ============ Foundry 核心处理层 ============ -->

  <!-- 1. Foundry 数据集成（矩形） -->
  <g filter="url(#soft-shadow)">
    <rect x="160" y="335" width="180" height="90" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
    <text x="250" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">Foundry</text>
    <text x="250" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#0D47A1">数据集成</text>
    <text x="250" y="410" text-anchor="middle" font-size="10" fill="#1565C0">统一视图 · 消除孤岛</text>
  </g>
  <circle cx="160" cy="380" r="4" fill="#1976D2"/>
  <circle cx="340" cy="380" r="4" fill="none" stroke="#1976D2" stroke-width="1.5"/>

  <!-- 2. Ontology 本体（圆角矩形 - 有状态/记忆） -->
  <g filter="url(#soft-shadow)">
    <rect x="390" y="335" width="200" height="90" rx="14" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
    <text x="490" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">Ontology 本体</text>
    <text x="490" y="385" text-anchor="middle" font-size="10" fill="#2E7D32">对象 · 属性 · 动作 · 规则</text>
    <text x="490" y="402" text-anchor="middle" font-size="10" fill="#2E7D32">语义化业务模型</text>
  </g>
  <circle cx="390" cy="380" r="4" fill="#388E3C"/>
  <circle cx="590" cy="380" r="4" fill="none" stroke="#388E3C" stroke-width="1.5"/>

  <!-- 3. 根因信号检测（菱形 - 判断节点） -->
  <g filter="url(#soft-shadow)">
    <polygon points="730,325 830,380 730,435 630,380" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
    <text x="730" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#F57F17">根因信号</text>
    <text x="730" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#F57F17">检测</text>
    <text x="730" y="406" text-anchor="middle" font-size="9" fill="#F9A825">生产 · 供应商 · 物流</text>
  </g>

  <!-- 4. APEX 预测引擎（六边形 - 决策控制） -->
  <g filter="url(#soft-shadow)">
    <polygon points="870,380 920,335 1030,335 1080,380 1030,425 920,425" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <text x="975" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#4A148C">APEX</text>
    <text x="975" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#4A148C">预测引擎</text>
    <text x="975" y="410" text-anchor="middle" font-size="10" fill="#6A1B9A">差异预测 · 方案推荐</text>
  </g>

  <!-- 5. 自动化执行（六边形 - 决策控制） -->
  <g filter="url(#soft-shadow)">
    <polygon points="1110,380 1160,335 1270,335 1320,380 1270,425 1160,425" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
    <text x="1215" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#4A148C">自动化</text>
    <text x="1215" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#4A148C">执行引擎</text>
    <text x="1215" y="410" text-anchor="middle" font-size="10" fill="#6A1B9A">重分配 · 重排 · 移动</text>
  </g>

  <!-- ============ 数据存储与输出层 ============ -->

  <!-- Source of Truth（圆形 - 数据池） -->
  <g filter="url(#soft-shadow)">
    <circle cx="580" cy="600" r="78" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
    <text x="580" y="585" text-anchor="middle" font-size="13" font-weight="700" fill="#F57F17">Source</text>
    <text x="580" y="603" text-anchor="middle" font-size="13" font-weight="700" fill="#F57F17">of Truth</text>
    <text x="580" y="623" text-anchor="middle" font-size="10" fill="#F9A825">真相源 · 单一事实</text>
  </g>

  <!-- S&OP / S&OE 流程（圆角矩形 - 输出/带状态） -->
  <g filter="url(#soft-shadow)">
    <rect x="870" y="555" width="220" height="90" rx="14" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
    <text x="980" y="582" text-anchor="middle" font-size="14" font-weight="700" fill="#BF360C">S&amp;OP / S&amp;OE</text>
    <text x="980" y="602" text-anchor="middle" font-size="11" fill="#E65100">规划与执行整合</text>
    <text x="980" y="622" text-anchor="middle" font-size="10" fill="#E65100">反应窗口 24h → 数周</text>
  </g>

  <!-- ============ 连接线 ============ -->

  <!-- 主流程关键路径（粗红线） -->
  <!-- ① ERP → Foundry集成 -->
  <path d="M 135,220 C 135,275 250,280 250,335" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="155" y="280" font-size="10" fill="#D32F2F" font-weight="600">ERP数据</text>

  <!-- ② Foundry集成 → Ontology -->
  <path d="M 340,380 L 386,380" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>

  <!-- ③ Ontology → 根因信号 -->
  <path d="M 590,380 L 626,380" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>

  <!-- ④ 根因信号 → APEX预测 -->
  <path d="M 830,380 L 866,380" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="848" y="372" font-size="9" fill="#D32F2F" font-weight="600">信号</text>

  <!-- ⑤ APEX预测 → 自动化执行 -->
  <path d="M 1080,380 L 1106,380" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="1093" y="372" font-size="9" fill="#D32F2F" font-weight="600">方案</text>

  <!-- 辅助数据流（实线蓝） -->
  <!-- ⑥ 自动化执行 → KPI -->
  <path d="M 1270,335 C 1270,260 1340,260 1340,237" stroke="#1976D2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="1316" y="282" font-size="10" fill="#1976D2">业务输出</text>

  <!-- ⑦ 自动化执行 → S&OP/S&OE -->
  <path d="M 1215,425 C 1215,495 980,505 980,555" stroke="#1976D2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="1043" y="497" font-size="10" fill="#1976D2">执行接入流程</text>

  <!-- ⑧ S&OP/S&OE ↔ Source of Truth -->
  <path d="M 870,600 L 660,600" stroke="#1976D2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue-start)"/>
  <text x="765" y="590" text-anchor="middle" font-size="10" fill="#1976D2">流程刷新</text>

  <!-- 反馈流（点线橙） -->
  <!-- ⑨ APEX预测 → Source of Truth（更新真相源）走下弧 -->
  <path d="M 975,425 C 975,505 720,540 600,548" stroke="#F57C00" stroke-width="1.6" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
  <text x="800" y="538" font-size="10" fill="#F57C00" font-weight="600">① 更新真相源</text>

  <!-- ⑩ Source of Truth → Ontology（刷新本体，闭环）走上弧 -->
  <path d="M 540,535 C 490,500 470,470 488,427" stroke="#F57C00" stroke-width="1.6" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
  <text x="430" y="500" font-size="10" fill="#F57C00" font-weight="600">② 刷新本体</text>

  <!-- 控制流（虚线绿） - APEX预测 ⇢ 自动化执行 触发 -->
  <path d="M 975,335 C 975,300 1215,300 1215,335" stroke="#388E3C" stroke-width="1.5" fill="none" stroke-dasharray="8,4" marker-end="url(#arrow-green)"/>
  <text x="1095" y="295" text-anchor="middle" font-size="10" fill="#388E3C" font-weight="600">触发自主执行</text>

  <!-- ============ 底部图例区 ============ -->
  <rect x="30" y="720" width="1540" height="160" rx="8" fill="url(#legend-grad)" stroke="#CFD8DC" stroke-width="1"/>

  <!-- 图例标题 -->
  <text x="50" y="745" font-size="13" font-weight="700" fill="#37474F">图例</text>

  <!-- 形状含义 -->
  <g transform="translate(50,760)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#546E7A">组件形状</text>

    <rect x="0" y="12" width="30" height="18" rx="2" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
    <text x="38" y="25" font-size="11" fill="#37474F">矩形：基础功能组件</text>

    <rect x="190" y="12" width="30" height="18" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
    <text x="228" y="25" font-size="11" fill="#37474F">圆角矩形：有状态/记忆组件</text>

    <polygon points="410,21 425,12 440,21 425,30" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
    <text x="448" y="25" font-size="11" fill="#37474F">菱形：判断/分支节点</text>

    <polygon points="600,12 615,12 625,21 615,30 600,30 590,21" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="633" y="25" font-size="11" fill="#37474F">六边形：决策/控制组件</text>

    <circle cx="800" cy="21" r="10" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
    <text x="815" y="25" font-size="11" fill="#37474F">圆形：数据存储/资源池</text>

    <path d="M 945,30 C 935,30 933,22 940,20 C 938,12 950,11 954,16 C 958,10 970,11 970,18 C 977,18 978,28 970,30 Z"
          fill="#F5F5F5" stroke="#757575" stroke-width="1.2"/>
    <text x="985" y="25" font-size="11" fill="#37474F">云形：外部系统/环境</text>

    <text x="0" y="55" font-size="11" font-weight="600" fill="#546E7A">连接线类型</text>

    <line x1="0" y1="72" x2="40" y2="72" stroke="#D32F2F" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="48" y="76" font-size="11" fill="#37474F">关键路径（主流程）</text>

    <line x1="190" y1="72" x2="230" y2="72" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="238" y="76" font-size="11" fill="#37474F">数据流</text>

    <line x1="320" y1="72" x2="360" y2="72" stroke="#388E3C" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrow-green)"/>
    <text x="368" y="76" font-size="11" fill="#37474F">控制流（触发）</text>

    <line x1="490" y1="72" x2="530" y2="72" stroke="#F57C00" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
    <text x="538" y="76" font-size="11" fill="#37474F">反馈流（点线）</text>
  </g>

  <!-- 核心逻辑说明 -->
  <g transform="translate(720,745)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1A237E">核心逻辑闭环 · 本体论驱动的自主供应链</text>

    <text x="0" y="22" font-size="11" fill="#37474F">
      <tspan font-weight="700" fill="#D32F2F">主路径：</tspan>
      <tspan>ERP/TMS/WMS → Foundry 数据集成 → Ontology 语义建模 → 根因信号检测 → APEX 差异预测 → 自主执行 → 业务价值</tspan>
    </text>

    <text x="0" y="42" font-size="11" fill="#37474F">
      <tspan font-weight="700" fill="#F57C00">闭环反馈：</tspan>
      <tspan>APEX 自动更新 Source of Truth（真相源），并反向刷新 Ontology 本体，使规划与执行不再孤立</tspan>
    </text>

    <text x="0" y="62" font-size="11" fill="#37474F">
      <tspan font-weight="700" fill="#7B1FA2">本体论核心：</tspan>
      <tspan>把现实世界的「对象（库存/订单/移动）+ 动作（重分配/重排）+ 关系（差异检测）+ 规则（根因→预测→行动）」建模为可计算的语义模型</tspan>
    </text>

    <text x="0" y="82" font-size="11" fill="#37474F">
      <tspan font-weight="700" fill="#388E3C">价值落点：</tspan>
      <tspan>打通 S&amp;OP（周级规划）与 S&amp;OE（日级执行）孤岛，反应窗口从 &lt;24h 延长到数周，6 个月创造 $100M+ 价值</tspan>
    </text>
  </g>

  <!-- 底部署名 -->
  <text x="1550" y="868" text-anchor="end" font-size="9" fill="#90A4AE">
    Source: Palantir APEX Case Study (2022) · SBR 建模法可视化
  </text>
</svg>
