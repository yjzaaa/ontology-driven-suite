<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS服务商的困局与出路 - SBR可视化建模</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f0f5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        svg {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
        }
        .layer-bg {
            stroke: #e0e0e0;
            stroke-width: 1;
            stroke-dasharray: 6,4;
        }
        .layer-label {
            font-size: 13px;
            font-weight: 700;
            fill: #888;
        }
        .layer-subtitle {
            font-size: 11px;
            fill: #aaa;
        }
        .comp-shape {
            stroke-width: 2.5;
            cursor: default;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.15));
        }
        .comp-name {
            font-size: 13px;
            font-weight: 600;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }
        .comp-sub {
            font-size: 10px;
            fill: #777;
            text-anchor: middle;
            pointer-events: none;
        }
        .conn {
            fill: none;
            stroke-width: 2;
        }
        .conn-label {
            font-size: 10px;
            fill: #555;
            text-anchor: middle;
            pointer-events: none;
            paint-order: stroke;
            stroke: white;
            stroke-width: 3;
        }
        .title-main {
            font-size: 24px;
            font-weight: 700;
            fill: #333;
            text-anchor: middle;
        }
        .title-sub {
            font-size: 13px;
            fill: #888;
            text-anchor: middle;
        }
        .legend-text {
            font-size: 11px;
            fill: #444;
        }
        .separator-line {
            stroke: #D32F2F;
            stroke-width: 2;
            stroke-dasharray: 10,5;
        }
        .separator-label {
            font-size: 14px;
            font-weight: 700;
            fill: #D32F2F;
            text-anchor: middle;
        }
        .annotation {
            font-size: 10px;
            fill: #999;
            font-style: italic;
        }
        .arrow-key-text {
            font-size: 11px;
            font-weight: 600;
            fill: #D32F2F;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <svg id="main-svg"></svg>

    <script>
    // ============================================
    // SBR建模数据
    // 文章：《SaaS应用和SaaS服务商》核心观点可视化
    // ============================================

    const W = 1600, H = 900;

    const DATA = {
        title: "SaaS服务商的困局与出路",
        subtitle: "AI时代SaaS商业模式SBR分析 — 来源：人月聊IT",

        // 4层布局
        layers: [
            { name: "商业模式层", sub: "SaaS困局：烧钱模式失效", y: 75, h: 130, color: "#FFEBEE" },
            { name: "护城河层",   sub: "用户 → 资源 → 数据 三层递进", y: 235, h: 130, color: "#E3F2FD" },
            { name: "冲击层",     sub: "AI编程 + 大厂生态 双重夹击", y: 395, h: 110, color: "#FFF3E0" },
            { name: "出路层",     sub: "三条破局路径", y: 560, h: 160, color: "#E8F5E9" }
        ],

        // 9个核心组件
        components: [
            // Layer 1: 商业模式层
            {
                id: "investor", name: "投资机构", sub: "资金来源",
                shape: "cloud", x: 300, y: 140, w: 150, h: 60,
                fill: "#F5F5F5", stroke: "#757575",
                desc: "AI时代投资意愿下降，SaaS赚慢钱模式难获融资"
            },
            {
                id: "saas", name: "SaaS服务商", sub: "核心主体",
                shape: "rounded", x: 800, y: 140, w: 170, h: 65,
                fill: "#E8F5E9", stroke: "#388E3C",
                desc: "前期大量烧钱获客，期望后期通过资源整合和数据变现盈利"
            },
            {
                id: "user", name: "企业用户", sub: "付费客户",
                shape: "cloud", x: 1300, y: 140, w: 150, h: 60,
                fill: "#F5F5F5", stroke: "#757575",
                desc: "SaaS通用功能难满足个性化需求，AI时代可自行构建"
            },

            // Layer 2: 护城河层
            {
                id: "moat-user", name: "用户护城河", sub: "第一层",
                shape: "ellipse", x: 450, y: 300, w: 150, h: 65,
                fill: "#E1F5FE", stroke: "#0277BD",
                desc: "前期烧钱积累的企业用户规模，但AI时代用户粘性下降"
            },
            {
                id: "moat-res", name: "资源护城河", sub: "第二层",
                shape: "ellipse", x: 800, y: 300, w: 150, h: 65,
                fill: "#E1F5FE", stroke: "#0277BD",
                desc: "上下游生态整合与议价权，价值远大于初期用户"
            },
            {
                id: "moat-data", name: "数据护城河", sub: "第三层",
                shape: "ellipse", x: 1150, y: 300, w: 150, h: 65,
                fill: "#E1F5FE", stroke: "#0277BD",
                desc: "长期积累的业务数据，通过分析和挖掘产生深层价值"
            },

            // Layer 3: 冲击层
            {
                id: "ai", name: "AI编程", sub: "颠覆者",
                shape: "diamond", x: 300, y: 450, w: 150, h: 75,
                fill: "#FFF9C4", stroke: "#F9A825",
                desc: "稍有技术背景的人即可快速构建同类系统，通用功能不再是壁垒"
            },
            {
                id: "giant", name: "大厂生态", sub: "价格碾压",
                shape: "rect", x: 1300, y: 450, w: 150, h: 65,
                fill: "#FFE0B2", stroke: "#E65100",
                desc: "企微/钉钉/飞书免费基础功能，打穿行业价格体系"
            },

            // Layer 4: 出路层
            {
                id: "vertical", name: "垂直行业SaaS", sub: "行业Know-how壁垒",
                shape: "rounded", x: 400, y: 640, w: 180, h: 75,
                fill: "#E8F5E9", stroke: "#2E7D32",
                desc: "深耕建筑/医疗等行业，绑定政策法规与业务流转，替换成本极高"
            },
            {
                id: "overseas", name: "出海SaaS", sub: "赚取海外订阅费",
                shape: "rounded", x: 800, y: 640, w: 180, h: 75,
                fill: "#E8F5E9", stroke: "#2E7D32",
                desc: "国内打磨好的标准化产品，做多语言适配和合规后卖到东南亚/中东/欧美"
            },
            {
                id: "asset", name: "重资产模式", sub: "线上线下深度绑定",
                shape: "rounded", x: 1200, y: 640, w: 180, h: 75,
                fill: "#E8F5E9", stroke: "#2E7D32",
                desc: "线上应用+线下配送资源深度绑定，壁垒极高但投入和风险翻倍"
            }
        ],

        // 连接关系
        connections: [
            // 主流程：商业模式循环
            { from: "investor", to: "saas", label: "资金支撑", type: "control",
              path: "M 375,140 L 715,140" },
            { from: "saas", to: "user", label: "烧钱获客", type: "data",
              path: "M 885,140 L 1225,140" },

            // 用户沉淀到护城河
            { from: "user", to: "moat-user", label: "用户沉淀", type: "data",
              path: "M 1300,170 C 1300,230 450,230 450,268" },

            // 护城河三层递进（关键路径）
            { from: "moat-user", to: "moat-res", label: "生态整合", type: "key",
              path: "M 525,300 L 725,300" },
            { from: "moat-res", to: "moat-data", label: "数据挖掘", type: "key",
              path: "M 875,300 L 1075,300" },

            // AI冲击（反馈流，向上）
            { from: "ai", to: "moat-user", label: "功能复制", type: "feedback",
              path: "M 340,413 C 370,380 400,350 420,332" },

            // 大厂冲击
            { from: "giant", to: "moat-res", label: "生态碾压", type: "feedback",
              path: "M 1260,418 C 1200,380 950,350 870,332" },

            // 数据变现回路（反馈到SaaS服务商）
            { from: "moat-data", to: "saas", label: "数据变现", type: "feedback",
              path: "M 1150,268 C 1150,210 950,180 885,160" }
        ],

        // 出路标注（不画连线，用破局分界线分隔）
        breakthrough: {
            y: 530,
            label: "▼ 破局方向 ▼"
        }
    };

    // ============================================
    // D3.js 静态渲染
    // ============================================

    const svg = d3.select("#main-svg").attr("width", W).attr("height", H);
    const defs = svg.append("defs");

    // 箭头定义
    const arrowColors = {
        data: "#1976D2",
        control: "#388E3C",
        feedback: "#F57C00",
        key: "#D32F2F"
    };

    Object.entries(arrowColors).forEach(([type, color]) => {
        defs.append("marker")
            .attr("id", `arrow-${type}`)
            .attr("markerWidth", 10).attr("markerHeight", 7)
            .attr("refX", 10).attr("refY", 3.5)
            .attr("orient", "auto")
            .append("polygon")
            .attr("points", "0 0, 10 3.5, 0 7")
            .attr("fill", color);
    });

    const root = svg.append("g");

    // ---- 1. 绘制层背景 ----
    const layerG = root.append("g");
    DATA.layers.forEach(l => {
        layerG.append("rect")
            .attr("x", 40).attr("y", l.y)
            .attr("width", W - 80).attr("height", l.h)
            .attr("class", "layer-bg")
            .attr("fill", l.color).attr("opacity", 0.25)
            .attr("rx", 6);

        layerG.append("text")
            .attr("x", 60).attr("y", l.y + 22)
            .attr("class", "layer-label")
            .text(l.name);

        layerG.append("text")
            .attr("x", 60).attr("y", l.y + 38)
            .attr("class", "layer-subtitle")
            .text(l.sub);
    });

    // ---- 2. 绘制连接线 ----
    const connG = root.append("g");
    DATA.connections.forEach(c => {
        const styleMap = {
            data:    { stroke: "#1976D2", width: 2,   dash: "none" },
            control: { stroke: "#388E3C", width: 2,   dash: "8,4" },
            feedback:{ stroke: "#F57C00", width: 1.8, dash: "5,3" },
            key:     { stroke: "#D32F2F", width: 3,   dash: "none" }
        };
        const s = styleMap[c.type];

        connG.append("path")
            .attr("d", c.path)
            .attr("class", "conn")
            .attr("stroke", s.stroke)
            .attr("stroke-width", s.width)
            .attr("stroke-dasharray", s.dash === "none" ? null : s.dash)
            .attr("marker-end", `url(#arrow-${c.type})`)
            .attr("opacity", 0.8);

        // 标签放在路径中点
        const pathEl = connG.select("path:last-child").node();
        if (pathEl) {
            const mid = pathEl.getPointAtLength(pathEl.getTotalLength() / 2);
            connG.append("text")
                .attr("x", mid.x).attr("y", mid.y - 6)
                .attr("class", "conn-label")
                .text(c.label);
        }
    });

    // ---- 3. 绘制组件 ----
    const compG = root.append("g");
    DATA.components.forEach(comp => {
        const g = compG.append("g")
            .attr("transform", `translate(${comp.x - comp.w/2}, ${comp.y - comp.h/2})`);

        // 形状
        switch(comp.shape) {
            case "ellipse":
                g.append("ellipse")
                    .attr("cx", comp.w/2).attr("cy", comp.h/2)
                    .attr("rx", comp.w/2).attr("ry", comp.h/2)
                    .attr("class", "comp-shape")
                    .attr("fill", comp.fill).attr("stroke", comp.stroke);
                break;
            case "diamond":
                g.append("polygon")
                    .attr("points", `${comp.w/2},0 ${comp.w},${comp.h/2} ${comp.w/2},${comp.h} 0,${comp.h/2}`)
                    .attr("class", "comp-shape")
                    .attr("fill", comp.fill).attr("stroke", comp.stroke);
                break;
            case "cloud":
                g.append("ellipse")
                    .attr("cx", comp.w/2).attr("cy", comp.h/2)
                    .attr("rx", comp.w/2).attr("ry", comp.h/2)
                    .attr("class", "comp-shape")
                    .attr("fill", comp.fill).attr("stroke", comp.stroke)
                    .attr("stroke-dasharray", "5,3");
                break;
            case "rounded":
                g.append("rect")
                    .attr("width", comp.w).attr("height", comp.h)
                    .attr("rx", 14).attr("ry", 14)
                    .attr("class", "comp-shape")
                    .attr("fill", comp.fill).attr("stroke", comp.stroke);
                break;
            default:
                g.append("rect")
                    .attr("width", comp.w).attr("height", comp.h)
                    .attr("rx", 4).attr("ry", 4)
                    .attr("class", "comp-shape")
                    .attr("fill", comp.fill).attr("stroke", comp.stroke);
        }

        // 文字
        g.append("text")
            .attr("x", comp.w/2).attr("y", comp.h/2 - 5)
            .attr("class", "comp-name")
            .text(comp.name);
        g.append("text")
            .attr("x", comp.w/2).attr("y", comp.h/2 + 12)
            .attr("class", "comp-sub")
            .text(comp.sub);
    });

    // ---- 4. 破局分界线 ----
    const sepY = 530;
    root.append("line")
        .attr("x1", 80).attr("y1", sepY)
        .attr("x2", W - 80).attr("y2", sepY)
        .attr("class", "separator-line");

    root.append("text")
        .attr("x", W / 2).attr("y", sepY - 8)
        .attr("class", "separator-label")
        .text("▼ 破局方向：SaaS服务商的三条出路 ▼");

    // ---- 5. 出路层标注 ----
    const pathAnnotations = [
        { x: 400, y: 720, text: "绑政策法规 · 替换成本极高" },
        { x: 800, y: 720, text: "海外按年付费 · 正向现金流" },
        { x: 1200, y: 720, text: "壁垒高 · 但投入风险翻倍" }
    ];
    pathAnnotations.forEach(a => {
        root.append("text")
            .attr("x", a.x).attr("y", a.y)
            .attr("class", "annotation")
            .attr("text-anchor", "middle")
            .text(a.text);
    });

    // ---- 6. 关键观点标注 ----
    // 护城河递进标注
    root.append("text")
        .attr("x", 800).attr("y", 360)
        .attr("class", "arrow-key-text")
        .text("⟹ 三层递进：用户 → 资源 → data ⟹");

    // 困局核心观点
    root.append("text")
        .attr("x", 800).attr("y", 210)
        .attr("class", "annotation")
        .attr("text-anchor", "middle")
        .text("核心逻辑：前期大量烧钱 → 积累用户 → 资源整合 → 数据变现。但AI时代投资撤退，现金流断裂");

    // AI冲击标注
    root.append("text")
        .attr("x", 300).attr("y", 505)
        .attr("class", "annotation")
        .attr("text-anchor", "middle")
        .text("通用功能可被AI快速复制");

    root.append("text")
        .attr("x", 1300).attr("y", 525)
        .attr("class", "annotation")
        .attr("text-anchor", "middle")
        .text("免费功能打穿价格体系");

    // ---- 7. 标题 ----
    root.append("text")
        .attr("x", W / 2).attr("y", 35)
        .attr("class", "title-main")
        .text(DATA.title);
    root.append("text")
        .attr("x", W / 2).attr("y", 55)
        .attr("class", "title-sub")
        .text(DATA.subtitle);

    // ---- 8. 图例 ----
    const legend = root.append("g").attr("transform", "translate(1280, 770)");
    legend.append("rect")
        .attr("width", 290).attr("height", 115)
        .attr("fill", "white").attr("stroke", "#ddd")
        .attr("stroke-width", 1).attr("rx", 6).attr("opacity", 0.95);

    legend.append("text")
        .attr("x", 145).attr("y", 18)
        .attr("text-anchor", "middle")
        .attr("font-size", "12px").attr("font-weight", "700")
        .text("图例");

    const legendItems = [
        { y: 38, color: "#1976D2", dash: null, label: "实线 → 数据流" },
        { y: 55, color: "#388E3C", dash: "8,4", label: "虚线 ⇢ 控制流" },
        { y: 72, color: "#F57C00", dash: "5,3", label: "点线 ··→ 反馈/冲击" },
        { y: 89, color: "#D32F2F", dash: null, label: "粗线 ⟹ 关键路径" }
    ];
    legendItems.forEach(item => {
        legend.append("line")
            .attr("x1", 15).attr("y1", item.y)
            .attr("x2", 50).attr("y2", item.y)
            .attr("stroke", item.color)
            .attr("stroke-width", item.label.includes("粗") ? 3 : 2)
            .attr("stroke-dasharray", item.dash);
        legend.append("text")
            .attr("x", 58).attr("y", item.y + 4)
            .attr("class", "legend-text")
            .text(item.label);
    });

    // 形状图例
    const shapeLegend = root.append("g").attr("transform", "translate(60, 770)");
    shapeLegend.append("rect")
        .attr("width", 290).attr("height", 115)
        .attr("fill", "white").attr("stroke", "#ddd")
        .attr("stroke-width", 1).attr("rx", 6).attr("opacity", 0.95);

    shapeLegend.append("text")
        .attr("x", 145).attr("y", 18)
        .attr("text-anchor", "middle")
        .attr("font-size", "12px").attr("font-weight", "700")
        .text("组件形状");

    const shapeItems = [
        { y: 38, shape: "cloud", label: "云形：外部环境" },
        { y: 55, shape: "rounded", label: "圆角矩形：核心主体" },
        { y: 72, shape: "ellipse", label: "椭圆：护城河/资源" },
        { y: 89, shape: "diamond", label: "菱形：颠覆/判断" }
    ];
    shapeItems.forEach(item => {
        const sx = 20, sy = item.y - 5;
        if (item.shape === "cloud") {
            shapeLegend.append("ellipse")
                .attr("cx", sx + 10).attr("cy", sy + 3)
                .attr("rx", 12).attr("ry", 8)
                .attr("fill", "#F5F5F5").attr("stroke", "#757575")
                .attr("stroke-dasharray", "3,2");
        } else if (item.shape === "rounded") {
            shapeLegend.append("rect")
                .attr("x", sx).attr("y", sy - 2)
                .attr("width", 22).attr("height", 12)
                .attr("rx", 5).attr("fill", "#E8F5E9").attr("stroke", "#388E3C");
        } else if (item.shape === "ellipse") {
            shapeLegend.append("ellipse")
                .attr("cx", sx + 10).attr("cy", sy + 3)
                .attr("rx", 12).attr("ry", 8)
                .attr("fill", "#E1F5FE").attr("stroke", "#0277BD");
        } else if (item.shape === "diamond") {
            shapeLegend.append("polygon")
                .attr("points", `${sx+10},${sy-5} ${sx+22},${sy+3} ${sx+10},${sy+10} ${sx},${sy+3}`)
                .attr("fill", "#FFF9C4").attr("stroke", "#F9A825");
        }
        shapeLegend.append("text")
            .attr("x", 50).attr("y", item.y + 4)
            .attr("class", "legend-text")
            .text(item.label);
    });

    </script>
</body>
</html>
