<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金刚经导图 · SBR可视化动态模型</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#1a1a2e;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}
#container{
  width:1600px;
  height:900px;
  position:relative;
  background:radial-gradient(ellipse at center,#2a2a4a 0%,#1a1a2e 70%,#0f0f1e 100%);
}
#canvas{display:block;}
#tooltip{
  position:absolute;
  pointer-events:none;
  background:rgba(20,20,40,0.95);
  border:1px solid rgba(212,160,23,0.6);
  border-radius:8px;
  padding:12px 16px;
  max-width:360px;
  font-size:13px;
  color:#e0e0e0;
  line-height:1.6;
  opacity:0;
  transition:opacity 0.2s;
  z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  word-wrap:break-word;
}
#tooltip .tt-title{
  font-size:15px;
  font-weight:bold;
  color:#D4A017;
  margin-bottom:6px;
}
#tooltip .tt-section{
  margin-top:6px;
  font-size:12px;
}
#tooltip .tt-label{
  color:#D4A017;
  font-weight:bold;
}
#tooltip .tt-quote{
  margin-top:8px;
  padding-top:6px;
  border-top:1px solid rgba(212,160,23,0.3);
  font-style:italic;
  color:#b0b0c0;
  font-size:11px;
}
@keyframes pulse-gold{
  0%,100%{filter:drop-shadow(0 0 8px rgba(212,160,23,0.6));}
  50%{filter:drop-shadow(0 0 20px rgba(212,160,23,1));}
}
@keyframes breathe{
  0%,100%{opacity:0.3;}
  50%{opacity:0.8;}
}
@keyframes rotate-slow{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
@keyframes dashFlow{
  to{stroke-dashoffset:-20;}
}
.node-label{
  pointer-events:none;
  user-select:none;
}
</style>
</head>
<body>
<div id="container">
<div id="tooltip"></div>
<svg id="canvas" viewBox="0 0 1600 900" width="1600" height="900"></svg>
</div>

merge.append("feMergeNode").attr("in","blur");

// Soft glow

smerge.append("feMergeNode").attr("in","blur");

  {id:"arrow-purple",color:"#BA68C8"},
  {id:"arrow-blue",color:"#64B5F6"},
  {id:"arrow-gray",color:"#9E9E9E"},
  {id:"arrow-green",color:"#81C784"},
  {id:"arrow-white",color:"#FFFFFF"},

// ========== HELPER: Get node by id ==========
function getNode(id){return nodes.find(n=>n.id===id);}

function getNodeCenter(n){
  return{x:n.x,y:n.y};
}

function getNodeEdge(n,targetX,targetY){
  const cx=n.x,cy=n.y;
  if(n.shape==="circle"){
    const dx=targetX-cx,dy=targetY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist===0)return{x:cx,y:cy};
    return{x:cx+dx*n.r/dist,y:cy+dy*n.r/dist};
  }
  if(n.shape==="hexagon"){
    const dx=targetX-cx,dy=targetY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist===0)return{x:cx,y:cy};
    return{x:cx+dx*(n.r*0.9)/dist,y:cy+dy*(n.r*0.9)/dist};
  }
  // rect/roundRect/cloud/diamond - approximate with bounding box
  const hw=(n.w||100)/2,hh=(n.h||50)/2;
  const dx=targetX-cx,dy=targetY-cy;
  if(Math.abs(dx)*hh>Math.abs(dy)*hw&&dx!==0){
    return{x:cx+Math.sign(dx)*hw,y:cy+dy*hw/Math.abs(dx)};
  }else if(dy!==0){
    return{x:cx+dx*hh/Math.abs(dy),y:cy+Math.sign(dy)*hh};
  }
  return{x:cx,y:cy};
}

// ========== DRAW LINKS ==========
const linkGroup=svg.append("g").attr("class","links");

// Store link paths for particle animation
const linkPathMap={};

links.forEach((l,i)=>{
  const s=getNode(l.source),t=getNode(l.target);
  const sc=getNodeCenter(s),tc=getNodeCenter(t);
  const se=getNodeEdge(s,tc.x,tc.y);
  const te=getNodeEdge(t,sc.x,sc.y);

  let pathD;
  const dx=te.x-se.x,dy=te.y-se.y;
  const dist=Math.sqrt(dx*dx+dy*dy);

  if(l.pathType==="curve-left"){
    // Custom curve: arc left to avoid passing through emptiness node
    const midX=se.x-130;
    const midY=(se.y+te.y)/2;
    pathD=`M${se.x},${se.y} Q${midX},${midY} ${te.x},${te.y}`;
  }else if(l.type==="break"){
    // Sharp zigzag for "break" connections
    const mx=(se.x+te.x)/2,my=(se.y+te.y)/2;
    const perpX=-dy/dist*15,perpY=dx/dist*15;
    pathD=`M${se.x},${se.y} L${mx-perpX},${my-perpY} L${mx+perpX},${my+perpY} L${te.x},${te.y}`;
  }else if(dist>250){
    // Bezier curve
    const cx1=se.x+(te.x-se.x)*0.3;
    const cy1=se.y+(te.y-se.y)*0.1;
    const cx2=se.x+(te.x-se.x)*0.7;
    const cy2=se.y+(te.y-se.y)*0.9;
    pathD=`M${se.x},${se.y} C${cx1},${cy1} ${cx2},${cy2} ${te.x},${te.y}`;
  }else{
    // Slight curve
    const mx=(se.x+te.x)/2,my=(se.y+te.y)/2;
    const perpX=-dy/dist*20,perpY=dx/dist*20;
    pathD=`M${se.x},${se.y} Q${mx+perpX},${my+perpY} ${te.x},${te.y}`;
  }

  // Store path for particle animation
  linkPathMap[`${l.source}-${l.target}`]=pathD;

  let arrowRef="";
  if(l.color==="#D4A017")arrowRef="url(#arrow-gold)";
  else if(l.color==="#EF5350")arrowRef="url(#arrow-red)";
  else if(l.color==="#4DB6AC")arrowRef="url(#arrow-teal)";
  else if(l.color==="#BA68C8")arrowRef="url(#arrow-purple)";
  else if(l.color==="#64B5F6")arrowRef="url(#arrow-blue)";
  else if(l.color==="#9E9E9E")arrowRef="url(#arrow-gray)";
  else if(l.color==="#81C784")arrowRef="url(#arrow-green)";
  else arrowRef="url(#arrow-white)";

  const path=linkGroup.append("path")
    .attr("d",pathD)
    .attr("fill","none")
    .attr("stroke",l.color)
    .attr("stroke-width",l.width)
    .attr("opacity",l.type==="break"?0.4:0.6)
    .attr("stroke-dasharray",l.dash==="none"?null:l.dash)
    .attr("marker-end",arrowRef);

  // Animate progress links with flowing dashes
  if(l.type==="progress"){
    path.attr("stroke-dasharray","6,4")
      .style("animation",`dashFlow ${2+i*0.2}s linear infinite`);
  }
  if(l.type==="tool"){
    path.attr("stroke-dasharray","8,4")
      .style("animation",`dashFlow 3s linear infinite`);
  }
  if(l.type==="culmination"||l.type==="converge"){
    path.attr("opacity",0.7)
      .style("animation",`breathe 3s ease-in-out infinite`);
  }

  // Link label
  if(l.label){
    const mx=(se.x+te.x)/2,my=(se.y+te.y)/2;
    if(l.labelOffset){
      linkGroup.append("text")
        .attr("x",l.labelOffset.x).attr("y",l.labelOffset.y)
        .attr("text-anchor","middle")
        .attr("fill","rgba(255,255,255,0.7)")
        .attr("font-size","12")
        .attr("font-style","italic")
        .style("text-shadow","0 1px 3px rgba(0,0,0,0.8)")
        .text(l.label);
    }else{
      linkGroup.append("text")
        .attr("x",mx).attr("y",my-5)
        .attr("text-anchor","middle")
        .attr("fill",l.color)
        .attr("font-size","14")
        .attr("font-weight","bold")
        .attr("opacity",0.8)
        .style("text-shadow","0 1px 3px rgba(0,0,0,0.8)")
        .text(l.label);
    }
  }
});

      .attr("fill","none")
      .attr("stroke","#FF5252")
      .attr("stroke-width",1)
      .attr("opacity",0.5)
      .style("animation",`breathe 2s ease-in-out infinite`);
  }
  else if(n.shape==="cloud"){
    const hw=n.w/2,hh=n.h/2;
    // Cloud shape using path
    const cloudPath=`M${-hw+15},${hh} Q${-hw-5},${hh*0.3} ${-hw+10},${-hh*0.3} Q${-hw+5},${-hh} ${-hw+30},${-hh} Q${0},${-hh-8} ${hw-30},${-hh} Q${hw-5},${-hh} ${hw-10},${-hh*0.3} Q${hw+5},${hh*0.3} ${hw-15},${hh} Q${hw-30},${hh+5} ${0},${hh+5} Q${-hw+30},${hh+5} ${-hw+15},${hh} Z`;
    shape=g.append("path")
      .attr("d",cloudPath)
      .attr("fill",n.grad)
      .attr("stroke",n.color)
      .attr("stroke-width",2)
      .attr("filter","url(#softGlow)");

  else{ // rect or roundRect
    const hw=n.w/2,hh=n.h/2;

        .attr("x",-hw).attr("y",-hh)
        .attr("width",n.w).attr("height",n.h)

      .text(n.label2);
  }else{
    labelG.append("text")
      .attr("text-anchor","middle")
      .attr("dy","5")
      .attr("fill","white")
      .attr("font-size",n.shape==="circle"?"20":"14")
      .attr("font-weight","bold")
      .style("text-shadow","0 1px 3px rgba(0,0,0,0.8)")
      .text(n.label);
  }

  // Hover interaction
  g.on("mouseover",function(event){
    shape.transition().duration(200)
      .attr("transform","scale(1.1)");
    tooltip.style("opacity",1)
      .html(`
        <div class="tt-title">${n.info.title}</div>

        <div class="tt-quote">"${n.info.quote}"</div>

  .on("mousemove",function(event){
    const rect=document.getElementById("container").getBoundingClientRect();
    let x=event.clientX-rect.left+15;
    let y=event.clientY-rect.top+15;
    if(x+360>1600)x=event.clientX-rect.left-375;
    if(y+200>900)y=event.clientY-rect.top-215;
    tooltip.style("left",x+"px").style("top",y+"px");
  })
  .on("mouseout",function(){
    shape.transition().duration(200)
      .attr("transform","scale(1)");
    tooltip.style("opacity",0);
  });
});

const paramitaOrder=["dana","sila","ksanti","virya","dhyana","prajnaP"];

function createParticle(pathId,fromId,toId,color,delay){
  const fromN=getNode(fromId),toN=getNode(toId);
  const from=getNodeEdge(fromN,toN.x,toN.y);
  const to=getNodeEdge(toN,fromN.x,fromN.y);

  const particle=particleGroup.append("circle")
    .attr("r",3)
    .attr("fill",color)
    .attr("opacity",0)
    .attr("filter","url(#glow)");

  function animateParticle(){
    particle
      .attr("cx",from.x).attr("cy",from.y)
      .attr("opacity",0)
      .transition().duration(300).attr("opacity",1)
      .transition().duration(1200)
      .attr("cx",to.x).attr("cy",to.y)
      .ease(d3.easeLinear)
      .transition().duration(300).attr("opacity",0)
      .on("end",animateParticle);
  }
  setTimeout(animateParticle,delay);
}

    .attr("stroke",item.color)
    .attr("stroke-width",2)
    .attr("stroke-dasharray",item.dash==="none"?null:item.dash);
  lg.append("text")
    .attr("x",25).attr("y",4)
    .attr("fill","rgba(255,255,255,0.5)")
    .attr("font-size","10")
    .text(item.label);
});

</script>
