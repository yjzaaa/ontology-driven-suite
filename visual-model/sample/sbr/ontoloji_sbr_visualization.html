<head>

<script src="https://d3js.org/d3.v7.min.js"></script>
<style>

body{

  font-size:13px;

  opacity:0;
  transition:opacity 0.2s;

  word-wrap:break-word;
}

  font-size:15px;
  font-weight:bold;
  color:#D4A017;
  margin-bottom:6px;
}
#tooltip .tt-section{margin-top:6px;font-size:12px;}
#tooltip .tt-label{color:#D4A017;font-weight:bold;}
#tooltip .tt-quote{
  margin-top:8px;padding-top:6px;
  border-top:1px solid rgba(212,160,23,0.3);
  font-style:italic;color:#b0b0c0;font-size:11px;
}
.node-label{pointer-events:none;user-select:none;}
</style>
</head>
<body>
<div id="container">
<div id="tooltip"></div>
<svg id="canvas" viewBox="0 0 1600 900" width="1600" height="900"></svg>
</div>
<script>
const svg=d3.select("#canvas");
const tooltip=d3.select("#tooltip");

// ========== DEFS ==========
const defs=svg.append("defs");

// Gradients
function makeGrad(id,c1,c2){
  const g=defs.append("radialGradient").attr("id",id);
  g.append("stop").attr("offset","0%").attr("stop-color",c1);
  g.append("stop").attr("offset","100%").attr("stop-color",c2);
  return g;
}
makeGrad("goldGrad","#FFE082","#8B6914");
makeGrad("purpleGrad","#BA68C8","#4A148C");
makeGrad("blueGrad","#64B5F6","#1565C0");
makeGrad("tealGrad","#4DB6AC","#00695C");
makeGrad("orangeGrad","#FFB74D","#E65100");
makeGrad("greenGrad","#81C784","#2E7D32");
makeGrad("grayGrad","#9E9E9E","#424242");
makeGrad("indigoGrad","#7986CB","#283593");

// Glow filter
const glow=defs.append("filter").attr("id","glow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
glow.append("feGaussianBlur").attr("stdDeviation","4").attr("result","blur");
const gm=glow.append("feMerge");gm.append("feMergeNode").attr("in","blur");gm.append("feMergeNode").attr("in","SourceGraphic");

// Soft glow
const sg=defs.append("filter").attr("id","softGlow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
sg.append("feGaussianBlur").attr("stdDeviation","2").attr("result","blur");
const sgm=sg.append("feMerge");sgm.append("feMergeNode").attr("in","blur");sgm.append("feMergeNode").attr("in","SourceGraphic");

// Arrow markers
const arrowColors=[
  {id:"arrow-gold",color:"#D4A017"},{id:"arrow-purple",color:"#BA68C8"},
  {id:"arrow-blue",color:"#64B5F6"},{id:"arrow-teal",color:"#4DB6AC"},
  {id:"arrow-orange",color:"#FFB74D"},{id:"arrow-green",color:"#81C784"},
  {id:"arrow-gray",color:"#9E9E9E"},{id:"arrow-indigo",color:"#7986CB"},
];
arrowColors.forEach(a=>{
  defs.append("marker").attr("id",a.id)
    .attr("markerWidth","8").attr("markerHeight","6")
    .attr("refX","7").attr("refY","3").attr("orient","auto")
    .append("polygon").attr("points","0 0, 8 3, 0 6").attr("fill",a.color);
});

// ========== BACKGROUND ==========
for(let i=0;i<4;i++){
  svg.append("circle")
    .attr("cx",800).attr("cy",400).attr("r",100+i*100)
    .attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.02)")
    .attr("stroke-width",0.5);
}

// ========== TITLE ==========
svg.append("text")
  .attr("x",800).attr("y",35)
  .attr("text-anchor","middle")
  .attr("fill","#D4A017")
  .attr("font-size","22")
  .attr("font-weight","bold")
  .attr("letter-spacing","4")
  .text("本体论与本体模型 · SBR可视化导图");

svg.append("text")
  .attr("x",800).attr("y",57)
  .attr("text-anchor","middle")

  // === Definition Layer ===
  {id:"owlDef",label:"OWL定义",label2:"W3C标准",x:320,y:125,w:190,h:60,shape:"rect",grad:"url(#purpleGrad)",color:"#BA68C8",
    info:{title:"OWL定义 (W3C标准)",structure:"面向特定知识领域的术语形式化词汇表，由用户社群共享",behavior:"通过描述术语之间的关系来明确其定义。关键元素：类、属性、关系、数据值",relation:"本体定义的来源之一，但原为系统集成和自动化处理设计，非专门为大模型服务",quote:"本体是一个领域内术语的形式化词汇表，通过描述术语之间的关系来明确其定义"}},
  {id:"ontDef",label:"本体定义",x:800,y:125,r:45,shape:"hexagon",grad:"url(#goldGrad)",color:"#D4A017",
    info:{title:"本体定义",structure:"形式化模型，通过抽象的模式来体现核心领域的知识",behavior:"将完全无结构的文字做结构化处理，对象、关系、属性等表达更精确",relation:"OWL定义和Studer四特征的汇合点，是本体模型的理论基础",quote:"本体是一个形式化模型，通过抽象的模式来体现核心领域的知识"}},
  {id:"studer",label:"Studer四特征",label2:"概念化·明确·形式化·共享",x:1280,y:125,w:240,h:60,shape:"rect",grad:"url(#purpleGrad)",color:"#BA68C8",
    info:{title:"Studer四核心特征",structure:"概念化(抽象)、明确(无歧义)、形式化(结构化)、共享(社群共识)",behavior:"对实例信息的抽象化表达，遵循语义要求和表达结构",relation:"本体定义的核心理论框架，由Studer等人在1998年提出",quote:"本体是共享概念模型的明确的形式化规范说明"}},

  // === Rules Supplement ===
  {id:"rules",label:"规则语义补充",label2:"OWL + SWRL + SHACL",x:320,y:222,w:190,h:48,shape:"rect",grad:"url(#grayGrad)",color:"#9E9E9E",
    info:{title:"规则语义补充",structure:"OWL本身不包括规则语义定义，需SWRL、SHACL等补充",behavior:"提供完整的规则语义定义，形成完整的本体规范",relation:"对OWL本体语言的能力补充",quote:"OWL里面本身没有包括规则语义的定义，要定义完整规则还包括SWRL、SHACL等"}},

  // === Core Layer ===
  {id:"ai",label:"AI大模型",label2:"(消费者)",x:175,y:305,w:120,h:55,shape:"cloud",grad:"url(#blueGrad)",color:"#64B5F6",
    info:{title:"AI大模型 (消费者)",structure:"需要形式化语义输入的AI系统，是本体模型的主要服务对象",behavior:"读取本体模型→理解业务语义→生成代码或动态推理",relation:"本体模型为AI提供业务语义，形式化表达使AI更易理解",quote:"希望准备一个形式化语言文件，方便AI阅读和理解"}},
  {id:"ontology",label:"本体模型",x:800,y:305,r:50,shape:"circle",grad:"url(#goldGrad)",color:"#D4A017",
    info:{title:"本体模型 (核心)",structure:"融合对象、数据、行为、规则的一体化模型，展现为知识网络图谱",behavior:"为AI提供业务语义，既非UML类图也非活动图，而是静态结构与动态行为的融合",relation:"核心中心，连接定义、AI消费、两大场景、基础设施",quote:"本体模型展现出来的就是一个类似知识图谱的知识网络图谱，是静态结构和动态行为关系的融合"}},
  {id:"oo",label:"OO建模",label2:"(对比参照)",x:1420,y:305,w:130,h:70,shape:"diamond",grad:"url(#grayGrad)",color:"#9E9E9E",
    info:{title:"OO建模 (对比参照)",structure:"类、属性、关系、行为、规则的定义，拆分到不同模型（类图、活动图、序列图）",behavior:"面向功能实现，暴露业务能力或接口，考虑逻辑模型和物理模型",relation:"与本体建模的关键区别：概念模型≠逻辑模型，融合≠拆分",quote:"完全参考传统面向对象分析建模的思路构建本体本身是错误的"}},

  // === TBOX / ABOX ===
  {id:"tbox",label:"TBOX",label2:"抽象层",x:720,y:395,r:32,shape:"hexagon",grad:"url(#tealGrad)",color:"#4DB6AC",
    info:{title:"TBOX (抽象层)",structure:"Schema层的类、属性、关系定义，抽象概念模型",behavior:"定义Schema规则，泛化到实例层",relation:"ABOX的模式定义，数据量小，可用OWL/Yaml文件存储",quote:"本体包括TBOX抽象层和ABOX实例层，本体研究必须对抽象和实例两层都关心"}},
  {id:"abox",label:"ABOX",label2:"实例层",x:880,y:395,r:32,shape:"hexagon",grad:"url(#orangeGrad)",color:"#FFB74D",
    info:{title:"ABOX (实例层)",structure:"基于TBOX Schema实例化的数据，形成网络结构",behavior:"基于抽象层Schema实例化，数据量可能上万行或几十万行",relation:"TBOX的实例化产物，可用图数据库临时存储",quote:"基于本体模型拉取数据后形成的实例，同样会形成知识图谱一样的网络结构"}},

  // === Scenarios ===
  {id:"scene1",label:"场景一：应用构建",label2:"从0到1 · AI生成代码",x:350,y:470,w:230,h:68,shape:"roundRect",grad:"url(#greenGrad)",color:"#81C784",
    info:{title:"场景一：应用构建",structure:"从0到1构建应用或Agent使用的本体",behavior:"基于本体模型驱动AI精确生成代码，自然语言对话本质是AI驱动API调用",relation:"本体模型驱动的两大场景之一，既产生数据也使用数据",quote:"场景一的核心是基于本体模型来驱动AI精确生成代码"}},
  {id:"scene2",label:"场景二：数据融合",label2:"OLTP/OLAP · 动态推理",x:1250,y:470,w:230,h:68,shape:"roundRect",grad:"url(#indigoGrad)",color:"#7986CB",
    info:{title:"场景二：数据融合",structure:"衔接OLTP和OLAP，打通数据割裂，驱动数据分析",behavior:"拉取数据→动态推理(精确算法+动态模糊推理)→结论/回写",relation:"本体模型驱动的两大场景之二，不产生原始数据，使用数据出分析结论",quote:"场景二的核心是基于本体模型来提供AI大模型分析推理的完整上下文"}},

  // === Infrastructure ===
  {id:"itSys",label:"IT系统",label2:"OLTP/OLAP",x:350,y:620,w:180,h:55,shape:"rect",grad:"url(#grayGrad)",color:"#9E9E9E",
    info:{title:"IT系统 (OLTP/OLAP)",structure:"承载和产生结构化数据的业务系统",behavior:"业务模型+数据沉淀成为构建本体的关键输入",relation:"场景一产生/使用数据，场景二拉取数据，是本体的数据来源",quote:"传统IT系统里的业务模型+数据沉淀成为了构建本体的关键输入"}},
  {id:"dataInfra",label:"数据基础设施",label2:"DB/ODS/数据中台",x:800,y:620,w:190,h:55,shape:"rect",grad:"url(#grayGrad)",color:"#9E9E9E",
    info:{title:"数据基础设施",structure:"传统的数据库、数据ODS层等，仅为本体提供数据源",behavior:"为本体模型层提供数据源，本体构建在其之上",relation:"本体模型层在数据基础设施之上，传统ODS数据模型不是本体",quote:"传统的数据库、数据ODS层等仅仅是为本体提供数据源的一个数据基础设施"}},
  {id:"graphDB",label:"图数据库",label2:"(可选存储)",x:1250,y:620,w:180,h:55,shape:"rect",grad:"url(#grayGrad)",color:"#9E9E9E",
    info:{title:"图数据库 (可选)",structure:"技术层面的基础设施，天生方便存储网络关系数据",behavior:"可用规则引擎进行多跳推理，适合中间态数据暂存",relation:"与本体无必然联系，是可选的存储/推理方案",quote:"本体和图数据库之间没有任何必然联系，图数据库是技术层面的基础设施"}},
  {id:"kg",label:"知识图谱",label2:"(实例化产物)",x:1050,y:730,w:180,h:50,shape:"roundRect",grad:"url(#purpleGrad)",color:"#BA68C8",
    info:{title:"知识图谱 (实例化产物)",structure:"基于本体模型拉取数据后形成的实例网络",behavior:"原来更关注实例层(ABOX)，Schema定义粗或不完善",relation:"ABOX实例化的产物，本体TBOX+ABOX比传统KG更完善",quote:"原来知识图谱往往更加关注实例层，其Schema定义相当粗或不完善"}},
];

// ========== LINKS DATA ==========
const links=[
  // Definition layer
  {source:"owlDef",target:"ontDef",color:"#BA68C8",dash:"none",width:2,label:"W3C标准定义"},
  {source:"studer",target:"ontDef",color:"#BA68C8",dash:"none",width:2,label:"四核心特征"},
  {source:"ontDef",target:"ontology",color:"#D4A017",dash:"none",width:2.5,label:"具体化"},
  // Rules supplement
  {source:"owlDef",target:"rules",color:"#9E9E9E",dash:"4,3",width:1.5,label:"规则补充"},
  // Core connections
  {source:"ontology",target:"ai",color:"#D4A017",dash:"none",width:2.5,label:"提供业务语义"},
  {source:"ontology",target:"oo",color:"#9E9E9E",dash:"5,3",width:1.5,label:"关键区别"},
  // TBOX/ABOX
  {source:"ontology",target:"tbox",color:"#4DB6AC",dash:"none",width:1.5},
  {source:"ontology",target:"abox",color:"#FFB74D",dash:"none",width:1.5},
  {source:"tbox",target:"abox",color:"#4DB6AC",dash:"5,3",width:1.5,label:"泛化"},
  // Scenarios
  {source:"ontology",target:"scene1",color:"#D4A017",dash:"none",width:2,label:"驱动"},
  {source:"ontology",target:"scene2",color:"#D4A017",dash:"none",width:2,label:"驱动"},
  // Scenario to infrastructure
  {source:"scene1",target:"itSys",color:"#81C784",dash:"none",width:1.5,label:"产生+使用数据"},
  {source:"scene2",target:"dataInfra",color:"#7986CB",dash:"none",width:1.5,label:"拉取数据+回写"},
  // Infrastructure chain
  {source:"itSys",target:"dataInfra",color:"#9E9E9E",dash:"none",width:1.5,label:"数据沉淀"},
  {source:"dataInfra",target:"graphDB",color:"#9E9E9E",dash:"4,4",width:1.5,label:"可选存储"},
  // ABOX to KG (curved right to avoid dataInfra)
  {source:"abox",target:"kg",color:"#FFB74D",dash:"none",width:1.5,label:"实例化",pathType:"curve-right"},
  {source:"graphDB",target:"kg",color:"#9E9E9E",dash:"none",width:1.5,label:"存储支撑"},
];

// ========== HELPERS ==========
function getNode(id){return nodes.find(n=>n.id===id);}
function getNodeCenter(n){return{x:n.x,y:n.y};}

function getNodeEdge(n,tx,ty){
  const cx=n.x,cy=n.y;
  if(n.shape==="circle"||n.shape==="hexagon"){
    const r=n.shape==="hexagon"?n.r*0.9:n.r;
    const dx=tx-cx,dy=ty-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist===0)return{x:cx,y:cy};
    return{x:cx+dx*r/dist,y:cy+dy*r/dist};
  }
  const hw=(n.w||100)/2,hh=(n.h||50)/2;
  const dx=tx-cx,dy=ty-cy;
  if(Math.abs(dx)*hh>Math.abs(dy)*hw&&dx!==0){
    return{x:cx+Math.sign(dx)*hw,y:cy+dy*hw/Math.abs(dx)};
  }else if(dy!==0){
    return{x:cx+dx*hh/Math.abs(dy),y:cy+Math.sign(dy)*hh};
  }
  return{x:cx,y:cy};
}

function getArrowRef(color){
  const map={
    "#D4A017":"url(#arrow-gold)","#BA68C8":"url(#arrow-purple)",
    "#64B5F6":"url(#arrow-blue)","#4DB6AC":"url(#arrow-teal)",
    "#FFB74D":"url(#arrow-orange)","#81C784":"url(#arrow-green)",
    "#9E9E9E":"url(#arrow-gray)","#7986CB":"url(#arrow-indigo)",
  };
  return map[color]||"url(#arrow-gray)";
}

// ========== DRAW LINKS ==========
const linkGroup=svg.append("g").attr("class","links");

links.forEach((l)=>{
  const s=getNode(l.source),t=getNode(l.target);
  const sc=getNodeCenter(s),tc=getNodeCenter(t);
  const se=getNodeEdge(s,tc.x,tc.y);
  const te=getNodeEdge(t,sc.x,sc.y);

  let pathD;
  const dx=te.x-se.x,dy=te.y-se.y;
  const dist=Math.sqrt(dx*dx+dy*dy);

  if(l.pathType==="curve-right"){
    // Curve right to avoid dataInfra node
    const cpx=se.x+100,cpy=(se.y+te.y)/2;
    pathD=`M${se.x},${se.y} Q${cpx},${cpy} ${te.x},${te.y}`;
  }else if(dist>300){
    // Long distance: gentle bezier
    const cx1=se.x+(te.x-se.x)*0.4;
    const cy1=se.y+(te.y-se.y)*0.15;
    const cx2=se.x+(te.x-se.x)*0.6;
    const cy2=se.y+(te.y-se.y)*0.85;
    pathD=`M${se.x},${se.y} C${cx1},${cy1} ${cx2},${cy2} ${te.x},${te.y}`;
  }else{
    // Short distance: slight curve
    const mx=(se.x+te.x)/2,my=(se.y+te.y)/2;
    const perpX=-dy/dist*12,perpY=dx/dist*12;
    pathD=`M${se.x},${se.y} Q${mx+perpX},${my+perpY} ${te.x},${te.y}`;
  }

  linkGroup.append("path")
    .attr("d",pathD)
    .attr("fill","none")
    .attr("stroke",l.color)
    .attr("stroke-width",l.width)
    .attr("opacity",0.65)
    .attr("stroke-dasharray",l.dash==="none"?null:l.dash)
    .attr("marker-end",getArrowRef(l.color));

  // Link label
  if(l.label){
    // Place label at 40% along the path for better positioning
    const lx=se.x+(te.x-se.x)*0.45;
    const ly=se.y+(te.y-se.y)*0.45-8;

    // Background rect for label readability
    const labelText=linkGroup.append("text")
      .attr("x",lx).attr("y",ly)
      .attr("text-anchor","middle")
      .attr("fill",l.color)
      .attr("font-size","11")
      .attr("font-weight","bold")
      .attr("opacity",0.85)
      .style("text-shadow","0 1px 3px rgba(0,0,0,0.8)")
      .text(l.label);
  }
});

// ========== DRAW NODES ==========
const nodeGroup=svg.append("g").attr("class","nodes");

nodes.forEach((n)=>{
  const g=nodeGroup.append("g")
    .attr("class","node")
    .attr("transform",`translate(${n.x},${n.y})`)
    .style("cursor","pointer");

  let shape;

  if(n.shape==="circle"){
    g.append("circle").attr("r",n.r+8).attr("fill","none")
      .attr("stroke",n.color).attr("stroke-width",1).attr("opacity",0.15);
    shape=g.append("circle").attr("r",n.r).attr("fill",n.grad)
      .attr("stroke",n.color).attr("stroke-width",2).attr("filter","url(#glow)");
    g.append("circle").attr("r",n.r-12).attr("fill","none")
      .attr("stroke","rgba(255,255,255,0.25)").attr("stroke-width",1);
  }
  else if(n.shape==="hexagon"){
    const r=n.r;
    const pts=[];
    for(let j=0;j<6;j++){
      const a=j*60-90;
      pts.push(`${r*Math.cos(a*Math.PI/180)},${r*Math.sin(a*Math.PI/180)}`);
    }
    g.append("polygon").attr("points",pts.join(" "))
      .attr("fill","none").attr("stroke",n.color)
      .attr("stroke-width",1).attr("opacity",0.2)
      .attr("transform","scale(1.18)");
    shape=g.append("polygon").attr("points",pts.join(" "))
      .attr("fill",n.grad).attr("stroke",n.color)
      .attr("stroke-width",2).attr("filter","url(#softGlow)");
  }
  else if(n.shape==="diamond"){
    const hw=n.w/2,hh=n.h/2;
    g.append("polygon")
      .attr("points",`0,${-hh-5} ${hw+5},0 0,${hh+5} ${-hw-5},0`)
      .attr("fill","none").attr("stroke",n.color)
      .attr("stroke-width",1).attr("opacity",0.2)
      .attr("stroke-dasharray","2,3");
    shape=g.append("polygon")
      .attr("points",`0,${-hh} ${hw},0 0,${hh} ${-hw},0`)
      .attr("fill",n.grad).attr("stroke",n.color)
      .attr("stroke-width",2).attr("opacity",0.75);
  }
  else if(n.shape==="cloud"){
    const hw=n.w/2,hh=n.h/2;
    const cp=`M${-hw+12},${hh} Q${-hw-3},${hh*0.3} ${-hw+8},${-hh*0.3} Q${-hw+3},${-hh} ${-hw+25},${-hh} Q${0},${-hh-6} ${hw-25},${-hh} Q${hw-3},${-hh} ${hw-8},${-hh*0.3} Q${hw+3},${hh*0.3} ${hw-12},${hh} Q${hw-25},${hh+4} ${0},${hh+4} Q${-hw+25},${hh+4} ${-hw+12},${hh} Z`;
    shape=g.append("path").attr("d",cp)
      .attr("fill",n.grad).attr("stroke",n.color)
      .attr("stroke-width",2).attr("filter","url(#softGlow)");
  }
  else{
    const hw=n.w/2,hh=n.h/2;
    const rx=n.shape==="roundRect"?12:4;
    shape=g.append("rect")
      .attr("x",-hw).attr("y",-hh)
      .attr("width",n.w).attr("height",n.h)
      .attr("rx",rx).attr("ry",rx)
      .attr("fill",n.grad).attr("stroke",n.color)
      .attr("stroke-width",2).attr("filter","url(#softGlow)");
  }

  // Node labels - shape-specific sizing
  const labelG=g.append("g").attr("class","node-label");
  if(n.label2){
    const isDiamond=n.shape==="diamond";
    const isCircle=n.shape==="circle";
    const isHex=n.shape==="hexagon";
    const labelSize=isCircle?"16":isHex?"15":isDiamond?"13":"13";
    const label2Size=isCircle?"12":isHex?"10":isDiamond?"9":"10";
    const labelDy=isDiamond?"-6":isCircle?"-4":"-4";
    const label2Dy=isDiamond?"14":isCircle?"14":"14";

    labelG.append("text")
      .attr("text-anchor","middle")
      .attr("dy",labelDy)
      .attr("fill","white")
      .attr("font-size",labelSize)
      .attr("font-weight","bold")
      .style("text-shadow","0 1px 3px rgba(0,0,0,0.8)")
      .text(n.label);
    labelG.append("text")
      .attr("text-anchor","middle")
      .attr("dy",label2Dy)
      .attr("fill","rgba(255,255,255,0.85)")
      .attr("font-size",label2Size)
      .style("text-shadow","0 1px 2px rgba(0,0,0,0.6)")
      .text(n.label2);
  }else{
    labelG.append("text")
      .attr("text-anchor","middle")
      .attr("dy","5")
      .attr("fill","white")
      .attr("font-size",n.shape==="circle"?"18":"14")
      .attr("font-weight","bold")
      .style("text-shadow","0 1px 3px rgba(0,0,0,0.8)")
      .text(n.label);
  }

  // Hover interaction
  g.on("mouseover",function(event){
    shape.transition().duration(150).attr("transform","scale(1.08)");
    tooltip.style("opacity",1)
      .html(`<div class="tt-title">${n.info.title}</div>
        <div class="tt-section"><span class="tt-label">结构：</span>${n.info.structure}</div>
        <div class="tt-section"><span class="tt-label">行为：</span>${n.info.behavior}</div>
        <div class="tt-section"><span class="tt-label">关系：</span>${n.info.relation}</div>
        <div class="tt-quote">"${n.info.quote}"</div>`);
  })
  .on("mousemove",function(event){
    const rect=document.getElementById("container").getBoundingClientRect();
    let x=event.clientX-rect.left+15;
    let y=event.clientY-rect.top+15;
    if(x+380>1600)x=event.clientX-rect.left-395;
    if(y+200>900)y=event.clientY-rect.top-215;
    tooltip.style("left",x+"px").style("top",y+"px");
  })
  .on("mouseout",function(){
    shape.transition().duration(150).attr("transform","scale(1)");
    tooltip.style("opacity",0);
  });
});

    lg.append("rect").attr("x",2).attr("y",-5).attr("width",12).attr("height",10).attr("rx",3).attr("fill",item.color).attr("opacity",0.8);

  }else{
    lg.append("rect").attr("x",2).attr("y",-5).attr("width",12).attr("height",10).attr("fill",item.color).attr("opacity",0.8);
  }
  lg.append("text").attr("x",20).attr("y",4)
    .attr("fill","rgba(255,255,255,0.6)")
    .attr("font-size","10")
    .text(item.label);
});
