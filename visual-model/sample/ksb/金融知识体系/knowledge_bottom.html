<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>金融知识体系底层知识图谱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#0f1420;font-family:"Microsoft YaHei",Arial,sans-serif;color:#e8eaf6;}
#bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#151c2b;border-bottom:1px solid #29324a;box-sizing:border-box;flex-wrap:wrap;}
#bar select,#bar button{background:#202a3d;color:#e8eaf6;border:1px solid #4b5b80;border-radius:4px;padding:5px 8px;}
#c{width:100%;height:100vh;}
#popup{position:fixed;right:18px;top:68px;width:330px;max-height:72vh;overflow:auto;background:#1b2233;color:#e8eaf6;padding:14px;border-radius:8px;box-shadow:0 4px 20px #0008;display:none;font-size:13px;line-height:1.6;}
#popup h4{margin:0 0 6px;color:#80d8ff;}
#stats{position:fixed;left:18px;bottom:18px;width:320px;background:#1b2233cc;border:1px solid #35415e;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;color:#cfd6ea;}
.muted{color:#9aa6c7;}
</style>
</head>
<body>

    <option value="contains">contains 包含</option><option value="analogy">analogy 类比</option><option value="contrast">contrast 对比</option><option value="evolved">evolved 演进</option>
  </select></label>
  <button onclick="showHubs()">Top 10 枢纽</button>
  <button onclick="resetView()">重置视图</button>
  <span class="muted">点击节点查看定义与一阶邻居；节点大小按重要度和枢纽度缩放。</span>

['N09','N10','depends',0.70],['N10','N11','depends',0.78],['N11','N12','contains',0.70],['N13','N14','contains',0.62],['N14','N06','causes',0.76],['N13','N36','causes',0.82],['N15','N49','depends',0.72],['N16','N43','depends',0.70],['N11','N16','depends',0.76],

const nodes=nodeRows.map(r=>({id:r[0],name:r[1],category:r[2],value:r[3],importance:r[4],degreeScore:r[5],symbolSize:r[6],draggable:true}));
const nameById=Object.fromEntries(nodes.map(n=>[n.id,n.name]));
function buildLinks(filter){
  return edgeRows.filter(e=>filter==='all'||e[2]===filter).map(e=>({
    source:e[0],target:e[1],type:e[2],weight:e[3],
    lineStyle:{color:KSB_PALETTE.relation[e[2]],width:e[3]*4+1,type:e[2]==='causes'?'dashed':(e[2]==='analogy'?'dotted':'solid'),opacity:0.72},
    symbol:e[2]==='depends'||e[2]==='causes'||e[2]==='evolved'?['none','arrow']:['none','none'],
    label:e[2]==='evolved'?{show:true,formatter:'演进',color:KSB_PALETTE.relation.evolved,fontSize:10}:undefined
  }));
}
const chart=echarts.init(document.getElementById('c'));
function render(){
  const filter=document.getElementById('relFilter').value;
  const links=buildLinks(filter);
  chart.setOption({
    color:KSB_PALETTE.branches,
    title:{text:'最底层 · 金融知识网络图谱',subtext:'64 个核心知识点 / 分组聚类 / 关系筛选 / 局部聚焦',left:'center',top:48,textStyle:{color:'#e8eaf6'},subtextStyle:{color:'#9aa6c7'}},
    tooltip:{formatter:p=>p.dataType==='node'?`${p.data.name}<br>${p.data.value}<br>重要度：${p.data.importance} ｜ 枢纽度：${p.data.degreeScore}`:`${nameById[p.data.source]} → ${nameById[p.data.target]}<br>${p.data.type} / 权重 ${p.data.weight}`},
    legend:[{data:categories.map(c=>c.name),top:94,textStyle:{color:'#e8eaf6'},type:'scroll'}],
    series:[{type:'graph',layout:'force',top:128,bottom:20,roam:true,data:nodes,links,categories,label:{show:true,color:'#e8eaf6',fontSize:11,formatter:p=>p.data.symbolSize>=50?p.data.name:(p.data.name.length>6?p.data.name.slice(0,6)+'…':p.data.name)},edgeSymbol:['none','none'],force:{repulsion:280,edgeLength:[90,170],gravity:0.08},emphasis:{focus:'adjacency'},lineStyle:{curveness:0.12}}]
  },true);
  updateStats(links);
}
function updateStats(links){
  const deg=Object.fromEntries(nodes.map(n=>[n.id,0]));
  links.forEach(l=>{deg[l.source]++;deg[l.target]++;});
  const avg=(links.length*2/nodes.length).toFixed(2);
  const islands=Object.values(deg).filter(x=>x===0).length;
  const hubs=nodes.slice().sort((a,b)=>b.degreeScore-a.degreeScore).slice(0,10).map(n=>n.name).join('、');
  document.getElementById('stats').innerHTML=`节点总数：${nodes.length}<br>当前边数：${links.length}<br>平均度：${avg}<br>孤岛节点：${islands}<br>Top 10 枢纽：${hubs}`;
}
chart.on('click',p=>{
  if(p.dataType!=='node')return;
  const id=p.data.id;
  const neigh=edgeRows.filter(e=>e[0]===id||e[1]===id).map(e=>`${nameById[e[0]]} → ${nameById[e[1]]}（${e[2]}, ${e[3]}）`);
  document.getElementById('pt').textContent=p.data.name;
  document.getElementById('pd').innerHTML=`${p.data.value}<br><br><b>所属主干：</b>${categories[p.data.category].name}<br><b>重要度：</b>${p.data.importance}<br><b>枢纽度：</b>${p.data.degreeScore}<br><br><b>一阶关系：</b><br>${neigh.length?neigh.join('<br>'):'无'}`;
  document.getElementById('popup').style.display='block';
});
function showHubs(){document.getElementById('relFilter').value='all';render();document.getElementById('popup').style.display='block';document.getElementById('pt').textContent='Top 10 枢纽节点';document.getElementById('pd').innerHTML=nodes.slice().sort((a,b)=>b.degreeScore-a.degreeScore).slice(0,10).map((n,i)=>`${i+1}. ${n.name}：${n.value}`).join('<br>');}
function resetView(){document.getElementById('relFilter').value='all';render();}
window.addEventListener('resize',()=>chart.resize());
render();
</script>
</body>
</html>
