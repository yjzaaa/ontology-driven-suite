<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>金融知识体系中间层矩阵</title>
<style>
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1a1a2e;}
h2{text-align:center;margin:8px 0 16px;}
.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.ctrl select{padding:5px 9px;border:1px solid #c8d0e4;border-radius:4px;background:#fff;}
.note{max-width:1100px;margin:0 auto 14px;color:#555;font-size:13px;line-height:1.6;}
table{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 2px 8px #0001;}
th,td{border:1px solid #d7dbe8;padding:10px 14px;vertical-align:top;min-width:165px;max-width:270px;}
th{background:#3f51b5;color:#fff;}
.row-h{background:#5c6bc0;color:#fff;font-weight:bold;}
.cell{font-size:13px;line-height:1.58;}
.d0{background:#fff;} .d1{background:#e8eaf6;} .d2{background:#c5cae9;} .d3{background:#9fa8da;}
.group{margin:5px 0 2px;font-weight:700;color:#3949ab;}
.legend{text-align:center;margin-top:14px;color:#555;font-size:13px;}
.legend span{display:inline-block;width:14px;height:14px;margin:0 4px;vertical-align:middle;}
</style>
</head>
<body>
<h2>金融知识体系 · 动态多维知识矩阵</h2>
<div class="note">可任选两个维度生成矩阵：知识模块、应用场景、难度层级。未被选中的第三维作为筛选器；选择“全部”时，单元格按第三维分组展示。</div>
<div class="ctrl">
  <label>行维度：<select id="rowDim" onchange="syncDims()"></select></label>
  <label>列维度：<select id="colDim" onchange="syncDims()"></select></label>
  <label id="filterBox">筛选：<select id="filterVal" onchange="render()"></select></label>
</div>
<table id="mt"></table>
<div class="legend">知识密度：<span class="d1"></span>低 <span class="d2"></span>中 <span class="d3"></span>高 ｜ “—”表示盲区或需补充材料</div>
<script>
const dims={
  module:['市场体系','银行货币','公司金融','投资定价','工具资产','风险管理','金融科技','监管个人'],
  scenario:['个人理财','企业决策','市场交易','机构管理','监管合规'],
  level:['入门','进阶','高级']
};
const dimLabel={module:'知识模块',scenario:'应用场景',level:'难度层级'};
const entries=[
  {name:'市场参与者与资金流向',module:'市场体系',scenario:'个人理财',level:'入门'},
  {name:'一级市场与二级市场',module:'市场体系',scenario:'市场交易',level:'入门'},
  {name:'价格发现与流动性',module:'市场体系',scenario:'市场交易',level:'进阶'},
  {name:'清算结算与托管',module:'市场体系',scenario:'机构管理',level:'进阶'},
  {name:'信息披露与市场公平',module:'市场体系',scenario:'监管合规',level:'进阶'},
  {name:'金融基础设施韧性',module:'市场体系',scenario:'机构管理',level:'高级'},
  {name:'货币职能与通胀',module:'银行货币',scenario:'个人理财',level:'入门'},
  {name:'商业银行存贷款',module:'银行货币',scenario:'企业决策',level:'入门'},
  {name:'央行政策利率',module:'银行货币',scenario:'市场交易',level:'进阶'},
  {name:'公开市场操作',module:'银行货币',scenario:'机构管理',level:'进阶'},
  {name:'支付系统安全',module:'银行货币',scenario:'监管合规',level:'进阶'},
  {name:'金融稳定与流动性冲击',module:'银行货币',scenario:'监管合规',level:'高级'},
  {name:'财务报表阅读',module:'公司金融',scenario:'企业决策',level:'入门'},
  {name:'现金流与净现值',module:'公司金融',scenario:'企业决策',level:'进阶'},
  {name:'资本结构与融资选择',module:'公司金融',scenario:'企业决策',level:'进阶'},
  {name:'WACC 与项目评估',module:'公司金融',scenario:'机构管理',level:'进阶'},
  {name:'并购估值',module:'公司金融',scenario:'市场交易',level:'高级'},
  {name:'股利政策与回购',module:'公司金融',scenario:'监管合规',level:'高级'},
  {name:'风险收益权衡',module:'投资定价',scenario:'个人理财',level:'入门'},
  {name:'分散化与资产配置',module:'投资定价',scenario:'个人理财',level:'入门'},
  {name:'投资组合构建',module:'投资定价',scenario:'机构管理',level:'进阶'},
  {name:'CAPM 与系统性风险',module:'投资定价',scenario:'市场交易',level:'进阶'},
  {name:'因子模型',module:'投资定价',scenario:'机构管理',level:'高级'},
  {name:'行为金融偏差',module:'投资定价',scenario:'个人理财',level:'进阶'},
  {name:'股票与债券基础',module:'工具资产',scenario:'个人理财',level:'入门'},
  {name:'基金与 ETF',module:'工具资产',scenario:'个人理财',level:'入门'},
  {name:'收益率曲线与久期',module:'工具资产',scenario:'市场交易',level:'进阶'},
  {name:'期货与期权',module:'工具资产',scenario:'市场交易',level:'进阶'},
  {name:'另类资产配置',module:'工具资产',scenario:'机构管理',level:'高级'},
  {name:'复杂产品适当性',module:'工具资产',scenario:'监管合规',level:'高级'},
  {name:'市场风险识别',module:'风险管理',scenario:'市场交易',level:'入门'},
  {name:'信用风险识别',module:'风险管理',scenario:'企业决策',level:'入门'},
  {name:'VaR 与压力测试',module:'风险管理',scenario:'机构管理',level:'进阶'},
  {name:'风险限额与对冲',module:'风险管理',scenario:'机构管理',level:'进阶'},
  {name:'流动性风险管理',module:'风险管理',scenario:'监管合规',level:'高级'},
  {name:'操作风险与内控',module:'风险管理',scenario:'监管合规',level:'进阶'},
  {name:'电子支付',module:'金融科技',scenario:'个人理财',level:'入门'},
  {name:'数字银行',module:'金融科技',scenario:'机构管理',level:'入门'},
  {name:'信用评分',module:'金融科技',scenario:'企业决策',level:'进阶'},
  {name:'量化交易',module:'金融科技',scenario:'市场交易',level:'高级'},
  {name:'数据治理',module:'金融科技',scenario:'监管合规',level:'进阶'},
  {name:'模型风险管理',module:'金融科技',scenario:'监管合规',level:'高级'},
  {name:'投资者保护',module:'监管个人',scenario:'个人理财',level:'入门'},
  {name:'预算与应急金',module:'监管个人',scenario:'个人理财',level:'入门'},
  {name:'保险与退休规划',module:'监管个人',scenario:'个人理财',level:'进阶'},
  {name:'适当性原则',module:'监管个人',scenario:'监管合规',level:'进阶'},
  {name:'反洗钱与 KYC',module:'监管个人',scenario:'监管合规',level:'进阶'},
  {name:'受托责任与利益冲突',module:'监管个人',scenario:'机构管理',level:'高级'}
];
const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');
function fillSelect(sel,selected){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${dimLabel[k]}</option>`).join('');}
function otherDim(){const r=rowSel.value,c=colSel.value;return keys.find(k=>k!==r&&k!==c);}
function syncDims(){if(rowSel.value===colSel.value){colSel.value=keys.find(k=>k!==rowSel.value)||rowSel.value;}const f=otherDim();document.getElementById('filterBox').style.display=f?'inline-block':'none';filterSel.innerHTML=f?'<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join(''):'';render();}
function cls(n){return n===0?'d0':(n<=1?'d1':(n<=3?'d2':'d3'));}
function itemsFor(rDim,rVal,cDim,cVal,fDim,fVal){return entries.filter(e=>e[rDim]===rVal&&e[cDim]===cVal&&(!fDim||fVal==='__all__'||e[fDim]===fVal));}
function render(){
  const rDim=rowSel.value,cDim=colSel.value,fDim=otherDim(),fVal=filterSel.value||'__all__',rows=dims[rDim],cols=dims[cDim];
  let html=`<tr><th>${dimLabel[rDim]} \\ ${dimLabel[cDim]}</th>`+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  for(const r of rows){html+=`<tr><td class="row-h">${r}</td>`;for(const c of cols){const items=itemsFor(rDim,r,cDim,c,fDim,fVal);let body='—';if(items.length&&fDim&&fVal==='__all__'){body=dims[fDim].map(v=>{const group=items.filter(x=>x[fDim]===v);return group.length?`<div class="group">${v}</div>`+group.map(x=>'• '+x.name).join('<br>'):'';}).filter(Boolean).join('');}else if(items.length){body=items.map(x=>'• '+x.name).join('<br>');}html+=`<td class="cell ${cls(items.length)}">${body}</td>`;}html+='</tr>';}
  document.getElementById('mt').innerHTML=html;
}
fillSelect(rowSel,'module');fillSelect(colSel,'scenario');syncDims();
</script>
</body>
</html>
