<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>西方哲学顶层思维导图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
body{margin:0;background:#f7f8fa;color:#1a1a2e;font-family:Arial,'Microsoft YaHei',sans-serif;}header{padding:14px 20px;background:#fff;box-shadow:0 1px 8px #0001;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0 20px 0 0;font-size:18px}button{border:1px solid #d7dbe8;background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}button:hover{background:#eef2ff}svg{display:block}.link{fill:none}.node text{text-anchor:middle;dominant-baseline:middle;pointer-events:none}.node{cursor:pointer}
</style></head><body><header><h2>顶层 · 西方哲学知识主干</h2><button onclick="expandAll()">展开全部</button><button onclick="expandToThird()">展开到三级</button><button onclick="collapseAll()">折叠到主干</button><button onclick="resetZoom()">重置视图</button></header><svg id="svg"></svg>
<script>
const raw = {"name": "西方哲学", "children": [{"name": "古希腊哲学", "color": "#3f51b5", "children": [{"name": "自然哲学", "children": [{"name": "本原问题"}, {"name": "变化与恒常"}, {"name": "宇宙秩序"}]}, {"name": "苏格拉底转向", "children": [{"name": "德性即知识"}, {"name": "诘问法"}, {"name": "灵魂关怀"}]}, {"name": "柏拉图体系", "children": [{"name": "理念论"}, {"name": "灵魂三分"}, {"name": "哲人王"}]}, {"name": "亚里士多德体系", "children": [{"name": "实体与四因"}, {"name": "逻辑学"}, {"name": "德性伦理"}]}]}, {"name": "希腊化与罗马", "color": "#009688", "children": [{"name": "斯多亚主义", "children": [{"name": "自然法"}, {"name": "命运与自由"}, {"name": "情感治理"}]}, {"name": "伊壁鸠鲁主义", "children": [{"name": "快乐主义"}, {"name": "原子论伦理"}, {"name": "死亡无惧"}]}, {"name": "怀疑主义", "children": [{"name": "悬置判断"}, {"name": "反独断"}, {"name": "生活实践"}]}, {"name": "新柏拉图主义", "children": [{"name": "太一"}, {"name": "流溢"}, {"name": "灵魂回归"}]}]}, {"name": "中世纪哲学", "color": "#ff9800", "children": [{"name": "教父哲学", "children": [{"name": "信仰寻求理解"}, {"name": "恶的问题"}, {"name": "时间与记忆"}]}, {"name": "经院哲学", "children": [{"name": "共相之争"}, {"name": "信仰与理性"}, {"name": "神学大全"}]}, {"name": "阿拉伯与犹太哲学", "children": [{"name": "亚里士多德注疏"}, {"name": "理智论"}, {"name": "负神学"}]}, {"name": "唯名论转向", "children": [{"name": "奥卡姆剃刀"}, {"name": "意志论"}, {"name": "经验倾向"}]}]}, {"name": "近代哲学", "color": "#e91e63", "children": [{"name": "理性主义", "children": [{"name": "天赋观念"}, {"name": "实体问题"}, {"name": "演绎方法"}]}, {"name": "经验主义", "children": [{"name": "观念来源"}, {"name": "因果怀疑"}, {"name": "习惯与联想"}]}, {"name": "启蒙政治哲学", "children": [{"name": "自然权利"}, {"name": "社会契约"}, {"name": "公共理性"}]}, {"name": "德国古典哲学", "children": [{"name": "先验哲学"}, {"name": "实践理性"}, {"name": "辩证法"}]}]}, {"name": "19世纪哲学", "color": "#4caf50", "children": [{"name": "德国观念论后续", "children": [{"name": "绝对精神"}, {"name": "历史辩证法"}, {"name": "承认问题"}]}, {"name": "马克思主义", "children": [{"name": "异化劳动"}, {"name": "历史唯物主义"}, {"name": "意识形态批判"}]}, {"name": "功利主义与自由主义", "children": [{"name": "最大幸福"}, {"name": "伤害原则"}, {"name": "个人自由"}]}, {"name": "生命哲学与存在问题", "children": [{"name": "权力意志"}, {"name": "生存焦虑"}, {"name": "非理性维度"}]}]}, {"name": "分析哲学", "color": "#00bcd4", "children": [{"name": "语言转向", "children": [{"name": "意义与指称"}, {"name": "逻辑形式"}, {"name": "语言游戏"}]}, {"name": "逻辑实证主义", "children": [{"name": "证实原则"}, {"name": "科学统一"}, {"name": "形而上学批判"}]}, {"name": "心灵与认知", "children": [{"name": "身心问题"}, {"name": "功能主义"}, {"name": "意识难题"}]}, {"name": "规范与行动", "children": [{"name": "理由"}, {"name": "意向性"}, {"name": "道德语言"}]}]}, {"name": "欧陆哲学", "color": "#9c27b0", "children": [{"name": "现象学", "children": [{"name": "意向性"}, {"name": "生活世界"}, {"name": "还原方法"}]}, {"name": "存在主义", "children": [{"name": "自由与责任"}, {"name": "荒诞"}, {"name": "本真性"}]}, {"name": "解释学", "children": [{"name": "理解循环"}, {"name": "传统效果"}, {"name": "文本与意义"}]}, {"name": "结构主义与后结构", "children": [{"name": "差异"}, {"name": "权力知识"}, {"name": "主体解构"}]}]}, {"name": "当代交叉议题", "color": "#ff5722", "children": [{"name": "政治与正义", "children": [{"name": "公平正义"}, {"name": "承认政治"}, {"name": "公共领域"}]}, {"name": "科学与技术哲学", "children": [{"name": "范式转换"}, {"name": "技术座架"}, {"name": "风险社会"}]}, {"name": "女性主义与批判理论", "children": [{"name": "性别建构"}, {"name": "交往理性"}, {"name": "交叉性"}]}, {"name": "环境与全球伦理", "children": [{"name": "生命中心主义"}, {"name": "代际正义"}, {"name": "全球责任"}]}]}]};
const KSB_PALETTE={branches:["#3f51b5", "#009688", "#ff9800", "#e91e63", "#4caf50", "#00bcd4", "#9c27b0", "#ff5722"]};
const svg=d3.select('#svg'),gZoom=svg.append('g'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');
const PAD=180,VGAP=42,HSTEP=185;
function nodeWidth(d){return Math.max(d.depth===0?120:72,(d.data.name.length*13)+24);}
function nodeHeight(d){return d.depth===0?40:(d.depth===1?30:26);}
function colorOf(d){if(d.depth===0)return '#1a237e';let n=d;while(n.depth>1)n=n.parent;return n.data.color||KSB_PALETTE.branches[0];}
function foldAfterDepth(n,depth=3,cur=0){if(!n.children)return;if(cur>=depth){n._children=n.children;n.children=null;n._folded=true;return;}n.children.forEach(c=>foldAfterDepth(c,depth,cur+1));}
function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side;});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes;}
function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(26,dx*.42);return `M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`;}
function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null};const allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx))+PAD,minY=Math.min(...allNodes.map(n=>n.yy))-70,maxY=Math.max(...allNodes.map(n=>n.yy))+70,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);
const link=linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth);link.exit().remove();link.enter().append('path').attr('class','link').merge(link).attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.2:1.4).attr('opacity',d=>d.target.depth===1?.9:.55);
const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth);node.exit().remove();const ne=node.enter().append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false;}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true;}render();});ne.append('rect');ne.append('text');
nodeG.selectAll('g.node').attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d);sel.selectAll('.bar').remove();if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',9).attr('fill',c);sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700);}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600);}else{sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('stroke','#e5e7ef');sel.insert('rect','text').attr('class','bar').attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#263238').attr('font-size',12.5);}});}
function walk(n,fn){fn(n);(n.children||n._children||[]).forEach(c=>walk(c,fn));}
function expandAll(){walk(raw,n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false;}});render();}
function expandToThird(){expandAll();foldAfterDepth(raw,3);render();}
function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true;}});render();}
const zoom=d3.zoom().scaleExtent([.35,2.5]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);function resetZoom(){svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity);}expandToThird();
</script></body></html>
