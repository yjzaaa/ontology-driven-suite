metaphysics:['泰勒斯本原','赫拉克利特变化','巴门尼德存在','柏拉图理念论','亚里士多德实体论','四因说','新柏拉图太一','共相实在论','唯名论','阿奎那五路证明','斯宾诺莎实体一元论','莱布尼茨单子论','康德先验综合判断','黑格尔辩证法','海德格尔此在','海德格尔技术座架'],
epistemology:['智者派相对主义','苏格拉底诘问法','皮浪怀疑主义','奥卡姆剃刀','笛卡尔怀疑','洛克白板说','贝克莱主观唯心论','休谟因果怀疑','康德先验综合判断','范畴表','证实原则','奎因整体论','库恩范式转换'],
ethics:['苏格拉底诘问法','德性即知识','中道德性','斯多亚逻各斯','命运与自由','伊壁鸠鲁快乐论','死亡无惧论证','定言命令','功利主义原则','密尔伤害原则','马克思异化劳动','历史唯物主义','罗尔斯无知之幕','哈贝马斯交往理性','环境伦理代际正义'],
analysis:['三段论','奥卡姆剃刀','弗雷格意义指称','罗素摹状词理论','维特根斯坦图像论','语言游戏','证实原则','奎因整体论','功能主义心灵观','意识难题','摩尔开放问题','库恩范式转换'],
continental:['笛卡尔怀疑','康德先验综合判断','黑格尔辩证法','费尔巴哈投射论','尼采权力意志','胡塞尔意向性','现象学还原','海德格尔此在','萨特自由责任','加缪荒诞','伽达默尔解释学循环','德里达延异','福柯权力知识','女性主义性别建构']
};
function learningEdges(){
  const out=[];
  sourceEdges.forEach(([advanced,pre,type,weight])=>{
    if(!nodeMap.has(advanced)||!nodeMap.has(pre))return;
    const a=nodeMap.get(advanced),p=nodeMap.get(pre);
    const forward=p.layer<=a.layer;
    const from=forward?pre:advanced,to=forward?advanced:pre;
    if(from!==to)out.push({from,to,type,weight});
  });
  return out;
}
const allEdges=learningEdges();
let svg=d3.select('#svg'),inner=d3.select('#graph'),zoomLayer=d3.select('#zoom'),currentEdges=[],currentNodes=[];
const zoom=d3.zoom().scaleExtent([0.25,2.2]).on('zoom',()=>zoomLayer.attr('transform',d3.event.transform));
svg.call(zoom);
function edgeAllowed(e,rel){if(rel==='all')return true;if(rel==='learning')return ['depends','contains','evolved','contrast'].includes(e.type);return e.type===rel}
function visibleSet(route){if(route==='all')return new Set(nodes.map(n=>n.id));const base=new Set(routeSets[route]||[]);let changed=true;while(changed){changed=false;allEdges.forEach(e=>{if(base.has(e.to)&&!base.has(e.from)){base.add(e.from);changed=true}})}return base}
function render(){
  clearFocus(false);
  const route=document.getElementById('route').value,rel=document.getElementById('relation').value,visible=visibleSet(route);
  currentNodes=nodes.filter(n=>visible.has(n.id));
  currentEdges=allEdges.filter(e=>visible.has(e.from)&&visible.has(e.to)&&edgeAllowed(e,rel));
  const g=new dagreD3.graphlib.Graph({compound:true}).setGraph({rankdir:'LR',nodesep:34,ranksep:82,marginx:30,marginy:26}).setDefaultEdgeLabel(()=>({}));
  layerNames.forEach((name,i)=>g.setNode('cluster_'+i,{label:name,clusterLabelPos:'top',style:'fill:#ffffff;stroke:#d9deec'}));
  currentNodes.forEach(n=>{
    g.setNode(n.id,{label:n.id,rx:7,ry:7,paddingLeft:12,paddingRight:12,paddingTop:8,paddingBottom:8,style:`fill:${palette[n.category]};stroke:#39445e;color:#fff`,labelStyle:'fill:#fff;font-weight:650'});
    g.setParent(n.id,'cluster_'+n.layer);
  });
  currentEdges.forEach(e=>{
    const color=relationColor[e.type]||'#667085';
    const dash=e.type==='contrast'?'stroke-dasharray:6 4;':'';
    const width=e.type==='contains'?3.2:(e.type==='depends'?2.5:1.9);
    const label=e.type==='depends'?'前导':(e.type==='contains'?'组装':(e.type==='evolved'?'演进':(e.type==='contrast'?'对比':'类比')));
    g.setEdge(e.from,e.to,{label,curve:d3.curveBasis,arrowhead:'vee',style:`stroke:${color};stroke-width:${width}px;${dash}fill:none`,arrowheadStyle:`fill:${color};stroke:${color}`,labelStyle:`fill:${color};font-weight:650`});
  });
  inner.selectAll('*').remove();
  new dagreD3.render()(inner,g);
  inner.selectAll('g.node').on('click',id=>focusNode(id)).on('mouseover',id=>showPanel(id));
  inner.selectAll('g.edgePath').each(function(v){d3.select(this).attr('data-from',v.v).attr('data-to',v.w)});
  inner.selectAll('g.edgeLabel').each(function(v){d3.select(this).attr('data-from',v.v).attr('data-to',v.w)});
  resetView();
}
function related(id,direction){
  const seen=new Set(),stack=[id];
  while(stack.length){const cur=stack.pop();currentEdges.forEach(e=>{const next=direction==='pre'&&e.to===cur?e.from:(direction==='next'&&e.from===cur?e.to:null);if(next&&!seen.has(next)){seen.add(next);stack.push(next)}})}
  return seen;
}
function focusNode(id){
  const pre=related(id,'pre'),next=related(id,'next');
  inner.selectAll('g.node').classed('dim',true).classed('active',false).classed('pre',false).classed('next',false);
  inner.selectAll('g.node').filter(d=>d===id).classed('dim',false).classed('active',true);
  inner.selectAll('g.node').filter(d=>pre.has(d)).classed('dim',false).classed('pre',true);
  inner.selectAll('g.node').filter(d=>next.has(d)).classed('dim',false).classed('next',true);
  inner.selectAll('g.edgePath,g.edgeLabel').classed('dim',true).classed('active',false);
  inner.selectAll('g.edgePath,g.edgeLabel').filter(function(){const f=this.getAttribute('data-from'),t=this.getAttribute('data-to');return (f===id||t===id||pre.has(f)&&pre.has(t)||next.has(f)&&next.has(t)||pre.has(f)&&t===id||f===id&&next.has(t));}).classed('dim',false).classed('active',true);
  showPanel(id);
}
function showPanel(id){
  const n=nodeMap.get(id);if(!n)return;
  const directPre=currentEdges.filter(e=>e.to===id).map(e=>e.from);
  const directNext=currentEdges.filter(e=>e.from===id).map(e=>e.to);
  document.getElementById('pt').textContent=id;
  document.getElementById('pm').textContent=`${categories[n.category]} ｜ ${layerNames[n.layer]}`;
  document.getElementById('pd').innerHTML=`<div class="section">${n.value}</div><div class="section"><b>直接前导：</b>${directPre.length?directPre.join('、'):'无'}</div><div class="section"><b>可组装/通向：</b>${directNext.length?directNext.join('、'):'无'}</div>`;
  document.getElementById('panel').style.display='block';
}
function clearFocus(hide=true){
  inner.selectAll('g.node').classed('dim',false).classed('active',false).classed('pre',false).classed('next',false);
  inner.selectAll('g.edgePath,g.edgeLabel').classed('dim',false).classed('active',false);
  if(hide)document.getElementById('panel').style.display='none';
}
function resetView(){
  const graphNode=inner.node();
  if(!graphNode)return;
  const bbox=graphNode.getBBox(),w=svg.node().clientWidth,h=svg.node().clientHeight;
  const scale=Math.min(1.05,Math.max(.28,Math.min((w-80)/bbox.width,(h-80)/bbox.height)));
  const x=(w-bbox.width*scale)/2-bbox.x*scale,y=36-bbox.y*scale;
  svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity.translate(x,y).scale(scale));
}
window.addEventListener('resize',resetView);
render();
</script>
</body>
