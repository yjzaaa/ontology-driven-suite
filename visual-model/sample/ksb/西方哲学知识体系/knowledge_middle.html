<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>西方哲学中间层知识矩阵</title><style>
body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1a1a2e}h2{text-align:center}.desc{max-width:1040px;margin:0 auto 14px;color:#4b5563;line-height:1.7}.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.ctrl select{padding:5px 8px}table{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 2px 8px #0001}th,td{border:1px solid #d7dbe8;padding:10px 12px;vertical-align:top;min-width:155px;max-width:250px}th{background:#3f51b5;color:#fff}.row-h{background:#5c6bc0;color:#fff;font-weight:bold}.cell{font-size:13px;line-height:1.55}.d0{background:#fff}.d1{background:#f6f8ff}.d2{background:#eef2ff}.d3{background:#e3e9ff}.level-beginner{background:#dff6e5}.level-intermediate{background:#fff1b8}.level-advanced{background:#f2c94c}.level-block{border-radius:6px;margin:5px 0;padding:7px 9px;border:1px solid #00000012}.group{margin:0 0 3px;font-weight:700;color:#1f2a3d}.legend{text-align:center;margin-top:14px;color:#555;font-size:13px}.legend span{display:inline-block;width:14px;height:14px;margin:0 4px;vertical-align:middle;border:1px solid #00000018}
</style></head><body><h2>中间层 · 西方哲学动态多维知识矩阵</h2><div class="desc">维度含义：时代阶段定位历史语境；主题问题定位哲学问题域；难度层级提示学习顺序。切换任意两个维度作为行列，剩余维度自动成为筛选器；筛选为“全部”时按第三维分组显示。</div><div class="ctrl"><label>行维度：<select id="rowDim" onchange="syncDims()"></select></label><label>列维度：<select id="colDim" onchange="syncDims()"></select></label><label id="filterBox">筛选：<select id="filterVal" onchange="render()"></select></label></div><table id="mt"></table><div class="legend">难度层级：<span class="level-beginner"></span>入门 <span class="level-intermediate"></span>进阶 <span class="level-advanced"></span>高级 ｜ 知识密度：<span class="d1"></span>低 <span class="d2"></span>中 <span class="d3"></span>高 ｜ “—”表示盲区</div>
<script>
const dims={"period": ["古典", "希腊化-罗马", "中世纪", "近代", "19世纪", "20世纪至当代"], "theme": ["形而上学", "认识论", "伦理学", "政治哲学", "语言与逻辑", "主体与存在"], "difficulty": ["入门", "进阶", "高级"]};const dimLabel={period:'时代阶段',theme:'主题问题',difficulty:'难度层级'};const entries=[{"name": "本原问题", "period": "古典", "theme": "形而上学", "difficulty": "入门"}, {"name": "理念论", "period": "古典", "theme": "形而上学", "difficulty": "进阶"}, {"name": "实体与四因", "period": "古典", "theme": "形而上学", "difficulty": "进阶"}, {"name": "苏格拉底诘问法", "period": "古典", "theme": "伦理学", "difficulty": "入门"}, {"name": "德性伦理", "period": "古典", "theme": "伦理学", "difficulty": "进阶"}, {"name": "三段论", "period": "古典", "theme": "语言与逻辑", "difficulty": "入门"}, {"name": "怀疑主义悬置", "period": "希腊化-罗马", "theme": "认识论", "difficulty": "入门"}, {"name": "斯多亚自然法", "period": "希腊化-罗马", "theme": "政治哲学", "difficulty": "进阶"}, {"name": "伊壁鸠鲁快乐论", "period": "希腊化-罗马", "theme": "伦理学", "difficulty": "入门"}, {"name": "新柏拉图流溢说", "period": "希腊化-罗马", "theme": "形而上学", "difficulty": "高级"}, {"name": "基督教时间观", "period": "中世纪", "theme": "主体与存在", "difficulty": "进阶"}, {"name": "共相之争", "period": "中世纪", "theme": "形而上学", "difficulty": "进阶"}, {"name": "信仰与理性", "period": "中世纪", "theme": "认识论", "difficulty": "入门"}, {"name": "自然法传统", "period": "中世纪", "theme": "政治哲学", "difficulty": "进阶"}, {"name": "奥卡姆剃刀", "period": "中世纪", "theme": "语言与逻辑", "difficulty": "入门"}, {"name": "我思故我在", "period": "近代", "theme": "主体与存在", "difficulty": "入门"}, {"name": "天赋观念", "period": "近代", "theme": "认识论", "difficulty": "进阶"}, {"name": "经验论观念来源", "period": "近代", "theme": "认识论", "difficulty": "入门"}, {"name": "休谟因果怀疑", "period": "近代", "theme": "认识论", "difficulty": "进阶"}, {"name": "社会契约论", "period": "近代", "theme": "政治哲学", "difficulty": "入门"}, {"name": "康德先验哲学", "period": "近代", "theme": "认识论", "difficulty": "高级"}, {"name": "定言命令", "period": "近代", "theme": "伦理学", "difficulty": "进阶"}, {"name": "黑格尔辩证法", "period": "19世纪", "theme": "形而上学", "difficulty": "高级"}, {"name": "异化劳动", "period": "19世纪", "theme": "政治哲学", "difficulty": "入门"}, {"name": "历史唯物主义", "period": "19世纪", "theme": "政治哲学", "difficulty": "进阶"}, {"name": "功利主义", "period": "19世纪", "theme": "伦理学", "difficulty": "入门"}, {"name": "权力意志", "period": "19世纪", "theme": "主体与存在", "difficulty": "进阶"}, {"name": "存在焦虑", "period": "19世纪", "theme": "主体与存在", "difficulty": "进阶"}, {"name": "意义与指称", "period": "20世纪至当代", "theme": "语言与逻辑", "difficulty": "进阶"}, {"name": "语言游戏", "period": "20世纪至当代", "theme": "语言与逻辑", "difficulty": "进阶"}, {"name": "证实原则", "period": "20世纪至当代", "theme": "认识论", "difficulty": "进阶"}, {"name": "意识难题", "period": "20世纪至当代", "theme": "主体与存在", "difficulty": "高级"}, {"name": "意向性", "period": "20世纪至当代", "theme": "主体与存在", "difficulty": "进阶"}, {"name": "生活世界", "period": "20世纪至当代", "theme": "认识论", "difficulty": "高级"}, {"name": "本真性", "period": "20世纪至当代", "theme": "主体与存在", "difficulty": "进阶"}, {"name": "权力知识", "period": "20世纪至当代", "theme": "政治哲学", "difficulty": "高级"}, {"name": "公平正义", "period": "20世纪至当代", "theme": "政治哲学", "difficulty": "进阶"}, {"name": "交往理性", "period": "20世纪至当代", "theme": "政治哲学", "difficulty": "高级"}, {"name": "范式转换", "period": "20世纪至当代", "theme": "认识论", "difficulty": "进阶"}, {"name": "技术座架", "period": "20世纪至当代", "theme": "形而上学", "difficulty": "高级"}, {"name": "性别建构", "period": "20世纪至当代", "theme": "主体与存在", "difficulty": "进阶"}, {"name": "代际正义", "period": "20世纪至当代", "theme": "伦理学", "difficulty": "进阶"}];const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');
function fillSelect(sel,selected){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${dimLabel[k]}</option>`).join('')}
function otherDim(){return keys.find(k=>k!==rowSel.value&&k!==colSel.value)}
function syncDims(){if(rowSel.value===colSel.value)colSel.value=keys.find(k=>k!==rowSel.value)||rowSel.value;const f=otherDim();document.getElementById('filterBox').style.display=f?'inline-block':'none';filterSel.innerHTML=f?'<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join(''):'';render()}
function cls(n){return n===0?'d0':(n<=1?'d1':(n<=3?'d2':'d3'))}function levelCls(v){return v==='入门'?'level-beginner':(v==='进阶'?'level-intermediate':(v==='高级'?'level-advanced':''))}function isDifficultyDim(dim){return dim==='difficulty'||/难度|层级|阶段/.test(dimLabel[dim]||dim)}
function itemsFor(rDim,rVal,cDim,cVal,fDim,fVal){return entries.filter(e=>e[rDim]===rVal&&e[cDim]===cVal&&(!fDim||fVal==='__all__'||e[fDim]===fVal))}
function render(){const rDim=rowSel.value,cDim=colSel.value,fDim=otherDim(),fVal=filterSel.value||'__all__',rows=dims[rDim],cols=dims[cDim];let html=`<tr><th>${dimLabel[rDim]} \ ${dimLabel[cDim]}</th>`+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';for(const r of rows){html+=`<tr><td class="row-h">${r}</td>`;for(const c of cols){const items=itemsFor(rDim,r,cDim,c,fDim,fVal),cnt=items.length;let body='—',cellLevelClass=isDifficultyDim(rDim)?levelCls(r):(isDifficultyDim(cDim)?levelCls(c):'');if(items.length&&fDim&&fVal==='__all__'){body=dims[fDim].map(v=>{const group=items.filter(x=>x[fDim]===v),blockClass=isDifficultyDim(fDim)?` level-block ${levelCls(v)}`:'';return group.length?`<div class="${blockClass.trim()}"><div class="group">${v}</div>`+group.map(x=>'• '+x.name).join('<br>')+'</div>':''}).filter(Boolean).join('')}else if(items.length){body=items.map(x=>'• '+x.name).join('<br>');if(fDim&&isDifficultyDim(fDim)&&fVal!=='__all__')cellLevelClass=levelCls(fVal)}html+=`<td class="cell ${cellLevelClass||cls(cnt)}">${body}</td>`}html+='</tr>'}document.getElementById('mt').innerHTML=html}
fillSelect(rowSel,'period');fillSelect(colSel,'theme');syncDims();
</script></body></html>
