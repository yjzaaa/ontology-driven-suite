const raw={"name": "EA企业架构", "children": [{"name": "EA定位与治理", "color": "#3f51b5", "children": [{"name": "架构愿景", "children": [{"name": "业务驱动"}, {"name": "利益相关者"}, {"name": "架构原则"}]}, {"name": "治理机制", "children": [{"name": "架构委员会"}, {"name": "决策权责"}, {"name": "合规评审"}]}, {"name": "价值闭环", "children": [{"name": "战略对齐"}, {"name": "投资组合"}, {"name": "收益度量"}]}]}, {"name": "TOGAF ADM方法", "color": "#009688", "children": [{"name": "预备阶段", "children": [{"name": "架构能力"}, {"name": "方法裁剪"}, {"name": "原则基线"}]}, {"name": "ADM循环", "children": [{"name": "A到H阶段"}, {"name": "需求管理"}, {"name": "迭代治理"}]}, {"name": "架构制品", "children": [{"name": "目录"}, {"name": "矩阵"}, {"name": "图"}]}]}, {"name": "业务架构", "color": "#ff9800", "children": [{"name": "能力模型", "children": [{"name": "业务能力"}, {"name": "价值流"}, {"name": "组织映射"}]}, {"name": "业务分析", "children": [{"name": "需求引出"}, {"name": "利益相关者"}, {"name": "业务规则"}]}, {"name": "运营模型", "children": [{"name": "流程"}, {"name": "场景"}, {"name": "绩效指标"}]}]}, {"name": "数据架构治理", "color": "#e91e63", "children": [{"name": "数据资产", "children": [{"name": "数据域"}, {"name": "主数据"}, {"name": "元数据"}]}, {"name": "治理体系", "children": [{"name": "数据标准"}, {"name": "数据质量"}, {"name": "数据责任"}]}, {"name": "成熟度", "children": [{"name": "DCMM能力域"}, {"name": "DAMA职能"}, {"name": "评估改进"}]}]}, {"name": "应用架构", "color": "#4caf50", "children": [{"name": "应用组合", "children": [{"name": "应用地图"}, {"name": "能力覆盖"}, {"name": "生命周期"}]}, {"name": "集成架构", "children": [{"name": "API"}, {"name": "事件"}, {"name": "服务编排"}]}, {"name": "现代化", "children": [{"name": "单体拆分"}, {"name": "产品化团队"}, {"name": "平台工程"}]}]}, {"name": "技术架构", "color": "#00bcd4", "children": [{"name": "基础设施", "children": [{"name": "计算存储网络"}, {"name": "混合云"}, {"name": "容灾"}]}, {"name": "云原生", "children": [{"name": "容器"}, {"name": "Kubernetes"}, {"name": "可观测性"}]}, {"name": "安全韧性", "children": [{"name": "零信任"}, {"name": "SRE"}, {"name": "自动化运维"}]}]}, {"name": "领域建模与微服务", "color": "#9c27b0", "children": [{"name": "DDD", "children": [{"name": "限界上下文"}, {"name": "聚合"}, {"name": "领域事件"}]}, {"name": "微服务", "children": [{"name": "服务自治"}, {"name": "数据库独立"}, {"name": "部署独立"}]}, {"name": "架构适配", "children": [{"name": "能力到服务"}, {"name": "事件风暴"}, {"name": "服务契约"}]}]}, {"name": "迁移规划与实施", "color": "#ff5722", "children": [{"name": "差距分析", "children": [{"name": "基线架构"}, {"name": "目标架构"}, {"name": "过渡架构"}]}, {"name": "路线图", "children": [{"name": "工作包"}, {"name": "依赖"}, {"name": "里程碑"}]}, {"name": "变更管理", "children": [{"name": "沟通"}, {"name": "培训"}, {"name": "采纳度"}]}]}, {"name": "架构资产与工具", "color": "#795548", "children": [{"name": "架构仓库", "children": [{"name": "标准库"}, {"name": "模式库"}, {"name": "参考架构"}]}, {"name": "建模语言", "children": [{"name": "ArchiMate"}, {"name": "UML"}, {"name": "C4"}]}, {"name": "工具链", "children": [{"name": "EA工具"}, {"name": "CMDB"}, {"name": "DevOps集成"}]}]}, {"name": "度量与持续演进", "color": "#607d8b", "children": [{"name": "架构KPI", "children": [{"name": "复杂度"}, {"name": "复用率"}, {"name": "技术债"}]}, {"name": "运营度量", "children": [{"name": "交付频率"}, {"name": "可靠性"}, {"name": "成本"}]}, {"name": "持续改进", "children": [{"name": "成熟度复盘"}, {"name": "架构雷达"}, {"name": "例外治理"}]}]}]};const KSB_PALETTE={branches:["#3f51b5", "#009688", "#ff9800", "#e91e63", "#4caf50", "#00bcd4", "#9c27b0", "#ff5722", "#795548", "#607d8b"]};const svg=d3.select('#svg'),gZoom=svg.append('g'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');const PAD=190,VGAP=44,HSTEP=185;
function nodeWidth(d){return Math.max(d.depth===0?150:80,d.data.name.length*13+26)}function nodeHeight(d){return d.depth===0?42:(d.depth===1?31:27)}function colorOf(d){if(d.depth===0)return'#1a237e';let n=d;while(n.depth>1)n=n.parent;return n.data.color||KSB_PALETTE.branches[0]}function foldAfterDepth(n,depth=3,cur=0){if(!n.children)return;if(cur>=depth){n._children=n.children;n.children=null;n._folded=true;return}n.children.forEach(c=>foldAfterDepth(c,depth,cur+1))}function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes}function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(26,dx*.42);return`M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`}
function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null},allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx))+PAD,minY=Math.min(...allNodes.map(n=>n.yy))-70,maxY=Math.max(...allNodes.map(n=>n.yy))+70,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth).join('path').attr('class','link').attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.2:1.4).attr('opacity',d=>d.target.depth===1?.9:.55);const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth).join(enter=>{const e=enter.append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true}render()});e.append('rect');e.append('text');return e});node.attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d);sel.selectAll('.bar').remove();if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',10).attr('fill',c);sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700)}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600)}else{sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('stroke','#e5e7ef');sel.insert('rect','text').attr('class','bar').attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#263238').attr('font-size',12.5)}})}function walk(n,fn){fn(n);(n.children||n._children||[]).forEach(c=>walk(c,fn))}function expandAll(){walk(raw,n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false}});render()}function expandToThird(){expandAll();foldAfterDepth(raw,3);render()}function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true}});render()}const zoom=d3.zoom().scaleExtent([.35,2.5]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);function resetZoom(){svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity)}expandToThird();
