<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>EA企业架构中间层矩阵</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1a1a2e}h2{text-align:center}.desc{max-width:1180px;margin:0 auto 14px;color:#4b5563;line-height:1.7}.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select{padding:5px 8px}table{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 2px 8px #0001}th,td{border:1px solid #d7dbe8;padding:10px 12px;vertical-align:top;min-width:190px;max-width:330px}th{background:#3f51b5;color:#fff}.row-h{background:#5c6bc0;color:#fff;font-weight:bold}.cell{font-size:13px;line-height:1.52}.d0{background:#fff}.d1{background:#f6f8ff}.d2{background:#eef2ff}.d3{background:#e3e9ff}.level-beginner{background:#dff6e5}.level-intermediate{background:#fff1b8}.level-advanced{background:#f2c94c}.level-block{border-radius:7px;margin:6px 0;padding:8px 9px;border:1px solid #00000014}.group{margin:0 0 5px;font-weight:700;color:#1f2a3d}.kb{background:#fff;border:1px solid #dfe4f1;border-radius:7px;margin:6px 0;padding:8px 9px;box-shadow:0 1px 2px #0000000c}.kb-title{font-weight:700;color:#1a237e;margin-bottom:4px}.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 7px;margin-left:4px;background:#eef2ff;color:#3949ab;border:1px solid #d7defc}.legend{text-align:center;margin-top:14px;color:#555;font-size:13px}.legend span{display:inline-block;width:14px;height:14px;margin:0 4px;vertical-align:middle;border:1px solid #00000018}</style></head><body><h2>中间层 · EA企业架构动态多维知识矩阵</h2><div class="desc">维度含义：架构域定位内容范围；架构活动定位工作方式；难度层级提示学习顺序。每个知识块包含焦点、产出和前导。</div><div class="ctrl"><label>行维度：<select id="rowDim" onchange="syncDims()"></select></label><label>列维度：<select id="colDim" onchange="syncDims()"></select></label><label id="filterBox">筛选：<select id="filterVal" onchange="render()"></select></label></div><table id="mt"></table><div class="legend">难度层级：<span class="level-beginner"></span>入门 <span class="level-intermediate"></span>进阶 <span class="level-advanced"></span>高级 ｜ 知识密度：<span class="d1"></span>低 <span class="d2"></span>中 <span class="d3"></span>高 ｜ “—”表示该交叉点不是主学习重点</div><script>
const dims={"domain": ["战略治理", "业务架构", "数据架构", "应用架构", "技术架构", "实施演进"], "activity": ["识别", "建模", "治理", "设计", "迁移", "度量"], "difficulty": ["入门", "进阶", "高级"]};const dimLabel={domain:'架构域',activity:'架构活动',difficulty:'难度层级'};const entries=[{"title": "EA价值定位", "domain": "战略治理", "activity": "识别", "difficulty": "入门", "focus": "明确EA服务于战略落地、复杂度治理和投资决策。", "output": "EA价值假设与问题清单", "prereq": "组织战略与IT现状"}, {"title": "架构原则制定", "domain": "战略治理", "activity": "治理", "difficulty": "入门", "focus": "定义跨业务和技术决策的稳定约束。", "output": "架构原则清单", "prereq": "EA价值定位"}, {"title": "利益相关者地图", "domain": "战略治理", "activity": "识别", "difficulty": "入门", "focus": "识别业务、IT、数据、安全、财务等决策参与者。", "output": "Stakeholder map", "prereq": "架构愿景"}, {"title": "架构治理模型", "domain": "战略治理", "activity": "治理", "difficulty": "进阶", "focus": "建立架构委员会、评审流程、例外机制和决策权责。", "output": "治理章程与评审流程", "prereq": "架构原则"}, {"title": "投资组合对齐", "domain": "战略治理", "activity": "度量", "difficulty": "高级", "focus": "将架构路线图与项目组合、预算和收益指标连接。", "output": "投资组合架构视图", "prereq": "治理模型"}, {"title": "业务能力地图", "domain": "业务架构", "activity": "建模", "difficulty": "入门", "focus": "用稳定能力表达企业做什么，而非组织怎么分工。", "output": "一级/二级能力地图", "prereq": "战略目标"}, {"title": "价值流建模", "domain": "业务架构", "activity": "建模", "difficulty": "入门", "focus": "表达从触发到价值实现的端到端业务流。", "output": "价值流图", "prereq": "能力地图"}, {"title": "BABOK需求引出", "domain": "业务架构", "activity": "识别", "difficulty": "入门", "focus": "通过访谈、工作坊、观察等方式获取业务需求和约束。", "output": "需求引出计划", "prereq": "利益相关者地图"}, {"title": "能力-应用映射", "domain": "业务架构", "activity": "设计", "difficulty": "进阶", "focus": "识别哪些应用支撑哪些能力，暴露重复和空白。", "output": "能力应用矩阵", "prereq": "能力地图+应用清单"}, {"title": "业务规则治理", "domain": "业务架构", "activity": "治理", "difficulty": "进阶", "focus": "管理跨系统复用的规则、政策和决策表。", "output": "业务规则库", "prereq": "需求分析"}, {"title": "运营模型设计", "domain": "业务架构", "activity": "设计", "difficulty": "高级", "focus": "整合组织、流程、能力、绩效和系统支撑方式。", "output": "目标运营模型", "prereq": "价值流+能力地图"}, {"title": "数据域划分", "domain": "数据架构", "activity": "建模", "difficulty": "入门", "focus": "按业务主题划分客户、产品、交易、财务等数据域。", "output": "数据域地图", "prereq": "业务能力地图"}, {"title": "主数据识别", "domain": "数据架构", "activity": "识别", "difficulty": "入门", "focus": "识别跨流程共享且需统一治理的核心实体。", "output": "主数据清单", "prereq": "数据域划分"}, {"title": "元数据管理", "domain": "数据架构", "activity": "治理", "difficulty": "进阶", "focus": "管理业务、技术、操作和血缘元数据。", "output": "元数据模型", "prereq": "数据资产盘点"}, {"title": "数据质量规则", "domain": "数据架构", "activity": "治理", "difficulty": "进阶", "focus": "定义完整性、一致性、准确性、及时性等规则。", "output": "质量规则与监控", "prereq": "主数据识别"}, {"title": "DCMM能力评估", "domain": "数据架构", "activity": "度量", "difficulty": "高级", "focus": "基于数据战略、治理、架构、质量、安全等能力评估成熟度。", "output": "DCMM差距报告", "prereq": "数据治理体系"}, {"title": "DAMA职能映射", "domain": "数据架构", "activity": "治理", "difficulty": "高级", "focus": "将数据治理、架构、建模、质量、安全、集成等职能纳入EA。", "output": "DAMA-EA映射表", "prereq": "数据治理知识"}, {"title": "应用组合盘点", "domain": "应用架构", "activity": "识别", "difficulty": "入门", "focus": "梳理应用、系统边界、负责人、技术栈和生命周期。", "output": "应用清单", "prereq": "CMDB/访谈"}, {"title": "应用能力覆盖", "domain": "应用架构", "activity": "建模", "difficulty": "入门", "focus": "用能力维度分析应用重复、缺失和关键依赖。", "output": "应用能力热力图", "prereq": "能力-应用映射"}, {"title": "集成模式设计", "domain": "应用架构", "activity": "设计", "difficulty": "进阶", "focus": "选择API、事件、批处理、消息、文件等集成方式。", "output": "集成模式矩阵", "prereq": "应用组合"}, {"title": "应用现代化分层", "domain": "应用架构", "activity": "迁移", "difficulty": "进阶", "focus": "按保留、替换、重构、退役、SaaS化规划演进。", "output": "应用处置策略", "prereq": "应用组合盘点"}, {"title": "微服务边界设计", "domain": "应用架构", "activity": "设计", "difficulty": "高级", "focus": "用领域边界和业务能力定义服务自治边界。", "output": "服务边界图", "prereq": "DDD限界上下文"}, {"title": "云原生目标架构", "domain": "技术架构", "activity": "设计", "difficulty": "入门", "focus": "定义容器、Kubernetes、服务网格、可观测性和自动化基线。", "output": "云原生参考架构", "prereq": "技术现状"}, {"title": "技术标准栈", "domain": "技术架构", "activity": "治理", "difficulty": "入门", "focus": "定义操作系统、中间件、数据库、语言、平台标准。", "output": "技术标准目录", "prereq": "架构原则"}, {"title": "SRE与可观测性", "domain": "技术架构", "activity": "度量", "difficulty": "进阶", "focus": "用SLI/SLO、日志、指标、链路追踪管理可靠性。", "output": "可靠性度量模型", "prereq": "云原生架构"}, {"title": "零信任架构", "domain": "技术架构", "activity": "设计", "difficulty": "进阶", "focus": "围绕身份、设备、网络、应用和数据建立持续验证。", "output": "安全架构图", "prereq": "安全需求"}, {"title": "平台工程", "domain": "技术架构", "activity": "设计", "difficulty": "高级", "focus": "为团队提供自服务交付、环境、流水线和运行能力。", "output": "内部开发平台蓝图", "prereq": "DevOps基础"}, {"title": "基线架构描述", "domain": "实施演进", "activity": "建模", "difficulty": "入门", "focus": "描述当前业务、数据、应用、技术架构状态。", "output": "Baseline Architecture", "prereq": "架构盘点"}, {"title": "目标架构描述", "domain": "实施演进", "activity": "设计", "difficulty": "进阶", "focus": "定义满足业务目标的未来架构状态。", "output": "Target Architecture", "prereq": "架构愿景"}, {"title": "差距分析", "domain": "实施演进", "activity": "识别", "difficulty": "进阶", "focus": "比较基线与目标，识别能力、系统、数据和技术差距。", "output": "Gap analysis", "prereq": "基线+目标架构"}, {"title": "过渡架构", "domain": "实施演进", "activity": "迁移", "difficulty": "进阶", "focus": "定义从当前到目标的中间状态，降低一次性迁移风险。", "output": "Transition Architecture", "prereq": "差距分析"}, {"title": "架构路线图", "domain": "实施演进", "activity": "迁移", "difficulty": "进阶", "focus": "将工作包、依赖、里程碑和收益组织成实施计划。", "output": "Roadmap", "prereq": "过渡架构"}, {"title": "架构度量体系", "domain": "实施演进", "activity": "度量", "difficulty": "高级", "focus": "度量复杂度、复用率、可靠性、交付效率和业务收益。", "output": "EA KPI体系", "prereq": "路线图"}];const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');function fillSelect(sel,selected){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${dimLabel[k]}</option>`).join('')}function otherDim(){return keys.find(k=>k!==rowSel.value&&k!==colSel.value)}function syncDims(){if(rowSel.value===colSel.value)colSel.value=keys.find(k=>k!==rowSel.value)||rowSel.value;const f=otherDim();document.getElementById('filterBox').style.display=f?'inline-block':'none';filterSel.innerHTML=f?'<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join(''):'';render()}function cls(n){return n===0?'d0':(n<=1?'d1':(n<=3?'d2':'d3'))}function levelCls(v){return v==='入门'?'level-beginner':(v==='进阶'?'level-intermediate':(v==='高级'?'level-advanced':''))}function isDifficultyDim(dim){return dim==='difficulty'}function itemsFor(rDim,rVal,cDim,cVal,fDim,fVal){return entries.filter(e=>e[rDim]===rVal&&e[cDim]===cVal&&(!fDim||fVal==='__all__'||e[fDim]===fVal))}function itemHtml(x){return `<div class="kb"><div class="kb-title">${x.title}<span class="tag">${x.difficulty}</span></div><div><b>焦点：</b>${x.focus}</div><div><b>产出：</b>${x.output}</div><div><b>前导：</b>${x.prereq}</div></div>`}function render(){const rDim=rowSel.value,cDim=colSel.value,fDim=otherDim(),fVal=filterSel.value||'__all__',rows=dims[rDim],cols=dims[cDim];let html=`<tr><th>${dimLabel[rDim]} \\ ${dimLabel[cDim]}</th>`+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';for(const r of rows){html+=`<tr><td class="row-h">${r}</td>`;for(const c of cols){const items=itemsFor(rDim,r,cDim,c,fDim,fVal),cnt=items.length;let body='—',cellLevelClass=isDifficultyDim(rDim)?levelCls(r):(isDifficultyDim(cDim)?levelCls(c):'');if(items.length&&fDim&&fVal==='__all__'){body=dims[fDim].map(v=>{const group=items.filter(x=>x[fDim]===v),blockClass=isDifficultyDim(fDim)?` level-block ${levelCls(v)}`:'';return group.length?`<div class="${blockClass.trim()}"><div class="group">${v}</div>`+group.map(itemHtml).join('')+'</div>':''}).filter(Boolean).join('')}else if(items.length){body=items.map(itemHtml).join('');if(fDim&&isDifficultyDim(fDim)&&fVal!=='__all__')cellLevelClass=levelCls(fVal)}html+=`<td class="cell ${cellLevelClass||cls(cnt)}">${body}</td>`}html+='</tr>'}document.getElementById('mt').innerHTML=html}fillSelect(rowSel,'domain');fillSelect(colSel,'activity');syncDims();
</script></body></html>
