<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>心理学中间层矩阵</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1a1a2e}h2{text-align:center}.desc{max-width:1180px;margin:0 auto 14px;color:#4b5563;line-height:1.7}.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select{padding:5px 8px}table{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 2px 8px #0001}th,td{border:1px solid #d7dbe8;padding:10px 12px;vertical-align:top;min-width:190px;max-width:330px}th{background:#3f51b5;color:#fff}.row-h{background:#5c6bc0;color:#fff;font-weight:bold}.cell{font-size:13px;line-height:1.52}.d0{background:#fff}.d1{background:#f6f8ff}.d2{background:#eef2ff}.d3{background:#e3e9ff}.level-beginner{background:#dff6e5}.level-intermediate{background:#fff1b8}.level-advanced{background:#f2c94c}.level-block{border-radius:7px;margin:6px 0;padding:8px 9px;border:1px solid #00000014}.group{margin:0 0 5px;font-weight:700;color:#1f2a3d}.kb{background:#fff;border:1px solid #dfe4f1;border-radius:7px;margin:6px 0;padding:8px 9px}.kb-title{font-weight:700;color:#1a237e;margin-bottom:4px}.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 7px;margin-left:4px;background:#eef2ff;color:#3949ab;border:1px solid #d7defc}.legend{text-align:center;margin-top:14px;color:#555;font-size:13px}.legend span{display:inline-block;width:14px;height:14px;margin:0 4px;vertical-align:middle;border:1px solid #00000018}</style></head><body><h2>中间层 · 心理学动态多维知识矩阵</h2><div class="desc">维度含义：知识域定位内容范围；研究/应用活动定位学习动作；难度层级提示学习顺序。每个知识块包含焦点、产出和前导。</div><div class="ctrl"><label>行维度：<select id="rowDim" onchange="syncDims()"></select></label><label>列维度：<select id="colDim" onchange="syncDims()"></select></label><label id="filterBox">筛选：<select id="filterVal" onchange="render()"></select></label></div><table id="mt"></table><div class="legend">难度层级：<span class="level-beginner"></span>入门 <span class="level-intermediate"></span>进阶 <span class="level-advanced"></span>高级 ｜ 知识密度：<span class="d1"></span>低 <span class="d2"></span>中 <span class="d3"></span>高 ｜ “—”表示非主学习重点</div><script>
const dims={"domain": ["方法基础", "生物认知", "发展个体", "社会人格", "临床健康", "应用前沿"], "activity": ["观察", "实验", "测量", "解释", "干预", "评估"], "difficulty": ["入门", "进阶", "高级"]};const dimLabel={domain:'知识域',activity:'研究/应用活动',difficulty:'难度层级'};const entries=[{"title": "心理学科学观", "domain": "方法基础", "activity": "解释", "difficulty": "入门", "focus": "理解心理学用科学方法解释心理过程和行为。", "output": "学科定义与问题清单", "prereq": "无"}, {"title": "实验设计", "domain": "方法基础", "activity": "实验", "difficulty": "入门", "focus": "区分自变量、因变量、控制变量和随机分配。", "output": "实验设计模板", "prereq": "科学方法"}, {"title": "相关与因果", "domain": "方法基础", "activity": "评估", "difficulty": "入门", "focus": "理解相关不等于因果。", "output": "研究结论判断表", "prereq": "统计基础"}, {"title": "心理测量信效度", "domain": "方法基础", "activity": "测量", "difficulty": "进阶", "focus": "理解信度、效度、常模和测验解释边界。", "output": "测量评估清单", "prereq": "统计基础"}, {"title": "研究伦理", "domain": "方法基础", "activity": "评估", "difficulty": "进阶", "focus": "处理知情同意、隐私、风险和弱势群体保护。", "output": "伦理审查要点", "prereq": "研究方法"}, {"title": "神经元与脑区", "domain": "生物认知", "activity": "解释", "difficulty": "入门", "focus": "理解神经元、突触、脑区功能和神经递质。", "output": "脑-行为映射表", "prereq": "生物基础"}, {"title": "感觉知觉机制", "domain": "生物认知", "activity": "观察", "difficulty": "入门", "focus": "理解感觉输入如何被组织为知觉经验。", "output": "知觉现象案例表", "prereq": "神经基础"}, {"title": "注意与执行控制", "domain": "生物认知", "activity": "实验", "difficulty": "进阶", "focus": "分析选择注意、工作记忆和认知控制。", "output": "注意实验设计", "prereq": "感觉知觉"}, {"title": "学习机制", "domain": "生物认知", "activity": "实验", "difficulty": "入门", "focus": "掌握经典条件作用、操作条件作用和观察学习。", "output": "学习机制对照表", "prereq": "行为主义"}, {"title": "记忆系统", "domain": "生物认知", "activity": "解释", "difficulty": "进阶", "focus": "区分工作记忆、情景记忆、语义记忆和程序记忆。", "output": "记忆系统图", "prereq": "认知心理学"}, {"title": "儿童认知发展", "domain": "发展个体", "activity": "观察", "difficulty": "入门", "focus": "理解发展阶段、依恋、语言和社会化。", "output": "发展里程碑表", "prereq": "发展心理基础"}, {"title": "生命周期发展", "domain": "发展个体", "activity": "解释", "difficulty": "进阶", "focus": "理解青少年、成年、中老年发展任务。", "output": "生命周期任务图", "prereq": "儿童发展"}, {"title": "人格特质", "domain": "发展个体", "activity": "测量", "difficulty": "入门", "focus": "理解特质模型和个体差异测量。", "output": "人格维度说明", "prereq": "心理测量"}, {"title": "情绪调节", "domain": "发展个体", "activity": "干预", "difficulty": "进阶", "focus": "理解情绪识别、调节策略和压力应对。", "output": "情绪调节方案", "prereq": "动机情绪"}, {"title": "社会认知", "domain": "社会人格", "activity": "解释", "difficulty": "入门", "focus": "理解归因、态度、刻板印象和偏见。", "output": "社会认知概念图", "prereq": "基础心理"}, {"title": "社会影响", "domain": "社会人格", "activity": "实验", "difficulty": "进阶", "focus": "分析从众、服从、说服和群体压力。", "output": "社会影响实验解读", "prereq": "社会认知"}, {"title": "群体与关系", "domain": "社会人格", "activity": "观察", "difficulty": "进阶", "focus": "理解群体决策、亲密关系、亲社会和攻击行为。", "output": "群体关系分析表", "prereq": "社会心理"}, {"title": "心理障碍分类", "domain": "临床健康", "activity": "解释", "difficulty": "入门", "focus": "理解焦虑、抑郁、创伤、精神病性症状等障碍类别。", "output": "障碍分类速查表", "prereq": "异常心理"}, {"title": "临床评估", "domain": "临床健康", "activity": "测量", "difficulty": "进阶", "focus": "结合访谈、量表、行为观察和风险评估。", "output": "个案评估框架", "prereq": "心理测量"}, {"title": "CBT基础", "domain": "临床健康", "activity": "干预", "difficulty": "入门", "focus": "理解认知、情绪、行为之间的相互作用。", "output": "CBT案例概念化", "prereq": "临床基础"}, {"title": "危机干预", "domain": "临床健康", "activity": "干预", "difficulty": "高级", "focus": "识别自伤自杀、创伤和危机状态并进行转介。", "output": "危机处理流程", "prereq": "临床伦理"}, {"title": "健康行为改变", "domain": "临床健康", "activity": "干预", "difficulty": "进阶", "focus": "用动机、习惯、社会支持和反馈促进健康行为。", "output": "行为改变计划", "prereq": "健康心理"}, {"title": "组织教育应用", "domain": "应用前沿", "activity": "干预", "difficulty": "入门", "focus": "将学习动机、领导、压力管理用于学校和组织。", "output": "应用场景方案", "prereq": "基础心理"}, {"title": "脑成像与认知神经", "domain": "应用前沿", "activity": "测量", "difficulty": "高级", "focus": "理解fMRI/EEG等方法如何研究心理功能。", "output": "方法-问题匹配表", "prereq": "神经基础"}, {"title": "开放科学与可重复性", "domain": "应用前沿", "activity": "评估", "difficulty": "高级", "focus": "理解预注册、数据共享、复现和研究透明度。", "output": "开放科学检查表", "prereq": "研究伦理"}];const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');function fillSelect(sel,selected){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${dimLabel[k]}</option>`).join('')}function otherDim(){return keys.find(k=>k!==rowSel.value&&k!==colSel.value)}function syncDims(){if(rowSel.value===colSel.value)colSel.value=keys.find(k=>k!==rowSel.value)||rowSel.value;const f=otherDim();document.getElementById('filterBox').style.display=f?'inline-block':'none';filterSel.innerHTML=f?'<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join(''):'';render()}function cls(n){return n===0?'d0':(n<=1?'d1':(n<=3?'d2':'d3'))}function levelCls(v){return v==='入门'?'level-beginner':(v==='进阶'?'level-intermediate':(v==='高级'?'level-advanced':''))}function isDifficultyDim(dim){return dim==='difficulty'}function itemsFor(rDim,rVal,cDim,cVal,fDim,fVal){return entries.filter(e=>e[rDim]===rVal&&e[cDim]===cVal&&(!fDim||fVal==='__all__'||e[fDim]===fVal))}function itemHtml(x){return `<div class="kb"><div class="kb-title">${x.title}<span class="tag">${x.difficulty}</span></div><div><b>焦点：</b>${x.focus}</div><div><b>产出：</b>${x.output}</div><div><b>前导：</b>${x.prereq}</div></div>`}function render(){const rDim=rowSel.value,cDim=colSel.value,fDim=otherDim(),fVal=filterSel.value||'__all__',rows=dims[rDim],cols=dims[cDim];let html=`<tr><th>${dimLabel[rDim]} \\ ${dimLabel[cDim]}</th>`+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';for(const r of rows){html+=`<tr><td class="row-h">${r}</td>`;for(const c of cols){const items=itemsFor(rDim,r,cDim,c,fDim,fVal),cnt=items.length;let body='—',cellLevelClass=isDifficultyDim(rDim)?levelCls(r):(isDifficultyDim(cDim)?levelCls(c):'');if(items.length&&fDim&&fVal==='__all__'){body=dims[fDim].map(v=>{const group=items.filter(x=>x[fDim]===v),blockClass=isDifficultyDim(fDim)?` level-block ${levelCls(v)}`:'';return group.length?`<div class="${blockClass.trim()}"><div class="group">${v}</div>`+group.map(itemHtml).join('')+'</div>':''}).filter(Boolean).join('')}else if(items.length){body=items.map(itemHtml).join('');if(fDim&&isDifficultyDim(fDim)&&fVal!=='__all__')cellLevelClass=levelCls(fVal)}html+=`<td class="cell ${cellLevelClass||cls(cnt)}">${body}</td>`}html+='</tr>'}document.getElementById('mt').innerHTML=html}fillSelect(rowSel,'domain');fillSelect(colSel,'activity');syncDims();
</script></body></html>
