const raw={"name": "心理学", "children": [{"name": "心理学导论与方法", "color": "#3f51b5", "children": [{"name": "学科定位", "children": [{"name": "心理过程"}, {"name": "行为"}, {"name": "科学解释"}]}, {"name": "研究方法", "children": [{"name": "实验"}, {"name": "调查"}, {"name": "相关"}]}, {"name": "伦理规范", "children": [{"name": "知情同意"}, {"name": "隐私"}, {"name": "风险控制"}]}]}, {"name": "生物与神经基础", "color": "#009688", "children": [{"name": "神经系统", "children": [{"name": "神经元"}, {"name": "脑区"}, {"name": "神经递质"}]}, {"name": "生理基础", "children": [{"name": "内分泌"}, {"name": "遗传"}, {"name": "进化"}]}, {"name": "意识与睡眠", "children": [{"name": "意识状态"}, {"name": "睡眠阶段"}, {"name": "梦"}]}]}, {"name": "感觉知觉与注意", "color": "#ff9800", "children": [{"name": "感觉系统", "children": [{"name": "视觉"}, {"name": "听觉"}, {"name": "体感"}]}, {"name": "知觉组织", "children": [{"name": "格式塔"}, {"name": "深度知觉"}, {"name": "恒常性"}]}, {"name": "注意机制", "children": [{"name": "选择注意"}, {"name": "分配注意"}, {"name": "执行控制"}]}]}, {"name": "学习记忆与认知", "color": "#e91e63", "children": [{"name": "学习", "children": [{"name": "经典条件作用"}, {"name": "操作条件作用"}, {"name": "观察学习"}]}, {"name": "记忆", "children": [{"name": "工作记忆"}, {"name": "长时记忆"}, {"name": "遗忘"}]}, {"name": "思维语言", "children": [{"name": "概念"}, {"name": "问题解决"}, {"name": "语言"}]}]}, {"name": "发展心理学", "color": "#4caf50", "children": [{"name": "儿童发展", "children": [{"name": "依恋"}, {"name": "认知发展"}, {"name": "社会化"}]}, {"name": "青少年与成人", "children": [{"name": "身份认同"}, {"name": "亲密关系"}, {"name": "老化"}]}, {"name": "发展研究", "children": [{"name": "纵向研究"}, {"name": "横断研究"}, {"name": "关键期"}]}]}, {"name": "人格与个体差异", "color": "#00bcd4", "children": [{"name": "人格理论", "children": [{"name": "特质论"}, {"name": "精神分析"}, {"name": "人本主义"}]}, {"name": "测量评估", "children": [{"name": "人格量表"}, {"name": "信度效度"}, {"name": "测验解释"}]}, {"name": "动机情绪", "children": [{"name": "需要"}, {"name": "情绪调节"}, {"name": "压力"}]}]}, {"name": "社会心理学", "color": "#9c27b0", "children": [{"name": "社会认知", "children": [{"name": "归因"}, {"name": "态度"}, {"name": "偏见"}]}, {"name": "社会影响", "children": [{"name": "从众"}, {"name": "服从"}, {"name": "说服"}]}, {"name": "群体关系", "children": [{"name": "群体决策"}, {"name": "亲社会"}, {"name": "攻击"}]}]}, {"name": "异常与临床心理", "color": "#ff5722", "children": [{"name": "心理障碍", "children": [{"name": "焦虑"}, {"name": "抑郁"}, {"name": "精神病性症状"}]}, {"name": "评估诊断", "children": [{"name": "访谈"}, {"name": "量表"}, {"name": "DSM"}]}, {"name": "心理治疗", "children": [{"name": "CBT"}, {"name": "精神动力"}, {"name": "家庭治疗"}]}]}, {"name": "健康与咨询应用", "color": "#795548", "children": [{"name": "健康心理", "children": [{"name": "压力健康"}, {"name": "行为改变"}, {"name": "慢病管理"}]}, {"name": "咨询心理", "children": [{"name": "来访者关系"}, {"name": "危机干预"}, {"name": "职业咨询"}]}, {"name": "组织教育", "children": [{"name": "学习动机"}, {"name": "领导"}, {"name": "工作压力"}]}]}, {"name": "认知神经与前沿", "color": "#607d8b", "children": [{"name": "认知神经科学", "children": [{"name": "脑成像"}, {"name": "执行功能"}, {"name": "情绪脑"}]}, {"name": "计算与AI", "children": [{"name": "认知模型"}, {"name": "机器学习"}, {"name": "人机交互"}]}, {"name": "跨文化与伦理", "children": [{"name": "文化差异"}, {"name": "可重复性"}, {"name": "开放科学"}]}]}]};const KSB_PALETTE={branches:["#3f51b5", "#009688", "#ff9800", "#e91e63", "#4caf50", "#00bcd4", "#9c27b0", "#ff5722", "#795548", "#607d8b"]};const svg=d3.select('#svg'),gZoom=svg.append('g'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');const PAD=190,VGAP=44,HSTEP=185;function nodeWidth(d){return Math.max(d.depth===0?150:80,d.data.name.length*13+26)}function nodeHeight(d){return d.depth===0?42:(d.depth===1?31:27)}function colorOf(d){if(d.depth===0)return'#1a237e';let n=d;while(n.depth>1)n=n.parent;return n.data.color||KSB_PALETTE.branches[0]}function foldAfterDepth(n,depth=3,cur=0){if(!n.children)return;if(cur>=depth){n._children=n.children;n.children=null;n._folded=true;return}n.children.forEach(c=>foldAfterDepth(c,depth,cur+1))}function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes}function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(26,dx*.42);return`M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`}function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null},allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx))+PAD,minY=Math.min(...allNodes.map(n=>n.yy))-70,maxY=Math.max(...allNodes.map(n=>n.yy))+70,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth).join('path').attr('class','link').attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.2:1.4).attr('opacity',d=>d.target.depth===1?.9:.55);const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth).join(enter=>{const e=enter.append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true}render()});e.append('rect');e.append('text');return e});node.attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d);sel.selectAll('.bar').remove();if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',10).attr('fill',c);sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700)}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600)}else{sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('stroke','#e5e7ef');sel.insert('rect','text').attr('class','bar').attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#263238').attr('font-size',12.5)}})}function walk(n,fn){fn(n);(n.children||n._children||[]).forEach(c=>walk(c,fn))}function expandAll(){walk(raw,n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false}});render()}function expandToThird(){expandAll();foldAfterDepth(raw,3);render()}function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true}});render()}const zoom=d3.zoom().scaleExtent([.35,2.5]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);function resetZoom(){svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity)}expandToThird();
</script></body></html>
