<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>人工智能知识体系顶层思维导图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#f7f8fa;font-family:"Microsoft YaHei",Arial,sans-serif;color:#1a1a2e;}
#bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #e6e8f0;box-shadow:0 1px 4px #0001;flex-wrap:wrap;}
#bar button{padding:5px 14px;font-size:13px;border:1px solid #3f51b5;background:#3f51b5;color:#fff;border-radius:5px;cursor:pointer;}
#bar .tip{color:#666;font-size:12px;margin-left:auto;}
#wrap{width:100%;overflow:auto;} svg{display:block;}
.link{fill:none;stroke-linecap:round;}
.node text{dominant-baseline:central;text-anchor:middle;pointer-events:none;}
.leaf rect{stroke:#e3e6f0;stroke-width:1;} .node{cursor:pointer;} .node:hover rect{filter:brightness(0.96);}
</style>
</head>
<body>
<div id="bar">
  <b>人工智能知识体系 · 顶层三级思维导图</b>
  <button onclick="expandAll()">展开全部</button><button onclick="expandToThird()">展开到三级</button><button onclick="collapseAll()">折叠到主干</button><button onclick="resetZoom()">重置视图</button>
  <span class="tip">默认展开到三级 ｜ 点击主干/子主题折叠展开 ｜ 滚轮缩放 ｜ 拖拽平移</span>
</div>
<div id="wrap"><svg id="chart"></svg></div>
<script>
const PALETTE=['#3f51b5','#009688','#ff9800','#e91e63','#4caf50','#00bcd4','#9c27b0','#ff5722'];
const raw={name:'人工智能',children:[
  {name:'AI基础与问题定义',ci:0,children:[{name:'任务建模',children:[{name:'输入输出'},{name:'目标函数'},{name:'约束条件'}]},{name:'推理基础',children:[{name:'搜索'},{name:'知识表示'},{name:'概率推断'}]},{name:'数学基础',children:[{name:'线性代数'},{name:'概率统计'},{name:'优化'}]}]},
  {name:'机器学习算法',ci:1,children:[{name:'学习范式',children:[{name:'监督学习'},{name:'无监督学习'},{name:'强化学习'}]},{name:'经典模型',children:[{name:'线性模型'},{name:'决策树'},{name:'集成学习'}]},{name:'泛化评估',children:[{name:'特征工程'},{name:'交叉验证'},{name:'正则化'}]}]},
  {name:'深度学习',ci:2,children:[{name:'训练机制',children:[{name:'神经网络'},{name:'反向传播'},{name:'梯度下降'}]},{name:'核心架构',children:[{name:'CNN'},{name:'RNN'},{name:'Transformer'}]},{name:'生成模型',children:[{name:'自注意力'},{name:'扩散模型'},{name:'表示学习'}]}]},
  {name:'大模型与生成式AI',ci:3,children:[{name:'基础概念',children:[{name:'基础模型'},{name:'LLM'},{name:'Token'}]},{name:'训练对齐',children:[{name:'预训练'},{name:'指令微调'},{name:'对齐训练'}]},{name:'应用增强',children:[{name:'Embedding'},{name:'RAG'},{name:'Agent'}]}]},
  {name:'AI软件工程与MLOps',ci:4,children:[{name:'工程流水线',children:[{name:'数据管道'},{name:'训练流水线'},{name:'模型注册'}]},{name:'在线服务',children:[{name:'推理服务'},{name:'特征库'},{name:'A/B测试'}]},{name:'LLMOps',children:[{name:'Prompt管理'},{name:'上下文管理'},{name:'工具调用'}]}]},
  {name:'数据评估与安全',ci:5,children:[{name:'数据质量',children:[{name:'数据治理'},{name:'标注质量'},{name:'数据分布'}]},{name:'评估体系',children:[{name:'基准测试'},{name:'在线评估'},{name:'红队测试'}]},{name:'可信安全',children:[{name:'幻觉'},{name:'隐私保护'},{name:'AI安全'}]}]},
  {name:'AI应用软件',ci:6,children:[{name:'通用软件',children:[{name:'智能搜索'},{name:'文档助手'},{name:'数据分析助手'}]},{name:'开发软件',children:[{name:'代码助手'},{name:'自动测试'},{name:'运维助手'}]},{name:'行业软件',children:[{name:'客服机器人'},{name:'推荐系统'},{name:'行业AI应用'}]}]},
  {name:'硬件边缘与具身',ci:7,children:[{name:'算力平台',children:[{name:'GPU'},{name:'TPU/NPU'},{name:'推理加速'}]},{name:'边缘部署',children:[{name:'量化'},{name:'边缘AI'},{name:'低延迟'}]},{name:'具身边界',children:[{name:'机器人'},{name:'仿真环境'},{name:'传感器融合'}]}]}
]};
function foldAfterDepth(n,maxDepth,depth=0){if(depth>=maxDepth&&n.children){n._children=n.children;n.children=null;n._folded=true;return;}if(n.children)n.children.forEach(c=>foldAfterDepth(c,maxDepth,depth+1));}
foldAfterDepth(raw,3);
const VGAP=28,HSTEP=172,PAD=78,svg=d3.select('#chart'),gZoom=svg.append('g').attr('class','zoom'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');
function colorOf(d){if(d.depth===0)return'#1a237e';if(d.depth===1)return PALETTE[d.data.ci??0];let p=d.parent;while(p&&p.depth>1)p=p.parent;return p?PALETTE[p.data.ci??0]:'#888';}
function nodeWidth(d){return d.depth===0?104:Math.max(74,d.data.name.length*12+24);}
function nodeHeight(d){return d.depth===0?42:(d.depth===1?30:25);}
function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side;});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes;}
function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(28,dx*0.45);return`M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`;}
function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null},allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx-nodeWidth(n)/2))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx+nodeWidth(n)/2))+PAD,minY=Math.min(...allNodes.map(n=>n.yy-nodeHeight(n)/2))-PAD/2,maxY=Math.max(...allNodes.map(n=>n.yy+nodeHeight(n)/2))+PAD/2,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);
const link=linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth);link.exit().remove();link.enter().append('path').attr('class','link').merge(link).attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.25:1.35).attr('opacity',d=>d.target.depth===1?0.9:0.58);
const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth);node.exit().remove();const ne=node.enter().append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false;}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true;}render();});ne.append('rect');ne.append('text');
nodeG.selectAll('g.node').attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d),arrow=d.data._folded?(d.side<0?'  ◂':'  ▸'):'';if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',10).attr('fill',c).attr('filter','drop-shadow(0 3px 8px #1a237e66)');sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700);}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c).attr('filter','drop-shadow(0 2px 4px #0002)');sel.select('text').text(d.data.name+arrow).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600);}else{sel.attr('class','node leaf');sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('filter','drop-shadow(0 1px 2px #0001)');let bar=sel.select('.bar');if(bar.empty())bar=sel.insert('rect','text').attr('class','bar');bar.attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('y',0).attr('fill',c);sel.select('text').text(d.data.name+arrow).attr('x',w/2+(d.side<0?0:2)).attr('y',h/2).attr('fill','#263238').attr('font-size',12.3).attr('font-weight',500);}});}
function expandAll(){const w=n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false;}if(n.children)n.children.forEach(w);};w(raw);render();}
function expandToThird(){expandAll();foldAfterDepth(raw,3);render();}
function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true;}});render();}
const zoom=d3.zoom().scaleExtent([0.35,2.7]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);
function resetZoom(){svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);}
render();
</script>
</body>
</html>
