<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>人工智能知识路径 · Sankey 流向图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#f7f8fa;font-family:"Microsoft YaHei",Arial,sans-serif;color:#1a1a2e;}
#c{width:100%;height:100vh;}
#note{position:fixed;left:16px;top:14px;background:#fff;border:1px solid #d7dbe8;border-radius:8px;padding:10px 12px;box-shadow:0 2px 10px #0001;font-size:13px;line-height:1.6;z-index:5}
</style>
</head>
<body>
<div id="note"><b>人工智能知识路径 · Sankey 流向图</b><br>展示知识从基础能力流向大模型、工程化、安全和应用软件的主干流向。</div>
<div id="c"></div>
<script>
const chart=echarts.init(document.getElementById('c'));
const nodes=['数学与任务基础','机器学习算法','深度学习','Transformer','基础模型/LLM','Embedding/RAG','Agent/工具调用','AI工程/MLOps','评估与安全','应用软件','硬件边缘/具身'];
const data=nodes.map(name=>({name}));
const links=[
  ['数学与任务基础','机器学习算法',8],['机器学习算法','深度学习',7],['深度学习','Transformer',8],['Transformer','基础模型/LLM',9],
  ['基础模型/LLM','Embedding/RAG',7],['Embedding/RAG','Agent/工具调用',6],['基础模型/LLM','AI工程/MLOps',6],
  ['AI工程/MLOps','应用软件',7],['Embedding/RAG','应用软件',6],['Agent/工具调用','应用软件',6],
  ['数学与任务基础','评估与安全',4],['基础模型/LLM','评估与安全',6],['评估与安全','应用软件',5],
  ['硬件边缘/具身','AI工程/MLOps',3],['硬件边缘/具身','应用软件',2],['深度学习','硬件边缘/具身',2]
].map(([source,target,value])=>({source,target,value}));
chart.setOption({
  title:{text:'AI 知识主干流向',left:'center',top:20},
  tooltip:{trigger:'item',triggerOn:'mousemove'},
  series:[{type:'sankey',top:80,left:80,right:80,bottom:40,data,links,nodeWidth:22,nodeGap:18,layoutIterations:64,
    label:{fontSize:13,color:'#1a1a2e'},lineStyle:{color:'gradient',curveness:.5,opacity:.45},
    itemStyle:{borderWidth:1,borderColor:'#fff'}}]
});
window.addEventListener('resize',()=>chart.resize());
</script>
</body>
</html>
