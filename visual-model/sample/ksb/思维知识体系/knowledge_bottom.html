function render(){const r=document.getElementById('rel').value,b=document.getElementById('branch').value,s=document.getElementById('l2').value,k=document.getElementById('l3').value;const ns=nodes.filter(n=>(b==='all'||n.l1Id===b)&&(s==='all'||n.l2Id===s)&&(k==='all'||n.l3Id===k)), set=new Set(ns.map(n=>n.id));const es=edges.filter(e=>set.has(e.source)&&set.has(e.target)&&(r==='all'||e.type===r)).map(e=>({...e,lineStyle:{color:relColors[e.type],width:e.weight*4+1,type:e.type==='contrast'?'dashed':(e.type==='analogy'?'dotted':'solid')},symbol:['none',['depends','causes','evolved'].includes(e.type)?'arrow':'none'],label:e.type==='evolved'?{show:true,formatter:'演进',color:relColors[e.type],fontSize:10}:undefined}));chart.setOption({backgroundColor:'#0f1420',color:palette,title:{text:`最底层 · L4知识网络图谱（当前 ${ns.length} 节点 / ${es.length} 边）`,left:'center',textStyle:{color:'#e8eaf6'}},tooltip:{formatter:p=>p.dataType==='node'?`${p.data.name}<br>${p.data.value}`:`${p.data.source} → ${p.data.target}<br>${p.data.type} ${p.data.weight}`},legend:{data:cats.map(c=>c.name),top:34,textStyle:{color:'#e8eaf6'}},series:[{type:'graph',layout:'force',roam:true,data:ns.map(n=>({...n,symbolSize:n.symbolSize})),links:es,categories:cats,label:{show:true,color:'#e8eaf6',fontSize:10,formatter:p=>p.data.name.length>10?p.data.name.slice(0,10)+'…':p.data.name},edgeSymbol:['none','arrow'],force:{repulsion:150,edgeLength:95},emphasis:{focus:'adjacency'},lineStyle:{curveness:.12,opacity:.55}}]});}chart.on('click',p=>{if(p.dataType==='node'){document.getElementById('panel').style.display='block';document.getElementById('panel').innerHTML=`<h3>${p.data.name}</h3><b>L3：</b>${p.data.parentL3}<br><b>编号：</b>${p.data.id}<br>${p.data.value}`;}});window.addEventListener('resize',()=>chart.resize());syncFilters();
</script></body></html>
