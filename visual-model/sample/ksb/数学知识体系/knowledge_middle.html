<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>大学理工科数学中间层矩阵</title>
<style>body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1a1a2e}h2{text-align:center}.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.ctrl select{padding:5px 9px;border:1px solid #c8d0e4;border-radius:4px;background:#fff}.note{max-width:1100px;margin:0 auto 14px;color:#555;font-size:13px;line-height:1.6}table{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 2px 8px #0001}th,td{border:1px solid #d7dbe8;padding:10px 14px;vertical-align:top;min-width:165px;max-width:270px}th{background:#3f51b5;color:#fff}.row-h{background:#5c6bc0;color:#fff;font-weight:bold}.cell{font-size:13px;line-height:1.58}.d0{background:#fff}.d1{background:#f6f8ff}.d2{background:#eef2ff}.d3{background:#e3e9ff}.level-beginner{background:#dff6e5}.level-intermediate{background:#fff1b8}.level-advanced{background:#f2c94c}.level-block{border-radius:6px;margin:5px 0;padding:7px 9px;border:1px solid #00000012}.group{margin:0 0 3px;font-weight:700;color:#1f2a3d}.legend{text-align:center;margin-top:14px;color:#555;font-size:13px}.legend span{display:inline-block;width:14px;height:14px;margin:0 4px;vertical-align:middle;border:1px solid #00000018}</style></head><body>
<h2>大学理工科数学 · 动态多维知识矩阵</h2><div class="note">可任选两个维度生成矩阵：知识模块、学习/应用场景、难度层级。默认按模块 × 场景展示。</div>
<div class="ctrl"><label>行维度：<select id="rowDim" onchange="syncDims()"></select></label><label>列维度：<select id="colDim" onchange="syncDims()"></select></label><label id="filterBox">筛选：<select id="filterVal" onchange="render()"></select></label></div><table id="mt"></table><div class="legend">难度层级：<span class="level-beginner"></span>入门 <span class="level-intermediate"></span>进阶 <span class="level-advanced"></span>高级 ｜ 知识密度：<span class="d1"></span>低 <span class="d2"></span>中 <span class="d3"></span>高 ｜ “—”表示非主线或待补充</div>
<script>
const dims={module:['基础语言','微积分','线性代数','概率统计','离散数学','微分方程','数值优化','工程建模'],scenario:['课程学习','工程建模','计算实现','数据AI','物理控制'],level:['入门','进阶','高级']};
const dimLabel={module:'知识模块',scenario:'学习/应用场景',level:'难度层级'};
const entries=[
{name:'集合/映射/函数',module:'基础语言',scenario:'课程学习',level:'入门'},{name:'逻辑与证明',module:'基础语言',scenario:'课程学习',level:'进阶'},{name:'量纲和符号表达',module:'基础语言',scenario:'工程建模',level:'入门'},
{name:'极限/连续/导数',module:'微积分',scenario:'课程学习',level:'入门'},{name:'积分和级数',module:'微积分',scenario:'物理控制',level:'进阶'},{name:'多元微积分和梯度',module:'微积分',scenario:'数据AI',level:'进阶'},
{name:'矩阵与线性方程组',module:'线性代数',scenario:'计算实现',level:'入门'},{name:'向量空间与秩',module:'线性代数',scenario:'课程学习',level:'进阶'},{name:'特征值/SVD',module:'线性代数',scenario:'数据AI',level:'高级'},
{name:'随机变量与分布',module:'概率统计',scenario:'课程学习',level:'入门'},{name:'估计与假设检验',module:'概率统计',scenario:'数据AI',level:'进阶'},{name:'大数定律/CLT',module:'概率统计',scenario:'工程建模',level:'进阶'},
{name:'组合计数',module:'离散数学',scenario:'课程学习',level:'入门'},{name:'图论与最短路',module:'离散数学',scenario:'计算实现',level:'进阶'},{name:'复杂度分析',module:'离散数学',scenario:'数据AI',level:'进阶'},
{name:'一阶/线性ODE',module:'微分方程',scenario:'物理控制',level:'进阶'},{name:'稳定性与相图',module:'微分方程',scenario:'工程建模',level:'高级'},{name:'数值ODE',module:'微分方程',scenario:'计算实现',level:'高级'},
{name:'误差与浮点数',module:'数值优化',scenario:'计算实现',level:'入门'},{name:'数值积分/插值',module:'数值优化',scenario:'工程建模',level:'进阶'},{name:'梯度下降/凸优化',module:'数值优化',scenario:'数据AI',level:'高级'},
{name:'建模流程',module:'工程建模',scenario:'工程建模',level:'入门'},{name:'傅里叶分析',module:'工程建模',scenario:'物理控制',level:'高级'},{name:'PDE/控制/信息论',module:'工程建模',scenario:'物理控制',level:'高级'}
];
const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');
function fillSelect(sel,selected){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${dimLabel[k]}</option>`).join('')}
function otherDim(){const r=rowSel.value,c=colSel.value;return keys.find(k=>k!==r&&k!==c)}
function syncDims(){if(rowSel.value===colSel.value)colSel.value=keys.find(k=>k!==rowSel.value)||rowSel.value;const f=otherDim();document.getElementById('filterBox').style.display=f?'inline-block':'none';filterSel.innerHTML=f?'<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join(''):'';render()}
function cls(n){return n===0?'d0':(n<=1?'d1':(n<=3?'d2':'d3'))}function levelCls(v){return v==='入门'?'level-beginner':(v==='进阶'?'level-intermediate':(v==='高级'?'level-advanced':''))}function itemsFor(rDim,rVal,cDim,cVal,fDim,fVal){return entries.filter(e=>e[rDim]===rVal&&e[cDim]===cVal&&(!fDim||fVal==='__all__'||e[fDim]===fVal))}
function render(){const rDim=rowSel.value,cDim=colSel.value,fDim=otherDim(),fVal=filterSel.value||'__all__',rows=dims[rDim],cols=dims[cDim];let html=`<tr><th>${dimLabel[rDim]} \\ ${dimLabel[cDim]}</th>`+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';for(const r of rows){html+=`<tr><td class="row-h">${r}</td>`;for(const c of cols){const items=itemsFor(rDim,r,cDim,c,fDim,fVal);let body='—';let cellLevelClass=rDim==='level'?levelCls(r):(cDim==='level'?levelCls(c):'');if(items.length&&fDim&&fVal==='__all__'){body=dims[fDim].map(v=>{const group=items.filter(x=>x[fDim]===v);const blockClass=fDim==='level'?` level-block ${levelCls(v)}`:'';return group.length?`<div class="${blockClass.trim()}"><div class="group">${v}</div>`+group.map(x=>'• '+x.name).join('<br>')+'</div>':''}).filter(Boolean).join('')}else if(items.length){body=items.map(x=>'• '+x.name).join('<br>');if(fDim==='level'&&fVal!=='__all__')cellLevelClass=levelCls(fVal)}html+=`<td class="cell ${cellLevelClass||cls(items.length)}">${body}</td>`}html+='</tr>'}document.getElementById('mt').innerHTML=html}
fillSelect(rowSel,'module');fillSelect(colSel,'scenario');syncDims();
</script></body></html>
