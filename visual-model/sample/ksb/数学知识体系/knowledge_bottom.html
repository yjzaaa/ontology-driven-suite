<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大学理工科数学知识图谱 - 力导向图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root{--bg:#f7f8fb;--panel:#fff;--text:#18212f;--muted:#637083;--line:#d9dee8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:"Microsoft YaHei",Arial,sans-serif;color:var(--text)}
    header{height:72px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
    h1{font-size:20px;margin:0;font-weight:700} .sub{font-size:13px;color:var(--muted);margin-top:4px}
    .wrap{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 72px)}
    aside{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}
    .metric{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .metric div{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfe}
    .metric b{display:block;font-size:20px}.metric span{font-size:12px;color:var(--muted)}
    .legend{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:8px;font-size:13px;color:#273346}
    .dot{width:12px;height:12px;border-radius:50%;display:inline-block}.tip{margin-top:18px;font-size:12px;line-height:1.7;color:var(--muted)}
    #chart{width:100%;height:100%}
  </style>
</head>
<body>
  <header>
    <div><h1>大学理工科数学知识图谱</h1><div class="sub">64 个核心知识点，71 条依赖关系；节点越大表示综合权重越高</div></div>
  </header>
  <div class="wrap">
    <aside>
      <div class="metric"><div><b id="nodeCount">64</b><span>核心知识点</span></div><div><b id="edgeCount">71</b><span>依赖关系</span></div></div>
      <div class="legend" id="legend"></div>
      <div class="tip">拖拽节点可观察局部结构；滚轮缩放；点击节点查看相邻依赖。适合识别数学学习中的枢纽概念和跨分支桥接概念。</div>
    </aside>
    <main id="chart"></main>
  </div>

const categories=[...new Set(nodesCSV.split("\n").map(r=>r.split(",")[2]))].map((name,i)=>({name,itemStyle:{color:colors[i]}}));
const catIndex=Object.fromEntries(categories.map((c,i)=>[c.name,i]));
const nodes=nodesCSV.split("\n").map(r=>{const [id,name,cat,size]=r.split(",");return {id,name,category:catIndex[cat],symbolSize:+size,value:cat,draggable:true,label:{show:+size>49}}});
const nameById=Object.fromEntries(nodes.map(n=>[n.id,n.name]));
const edges=edgesCSV.split("\n").map(r=>{const [source,target,w]=r.split(",");return {source,target,value:+w,lineStyle:{width:1+3*(+w),curveness:.08,opacity:.45},tooltip:{formatter:`${nameById[source]} -> ${nameById[target]}<br/>依赖强度：${w}`}}});
document.getElementById("nodeCount").textContent=nodes.length;document.getElementById("edgeCount").textContent=edges.length;
document.getElementById("legend").innerHTML=categories.map((c,i)=>`<div class="item"><span class="dot" style="background:${colors[i]}"></span>${c.name}</div>`).join("");
const chart=echarts.init(document.getElementById("chart"));
chart.setOption({
  tooltip:{trigger:"item"},
  legend:{show:false},
  series:[{type:"graph",layout:"force",roam:true,categories,nodes,links:edges,
    edgeSymbol:["none","arrow"],edgeSymbolSize:8,
    force:{repulsion:360,edgeLength:[90,220],gravity:.08,friction:.45},
    label:{position:"right",fontSize:12,color:"#26364a"},
    emphasis:{focus:"adjacency",lineStyle:{opacity:1,width:4}},
    itemStyle:{borderColor:"#fff",borderWidth:2,shadowBlur:8,shadowColor:"rgba(21,31,51,.16)"}

window.addEventListener("resize",()=>chart.resize());
