const nodes=[];layerOrder.forEach((cat,ci)=>{rows[cat].forEach((n,ri)=>nodes.push({

}))});
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const links=edgesCSV.split("\n").map(r=>{const [source,target,w]=r.split(",");return {source,target,value:+w,lineStyle:{width:1+(+w)*3,curveness:byId[source].x===byId[target].x ? .18 : .12,opacity:.55},tooltip:{formatter:`${byId[source].name} -> ${byId[target].name}<br/>依赖强度：${w}`}}});
const chart=echarts.init(document.getElementById("chart"));
chart.setOption({
  color:colors,
  grid:{left:20,right:20,top:20,bottom:20},
  tooltip:{trigger:"item"},
  legend:{top:12,left:24,data:layerOrder,textStyle:{fontSize:12,color:"#4b586b"}},
