<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>大学理工科数学知识体系顶层思维导图</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>html,body{margin:0;height:100%;background:#f7f8fa;font-family:"Microsoft YaHei",Arial,sans-serif;color:#1a1a2e}#bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #e6e8f0;box-shadow:0 1px 4px #0001;flex-wrap:wrap}#bar button{padding:5px 14px;font-size:13px;border:1px solid #3f51b5;background:#3f51b5;color:#fff;border-radius:5px;cursor:pointer}#bar .tip{color:#666;font-size:12px;margin-left:auto}#wrap{width:100%;overflow:auto}svg{display:block}.link{fill:none;stroke-linecap:round}.node text{dominant-baseline:central;text-anchor:middle;pointer-events:none}.leaf rect{stroke:#e3e6f0;stroke-width:1}.node{cursor:pointer}.node:hover rect{filter:brightness(.96)}</style></head>
<body><div id="bar"><b>大学理工科数学 · 顶层三级思维导图</b><button onclick="expandAll()">展开全部</button><button onclick="expandToThird()">展开到三级</button><button onclick="collapseAll()">折叠到主干</button><button onclick="resetZoom()">重置视图</button><span class="tip">默认展开到三级 ｜ 点击主干/子主题折叠展开 ｜ 滚轮缩放 ｜ 拖拽平移</span></div><div id="wrap"><svg id="chart"></svg></div>
<script>
const PALETTE=['#3f51b5','#009688','#ff9800','#e91e63','#4caf50','#00bcd4','#9c27b0','#ff5722'];
const raw={name:'大学理工科数学',children:[
{name:'基础与证明语言',ci:0,children:[{name:'数学对象',children:[{name:'集合'},{name:'映射'},{name:'函数'}]},{name:'逻辑证明',children:[{name:'命题逻辑'},{name:'量词'},{name:'证明方法'}]},{name:'表达规范',children:[{name:'符号'},{name:'定义定理'},{name:'归纳法'}]}]},
{name:'微积分与分析',ci:1,children:[{name:'一元微积分',children:[{name:'极限'},{name:'连续'},{name:'导数'}]},{name:'积分与级数',children:[{name:'积分'},{name:'泰勒公式'},{name:'级数'}]},{name:'多元分析',children:[{name:'偏导数'},{name:'梯度'},{name:'重积分'}]}]},
{name:'线性代数',ci:2,children:[{name:'矩阵基础',children:[{name:'向量'},{name:'矩阵'},{name:'线性方程组'}]},{name:'空间结构',children:[{name:'向量空间'},{name:'秩'},{name:'正交性'}]},{name:'谱与分解',children:[{name:'特征值'},{name:'特征向量'},{name:'SVD'}]}]},
{name:'概率统计',ci:3,children:[{name:'概率模型',children:[{name:'样本空间'},{name:'条件概率'},{name:'随机变量'}]},{name:'分布规律',children:[{name:'常见分布'},{name:'期望方差'},{name:'中心极限定理'}]},{name:'统计推断',children:[{name:'估计'},{name:'假设检验'},{name:'置信区间'}]}]},
{name:'离散数学',ci:4,children:[{name:'离散结构',children:[{name:'集合关系'},{name:'组合计数'},{name:'递推'}]},{name:'图与网络',children:[{name:'图'},{name:'树'},{name:'最短路'}]},{name:'计算基础',children:[{name:'布尔代数'},{name:'复杂度'},{name:'算法证明'}]}]},
{name:'微分方程',ci:5,children:[{name:'ODE基础',children:[{name:'一阶ODE'},{name:'线性ODE'},{name:'方程组'}]},{name:'分析工具',children:[{name:'拉普拉斯变换'},{name:'稳定性'},{name:'相图'}]},{name:'工程模型',children:[{name:'振动'},{name:'电路'},{name:'数值ODE'}]}]},
{name:'数值计算与优化',ci:6,children:[{name:'数值基础',children:[{name:'误差'},{name:'浮点数'},{name:'收敛'}]},{name:'数值方法',children:[{name:'插值'},{name:'数值积分'},{name:'线性系统数值解'}]},{name:'优化',children:[{name:'牛顿法'},{name:'梯度下降'},{name:'凸优化'}]}]},
{name:'工程建模与边界',ci:7,children:[{name:'建模方法',children:[{name:'建模流程'},{name:'量纲分析'},{name:'近似'}]},{name:'工程数学',children:[{name:'傅里叶分析'},{name:'复变函数'},{name:'PDE'}]},{name:'进阶边界',children:[{name:'控制基础'},{name:'信息论'},{name:'测度论边界'}]}]}
]};
function foldAfterDepth(n,maxDepth,depth=0){if(depth>=maxDepth&&n.children){n._children=n.children;n.children=null;n._folded=true;return}if(n.children)n.children.forEach(c=>foldAfterDepth(c,maxDepth,depth+1))}
foldAfterDepth(raw,3);const VGAP=28,HSTEP=170,PAD=78,svg=d3.select('#chart'),gZoom=svg.append('g').attr('class','zoom'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');
function colorOf(d){if(d.depth===0)return'#1a237e';if(d.depth===1)return PALETTE[d.data.ci??0];let p=d.parent;while(p&&p.depth>1)p=p.parent;return p?PALETTE[p.data.ci??0]:'#888'}function nodeWidth(d){return d.depth===0?150:Math.max(74,d.data.name.length*12+24)}function nodeHeight(d){return d.depth===0?42:(d.depth===1?30:25)}
function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes}
function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(28,dx*.45);return`M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`}
function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null},allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx-nodeWidth(n)/2))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx+nodeWidth(n)/2))+PAD,minY=Math.min(...allNodes.map(n=>n.yy-nodeHeight(n)/2))-PAD/2,maxY=Math.max(...allNodes.map(n=>n.yy+nodeHeight(n)/2))+PAD/2,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);
const link=linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth);link.exit().remove();link.enter().append('path').attr('class','link').merge(link).attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.25:1.35).attr('opacity',d=>d.target.depth===1 ? .9 : .58);
const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth);node.exit().remove();const ne=node.enter().append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true}render()});ne.append('rect');ne.append('text');
nodeG.selectAll('g.node').attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d),arrow=d.data._folded?(d.side<0?'  ◂':'  ▸'):'';if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',10).attr('fill',c).attr('filter','drop-shadow(0 3px 8px #1a237e66)');sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700)}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c).attr('filter','drop-shadow(0 2px 4px #0002)');sel.select('text').text(d.data.name+arrow).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600)}else{sel.attr('class','node leaf');sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('filter','drop-shadow(0 1px 2px #0001)');let bar=sel.select('.bar');if(bar.empty())bar=sel.insert('rect','text').attr('class','bar');bar.attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('y',0).attr('fill',c);sel.select('text').text(d.data.name+arrow).attr('x',w/2+(d.side<0?0:2)).attr('y',h/2).attr('fill','#263238').attr('font-size',12.3).attr('font-weight',500)}})}
function expandAll(){const w=n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false}if(n.children)n.children.forEach(w)};w(raw);render()}function expandToThird(){expandAll();foldAfterDepth(raw,3);render()}function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true}});render()}const zoom=d3.zoom().scaleExtent([.35,2.7]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);function resetZoom(){svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity)}render();
</script></body></html>
