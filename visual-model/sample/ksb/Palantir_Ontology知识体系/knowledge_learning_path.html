ping", "category": 2, "layer": 2, "value": "把数据集字段映射为 Object type 的属性与主键。"}, {"id": "Entity Resolution", "category": 2, "layer": 2, "value": "把多个系统中指向同一现实实体的记录合并或对齐。"}, {"id": "Master Data Alignment", "category": 2, "layer": 2, "value": "统一组织内关键实体的命名、编码和口径。"}, {"id": "Incremental Sync", "category": 2, "layer": 2, "value": "以增量方式保持数据源与 Ontology 对象状态同步。"}, {"id": "Data Lineage", "category": 2, "layer": 2, "value": "追踪对象属性从何而来、如何加工、被谁使用。"}, {"id": "Data Quality Rule", "category": 2, "layer": 2, "value": "约束对象属性完整性、合法性和一致性的校验规则。"}, {"id": "Action Type", "category": 3, "layer": 3, "value": "定义用户或系统可以对对象执行的创建、更新、删除或关系变更操作。"}, {"id": "Action Form", "category": 3, "layer": 3, "value": "将动作参数呈现给业务用户填写和提交的界面。"}, {"id": "Writeback", "category": 3, "layer": 3, "value": "把动作结果写回 Ontology 或外部业务系统。"}, {"id": "Validation Rule", "category": 3, "layer": 3, "value": "动作执行前对参数、权限和业务状态进行校验。"}, {"id": "Function", "category": 3, "layer": 3, "value": "可复用计算逻辑，可读取对象、聚合数据、执行业务计算或调用 AI。"}, {"id": "Aggregation", "category": 3, "layer": 3, "value": "在对象集合上计算统计指标、风险分数或业务汇总。"}, {"id": "Workflow State", "category": 3, "layer": 3, "value": "对象在业务流程中的状态，如待审批、执行中、已关闭。"}, {"id": "Human-in-the-loop", "category": 3, "layer": 3, "value": "把人的审批、判断和责任嵌入自动化流程。"}, {"id": "Object Permission", "category": 4, "layer": 4, "value": "控制谁能看到或操作某类对象及其实例。"}, {"id": "Property Permission", "category": 4, "layer": 4, "value": "控制敏感属性的可见性和可编辑性。"}, {"id": "Dynamic Policy", "category": 4, "layer": 4, "value": "根据用户、对象状态、组织关系或环境动态决定访问权限。"}, {"id": "Audit Log", "category": 4, "layer": 4, "value": "记录用户、系统和 AI 对对象及动作的访问和修改行为。"}, {"id": "Lineage Governance", "category": 4, "layer": 4, "value": "把数据血缘、动作记录和模型调用串联为可追溯治理链。"}, {"id": "Ontology Versioning", "category": 4, "layer": 4, "value": "管理 Ontology 结构和语义规则的变更版本。"}, {"id": "Simulation", "category": 4, "layer": 4, "value": "在不污染生产对象的环境中测试动作、逻辑或 AI 计划。"}, {"id": "AIP Evals", "category": 4, "layer": 4, "value": "评估 AIP 应用、工具调用和 Ontology 编辑行为的可靠性。"}, {"id": "AIP Grounding", "category": 5, "layer": 5, "value": "把 LLM 的上下文锚定在可授权的 Ontology 对象、关系和动作上。"}, {"id": "LLM Tool", "category": 5, "layer": 5, "value": "供模型调用的函数、动作或查询能力。"}, {"id": "AIP Logic Block", "category": 5, "layer": 5, "value": "在 AIP Logic 中组合提示、函数、对象查询和工具调用的构件。"}, {"id": "Prompt Template", "category": 5, "layer": 5, "value": "把业务语义、对象上下文和任务目标稳定注入模型调用。"}, {"id": "Agent Plan", "category": 5, "layer": 5, "value": "AI 根据目标拆解出的查询、判断、动作和反馈步骤。"}, {"id": "Tool Authorization", "category": 5, "layer": 5, "value": "约束模型能调用哪些工具、针对哪些对象执行哪些动作。"}, {"id": "AIP Analyst", "category": 5, "layer": 5, "value": "面向分析工作的 AI 能力，可围绕 Ontology 对象搜索、过滤、分析和可视化。"}, {"id": "AI Action Review", "category": 5, "layer": 5, "value": "对 AI 建议或动作执行进行人工确认、审计和回滚准备。"}, {"id": "Workshop", "category": 6, "layer": 6, "value": "面向业务应用搭建的产品能力，可基于 Ontology 构建交互界面。"}, {"id": "Object View", "category": 6, "layer": 6, "value": "围绕单个或一组对象展示属性、关系、历史和可执行动作。"}, {"id": "Dashboard", "category": 6, "layer": 6, "value": "基于对象集合和指标构建运营态势视图。"}, {"id": "OSDK", "category": 6, "layer": 6, "value": "Ontology SDK，使开发者用代码访问对象、链接和动作。"}, {"id": "TypeScript SDK", "category": 6, "layer": 6, "value": "在前端或 Node 环境中以类型化 API 使用 Ontology。"}, {"id": "Python SDK", "category": 6, "layer": 6, "value": "在分析、自动化或数据科学环境中访问 Ontology。"}, {"id": "Java SDK", "category": 6, "layer": 6, "value": "在企业级后端服务中接入 Ontology。"}, {"id": "Application Permission", "category": 6, "layer": 6, "value": "应用层对用户、对象和动作的授权边界。"}, {"id": "Supply Chain Ontology", "category": 7, "layer": 7, "value": "以订单、供应商、库存、运输、风险为核心对象的供应链本体。"}, {"id": "Manufacturing Ontology", "category": 7, "layer": 7, "value": "以设备、工艺、批次、质量、产能为核心对象的制造本体。"}, {"id": "Defense Intelligence Ontology", "category": 7, "layer": 7, "value": "以人员、组织、地点、事件、线索、行动为核心对象的情报本体。"}, {"id": "Healthcare Operations Ontology", "category": 7, "layer": 7, "value": "以患者流、床位、人员、物资和质量指标为核心对象的运营本体。"}, {"id": "Financial Risk Ontology", "category": 7, "layer": 7, "value": "以账户、交易、实体、敞口、告警和调查为核心对象的风险本体。"}, {"id": "Ontology Blueprint", "categor function edgeAllowed(e,rel){return rel==='all'||(rel==='learning'&&['depends','contains','evolved','contrast'].includes(e.type))||e.type===rel}function visibleSet(route){if(route==='all')return new Set(nodes.map(n=>n.id));const base=new Set(routeSets[route]||[]);let changed=true;while(changed){changed=false;edges.forEach(e=>{if(base.has(e.to)&&!base.has(e.from)){base.add(e.from);changed=true}})}return base}function render(){clearFocus(false);const route=document.getElementById('route').value,rel=document.getElementById('relation').value,visible=visibleSet(route);currentNodes=nodes.filter(n=>visible.has(n.id));currentEdges=edges.filter(e=>visible.has(e.from)&&visible.has(e.to)&&edgeAllowed(e,rel));const g=new dagreD3.graphlib.Graph({compound:true}).setGraph({rankdir:'LR',nodesep:34,ranksep:82,marginx:30,marginy:26}).setDefaultEdgeLabel(()=>({}));layerNames.forEach((name,i)=>g.setNode('cluster_'+i,{label:name,clusterLabelPos:'top',style:'fill:#fff;stroke:#d9deec'}));currentNodes.forEach(n=>{g.setNode(n.id,{label:n.id,rx:7,ry:7,paddingLeft:12,paddingRight:12,paddingTop:8,paddingBottom:8,style:`fill:${palette[n.category]};stroke:#39445e`,labelStyle:'fill:#fff;font-weight:650'});g.setParent(n.id,'cluster_'+n.layer)});currentEdges.forEach(e=>{const c=relationColor[e.type]||'#667085',dash=e.type==='contrast'?'stroke-dasharray:6 4;':'';g.setEdge(e.from,e.to,{label:e.type,curve:d3.curveBasis,arrowhead:'vee',style:`stroke:${c};stroke-width:${e.type==='contains'?3.1:2}px;${dash}fill:none`,arrowheadStyle:`fill:${c};stroke:${c}`,labelStyle:`fill:${c};font-weight:650`})});inner.selectAll('*').remove();new dagreD3.render()(inner,g);inner.selectAll('g.node').on('click',id=>focusNode(id)).on('mouseover',id=>showPanel(id));inner.selectAll('g.edgePath,g.edgeLabel').each(function(v){d3.select(this).attr('data-from',v.v).attr('data-to',v.w)});resetView()}
function related(id,dir){const seen=new Set(),stack=[id];while(stack.length){const cur=stack.pop();currentEdges.forEach(e=>{const next=dir==='pre'&&e.to===cur?e.from:(dir==='next'&&e.from===cur?e.to:null);if(next&&!seen.has(next)){seen.add(next);stack.push(next)}})}return seen}function focusNode(id){const pre=related(id,'pre'),next=related(id,'next');inner.selectAll('g.node').classed('dim',true).classed('active',false).classed('pre',false).classed('next',false);inner.selectAll('g.node').filter(d=>d===id).classed('dim',false).classed('active',true);inner.selectAll('g.node').filter(d=>pre.has(d)).classed('dim',false).classed('pre',true);inner.selectAll('g.node').filter(d=>next.has(d)).classed('dim',false).classed('next',true);inner.selectAll('g.edgePath,g.edgeLabel').classed('dim',true).classed('active',false).filter(function(){const f=this.getAttribute('data-from'),t=this.getAttribute('data-to');return f===id||t===id||pre.has(f)||next.has(t)}).classed('dim',false).classed('active',true);showPanel(id)}function showPanel(id){const n=nodeMap.get(id);if(!n)return;const pre=currentEdges.filter(e=>e.to===id).map(e=>e.from),next=currentEdges.filter(e=>e.from===id).map(e=>e.to);document.getElementById('pt').textContent=id;document.getElementById('pd').innerHTML=`${n.value}<br><br><b>所属主干：</b>${categories[n.category]}<br><b>学习层级：</b>${layerNames[n.layer]}<br><b>直接前导：</b>${pre.join('、')||'无'}<br><b>可组装/通向：</b>${next.join('、')||'无'}`;document.getElementById('panel').style.display='block'}function clearFocus(hide=true){inner.selectAll('g.node,g.edgePath,g.edgeLabel').classed('dim',false).classed('active',false).classed('pre',false).classed('next',false);if(hide)document.getElementById('panel').style.display='none'}function resetView(){const graphNode=inner.node();if(!graphNode)return;const bbox=graphNode.getBBox(),w=svg.node().clientWidth,h=svg.node().clientHeight;const scale=Math.min(1.05,Math.max(.28,Math.min((w-80)/bbox.width,(h-80)/bbox.height)));svg.transition().duration(30
