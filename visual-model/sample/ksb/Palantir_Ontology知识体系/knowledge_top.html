<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Palantir Ontology 顶层思维导图</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>body{margin:0;background:#f7f8fa;color:#1a1a2e;font-family:Arial,'Microsoft YaHei',sans-serif}header{padding:14px 20px;background:#fff;box-shadow:0 1px 8px #0001;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0 20px 0 0;font-size:18px}button{border:1px solid #d7dbe8;background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}svg{display:block}.link{fill:none}.node text{text-anchor:middle;dominant-baseline:middle;pointer-events:none}.node{cursor:pointer}</style></head><body><header><h2>顶层 · Palantir Ontology 知识主干</h2><button onclick="expandAll()">展开全部</button><button onclick="expandToThird()">展开到三级</button><button onclick="collapseAll()">折叠到主干</button><button onclick="resetZoom()">重置视图</button></header><svg id="svg"></svg><script>
const raw={"name": "Palantir Ontology", "children": [{"name": "思想与定位", "color": "#3f51b5", "children": [{"name": "Operational ontology", "children": [{"name": "现实业务语义层"}, {"name": "决策对象化"}, {"name": "行动闭环"}]}, {"name": "区别于数据模型", "children": [{"name": "不是表结构"}, {"name": "不是只读知识图谱"}, {"name": "面向操作"}]}, {"name": "组织建模方法", "children": [{"name": "对象优先"}, {"name": "关系显式"}, {"name": "权限内生"}]}]}, {"name": "核心语义模型", "color": "#009688", "children": [{"name": "Object type", "children": [{"name": "业务对象类型"}, {"name": "主键与属性"}, {"name": "对象集合"}]}, {"name": "Property", "children": [{"name": "状态属性"}, {"name": "派生属性"}, {"name": "时间属性"}]}, {"name": "Link type", "children": [{"name": "对象关系"}, {"name": "方向与基数"}, {"name": "跨域连接"}]}]}, {"name": "数据与集成", "color": "#ff9800", "children": [{"name": "数据源接入", "children": [{"name": "源系统映射"}, {"name": "Pipeline"}, {"name": "实体解析"}]}, {"name": "对象同步", "children": [{"name": "数据血缘"}, {"name": "增量刷新"}, {"name": "质量校验"}]}, {"name": "语义对齐", "children": [{"name": "主数据"}, {"name": "ID 映射"}, {"name": "口径统一"}]}]}, {"name": "动作与工作流", "color": "#e91e63", "children": [{"name": "Action type", "children": [{"name": "创建更新删除"}, {"name": "事务写回"}, {"name": "审批约束"}]}, {"name": "Functions", "children": [{"name": "计算逻辑"}, {"name": "读写 Ontology"}, {"name": "聚合分析"}]}, {"name": "Workflow", "children": [{"name": "任务编排"}, {"name": "状态迁移"}, {"name": "人机协同"}]}]}, {"name": "安全治理", "color": "#4caf50", "children": [{"name": "权限模型", "children": [{"name": "对象级权限"}, {"name": "属性级权限"}, {"name": "动态策略"}]}, {"name": "审计与 lineage", "children": [{"name": "操作审计"}, {"name": "数据血缘"}, {"name": "模型可追溯"}]}, {"name": "模拟与评估", "children": [{"name": "沙盒执行"}, {"name": "AIP Evals"}, {"name": "变更治理"}]}]}, {"name": "AIP 与 Agent", "color": "#00bcd4", "children": [{"name": "LLM 接入", "children": [{"name": "Ontology grounding"}, {"name": "工具调用"}, {"name": "上下文约束"}]}, {"name": "AIP Logic", "children": [{"name": "Logic blocks"}, {"name": "提示链路"}, {"name": "函数编排"}]}, {"name": "Agent 行动", "children": [{"name": "读对象"}, {"name": "调用动作"}, {"name": "生成建议"}]}]}, {"name": "应用与开发", "color": "#9c27b0", "children": [{"name": "Workshop", "children": [{"name": "业务应用"}, {"name": "表单视图"}, {"name": "操作界面"}]}, {"name": "OSDK", "children": [{"name": "TypeScript/Python/Java"}, {"name": "对象 API"}, {"name": "动作 API"}]}, {"name": "AIP 应用", "children": [{"name": "Chatbot"}, {"name": "Analyst"}, {"name": "自动化工作台"}]}]}, {"name": "行业落地", "color": "#ff5722", "children": [{"name": "供应链", "children": [{"name": "订单"}, {"name": "库存"}, {"name": "风险"}]}, {"name": "制造运营", "children": [{"name": "资产"}, {"name": "工艺"}, {"name": "质量"}]}, {"name": "国防情报", "children": [{"name": "实体关系"}, {"name": "事件线索"}, {"name": "行动态势"}]}]}]};const KSB_PALETTE={branches:["#3f51b5", "#009688", "#ff9800", "#e91e63", "#4caf50", "#00bcd4", "#9c27b0", "#ff5722"]};const svg=d3.select('#svg'),gZoom=svg.append('g'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');const PAD=180,VGAP=44,HSTEP=185;
function nodeWidth(d){return Math.max(d.depth===0?170:80,d.data.name.length*13+26)}function nodeHeight(d){return d.depth===0?42:(d.depth===1?31:27)}function colorOf(d){if(d.depth===0)return'#1a237e';let n=d;while(n.depth>1)n=n.parent;return n.data.color||KSB_PALETTE.branches[0]}function foldAfterDepth(n,depth=3,cur=0){if(!n.children)return;if(cur>=depth){n._children=n.children;n.children=null;n._folded=true;return}n.children.forEach(c=>foldAfterDepth(c,depth,cur+1))}
function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes}
function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(26,dx*.42);return`M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`}
function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null},allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx))+PAD,minY=Math.min(...allNodes.map(n=>n.yy))-70,maxY=Math.max(...allNodes.map(n=>n.yy))+70,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);
linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth).join('path').attr('class','link').attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.2:1.4).attr('opacity',d=>d.target.depth===1?.9:.55);
const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth).join(enter=>{const e=enter.append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true}render()});e.append('rect');e.append('text');return e});node.attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d);sel.selectAll('.bar').remove();if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',10).attr('fill',c);sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700)}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600)}else{sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('stroke','#e5e7ef');sel.insert('rect','text').attr('class','bar').attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#263238').attr('font-size',12.5)}})}
function walk(n,fn){fn(n);(n.children||n._children||[]).forEach(c=>walk(c,fn))}function expandAll(){walk(raw,n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false}});render()}function expandToThird(){expandAll();foldAfterDepth(raw,3);render()}function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true}});render()}const zoom=d3.zoom().scaleExtent([.35,2.5]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);function resetZoom(){svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity)}expandToThird();
</script></body></html>
