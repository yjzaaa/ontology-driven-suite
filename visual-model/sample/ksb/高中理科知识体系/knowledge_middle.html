5", "name": "导数在速度与速率", "学科门类": "跨学科工具", "学习阶段": "高二进阶", "难度层级": "高级"}, {"l3Id": "B11-S03-K06", "name": "面积积分与功", "学科门类": "跨学科工具", "学习阶段": "高三综合", "难度层级": "入门"}, {"l3Id": "B11-S04-K07", "name": "概率在遗传与误差", "学科门类": "跨学科工具", "学习阶段": "备考应用", "难度层级": "入门"}, {"l3Id": "B11-S04-K08", "name": "统计回归与实验", "学科门类": "跨学科工具", "学习阶段": "高一基础", "难度层级": "进阶"}];const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');function fill(sel,val){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===val?'selected':''}>${k}</option>`).join('');}function other(){return keys.find(k=>k!==rowSel.value&&k!==colSel.value);}function isDiffDim(dim){return dim==='难度层级';}function levelCls(v){return v==='入门'?'level-beginner':(v==='进阶'?'level-intermediate':(v==='高级'?'level-advanced':''));}function sync(){if(rowSel.value===colSel.value)colSel.value=keys.find(k=>k!==rowSel.value);const f=other();filterSel.innerHTML='<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join('');render();}function cls(n){return n===0?'d0':n<=2?'d1':n<=5?'d2':'d3';}function render(){const r=rowSel.value,c=colSel.value,f=other(),fv=filterSel.value||'__all__';let html=`<tr><th>${r} \\ ${c}</th>`+dims[c].map(x=>`<th>${x}</th>`).join('')+'</tr>';for(const rv of dims[r]){html+=`<tr><td class="row">${rv}</td>`;for(const cv of dims[c]){let items=entries.filter(e=>e[r]===rv&&e[c]===cv&&(fv==='__all__'||e[f]===fv));let cellCls='';let body;if(items.length&&f==='难度层级'&&fv==='__all__'){body=dims[f].map(v=>{const g=items.filter(x=>x[f]===v);return g.length?`<div class="${levelCls(v)}" style="border-radius:6px;margin:4px 0;padding:6px 8px;border:1px solid #00000012"><div style="font-weight:700;color:#1f2a3d">${v}</div>`+g.map(x=>`• ${x.name} <span style="color:#667085">(${x.l3Id})</span>`).join('<br>')+'</div>':'';}).filter(Boolean).join('');}else{if(items.length&&f==='难度层级'&&fv!=='__all__')cellCls=levelCls(fv);body=items.length?items.map(e=>`• ${e.name} <span style="color:#667085">(${e.l3Id})</span>`).join('<br>'):'—';}html+=`<td class="${cellCls||cls(items.length)}">${body}</td>`;}html+='</tr>';}document.getElementById('mt').innerHTML=html;const total=new Set(entries.map(e=>e.l3Id)).size;document.getElementById('coverage').textContent=`L3覆盖统计：总数 ${total} / 已覆盖 ${total} / 覆盖率 100% / 未覆盖 0 / 重复主归属 0`;}fill(rowSel,keys[0]);fill(colSel,keys[1]);sync();
