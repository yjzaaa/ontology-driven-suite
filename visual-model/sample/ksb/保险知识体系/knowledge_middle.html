<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>保险中间层矩阵</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1a1a2e}h2{text-align:center}.desc{max-width:1180px;margin:0 auto 14px;color:#4b5563;line-height:1.7}.ctrl{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select{padding:5px 8px}table{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 2px 8px #0001}th,td{border:1px solid #d7dbe8;padding:10px 12px;vertical-align:top;min-width:190px;max-width:330px}th{background:#3f51b5;color:#fff}.row-h{background:#5c6bc0;color:#fff;font-weight:bold}.cell{font-size:13px;line-height:1.52}.d0{background:#fff}.d1{background:#f6f8ff}.d2{background:#eef2ff}.d3{background:#e3e9ff}.level-beginner{background:#dff6e5}.level-intermediate{background:#fff1b8}.level-advanced{background:#f2c94c}.level-block{border-radius:7px;margin:6px 0;padding:8px 9px;border:1px solid #00000014}.group{margin:0 0 5px;font-weight:700;color:#1f2a3d}.kb{background:#fff;border:1px solid #dfe4f1;border-radius:7px;margin:6px 0;padding:8px 9px}.kb-title{font-weight:700;color:#1a237e;margin-bottom:4px}.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 7px;margin-left:4px;background:#eef2ff;color:#3949ab;border:1px solid #d7defc}.legend{text-align:center;margin-top:14px;color:#555;font-size:13px}.legend span{display:inline-block;width:14px;height:14px;margin:0 4px;vertical-align:middle;border:1px solid #00000018}</style></head><body><h2>中间层 · 保险动态多维知识矩阵</h2><div class="desc">维度含义：业务域定位内容范围；工作活动定位岗位动作；难度层级提示学习顺序。每个知识块包含焦点、产出和前导。</div><div class="ctrl"><label>行维度：<select id="rowDim" onchange="syncDims()"></select></label><label>列维度：<select id="colDim" onchange="syncDims()"></select></label><label id="filterBox">筛选：<select id="filterVal" onchange="render()"></select></label></div><table id="mt"></table><div class="legend">难度层级：<span class="level-beginner"></span>入门 <span class="level-intermediate"></span>进阶 <span class="level-advanced"></span>高级 ｜ 知识密度：<span class="d1"></span>低 <span class="d2"></span>中 <span class="d3"></span>高 ｜ “—”表示非主学习重点</div><script>
const dims={"domain": ["基础风险", "产品险种", "精算定价", "核保承保", "理赔服务", "经营治理", "数字化"], "activity": ["识别", "设计", "定价", "运营", "风控", "度量"], "difficulty": ["入门", "进阶", "高级"]};const dimLabel={domain:'业务域',activity:'工作活动',difficulty:'难度层级'};const entries=[{"title": "风险与可保性", "domain": "基础风险", "activity": "识别", "difficulty": "入门", "focus": "理解哪些风险适合保险化，区分纯粹风险与投机风险。", "output": "可保风险判断清单", "prereq": "风险管理基础"}, {"title": "保险合同要素", "domain": "基础风险", "activity": "设计", "difficulty": "入门", "focus": "掌握投保人、保险人、保险利益、保险责任和免责条款。", "output": "合同要素拆解表", "prereq": "民商法基础"}, {"title": "保险原则", "domain": "基础风险", "activity": "风控", "difficulty": "入门", "focus": "理解最大诚信、近因、损失补偿、代位求偿等原则。", "output": "原则-案例对照表", "prereq": "保险合同要素"}, {"title": "人身险产品结构", "domain": "产品险种", "activity": "设计", "difficulty": "入门", "focus": "区分寿险、重疾、医疗、意外、年金等责任结构。", "output": "人身险产品图谱", "prereq": "保险基础"}, {"title": "财产险产品结构", "domain": "产品险种", "activity": "设计", "difficulty": "入门", "focus": "理解车险、企财险、责任险、工程险、货运险等险种。", "output": "财产险产品图谱", "prereq": "风险与可保性"}, {"title": "责任边界设计", "domain": "产品险种", "activity": "风控", "difficulty": "进阶", "focus": "设计保险责任、除外责任、等待期、免赔额、赔付限额。", "output": "条款责任矩阵", "prereq": "保险合同要素"}, {"title": "纯保费计算", "domain": "精算定价", "activity": "定价", "difficulty": "入门", "focus": "用发生率、损失程度、保额等估算期望赔付成本。", "output": "纯保费模型", "prereq": "概率统计"}, {"title": "附加保费与费用", "domain": "精算定价", "activity": "定价", "difficulty": "进阶", "focus": "将费用、佣金、利润、风险边际加入费率结构。", "output": "费率构成表", "prereq": "纯保费计算"}, {"title": "赔付率分析", "domain": "精算定价", "activity": "度量", "difficulty": "入门", "focus": "用赔款与保费关系衡量业务质量。", "output": "赔付率分析表", "prereq": "保费赔款数据"}, {"title": "准备金评估", "domain": "精算定价", "activity": "度量", "difficulty": "高级", "focus": "估计未到期责任、未决赔款和长期责任负债。", "output": "准备金评估报告", "prereq": "精算基础"}, {"title": "核保规则设计", "domain": "核保承保", "activity": "风控", "difficulty": "入门", "focus": "根据年龄、职业、健康、标的、历史损失选择风险。", "output": "核保规则表", "prereq": "产品责任边界"}, {"title": "报价与出单流程", "domain": "核保承保", "activity": "运营", "difficulty": "入门", "focus": "理解报价、投保、核保、缴费、出单的流程。", "output": "承保流程图", "prereq": "核保规则"}, {"title": "续保与批改", "domain": "核保承保", "activity": "运营", "difficulty": "进阶", "focus": "处理保单变更、续保、退保、加保和减保。", "output": "保全作业规则", "prereq": "保单生命周期"}, {"title": "理赔流程", "domain": "理赔服务", "activity": "运营", "difficulty": "入门", "focus": "掌握报案、查勘、资料、定责、核赔、支付流程。", "output": "理赔流程图", "prereq": "保险合同"}, {"title": "责任认定", "domain": "理赔服务", "activity": "风控", "difficulty": "进阶", "focus": "基于条款、近因、证据和免责条款判断赔付责任。", "output": "责任认定模板", "prereq": "保险原则"}, {"title": "反欺诈识别", "domain": "理赔服务", "activity": "风控", "difficulty": "高级", "focus": "识别虚假事故、带病投保、团伙欺诈和异常模式。", "output": "欺诈规则/模型清单", "prereq": "理赔数据"}, {"title": "渠道管理", "domain": "经营治理", "activity": "运营", "difficulty": "入门", "focus": "理解代理、经纪、银保、互联网和团险渠道差异。", "output": "渠道画像", "prereq": "产品险种"}, {"title": "客户分层经营", "domain": "经营治理", "activity": "运营", "difficulty": "进阶", "focus": "按价值、风险、生命周期和需求做客户经营。", "output": "客户分层策略", "prereq": "客户数据"}, {"title": "偿付能力管理", "domain": "经营治理", "activity": "风控", "difficulty": "高级", "focus": "理解资本要求、风险评级、压力测试和监管约束。", "output": "偿付能力看板", "prereq": "财务与风险基础"}, {"title": "销售合规", "domain": "经营治理", "activity": "风控", "difficulty": "进阶", "focus": "管理适当性、误导销售、消费者权益和反洗钱。", "output": "合规检查清单", "prereq": "渠道管理"}, {"title": "保险数据治理", "domain": "数字化", "activity": "风控", "difficulty": "进阶", "focus": "治理客户、保单、理赔、渠道、财务等核心数据。", "output": "数据标准与质量规则", "prereq": "数据治理基础"}, {"title": "智能核保", "domain": "数字化", "activity": "运营", "difficulty": "进阶", "focus": "用规则、模型和外部数据提升核保效率和一致性。", "output": "智能核保流程", "prereq": "核保规则"}, {"title": "智能理赔", "domain": "数字化", "activity": "运营", "difficulty": "进阶", "focus": "用OCR、规则、模型和工作流提升理赔时效。", "output": "智能理赔方案", "prereq": "理赔流程"}, {"title": "保险核心系统", "domain": "数字化", "activity": "设计", "difficulty": "高级", "focus": "理解产品工厂、保单、批改、理赔、收付费、再保等系统。", "output": "核心系统能力地图", "prereq": "保险业务流程"}, {"title": "API与生态", "domain": "数字化", "activity": "设计", "difficulty": "高级", "focus": "通过API、嵌入式保险和合作生态连接场景。", "output": "开放平台蓝图", "prereq": "核心系统"}];const keys=Object.keys(dims),rowSel=document.getElementById('rowDim'),colSel=document.getElementById('colDim'),filterSel=document.getElementById('filterVal');function fillSelect(sel,selected){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===selected?'selected':''}>${dimLabel[k]}</option>`).join('')}function otherDim(){return keys.find(k=>k!==rowSel.value&&k!==colSel.value)}function syncDims(){if(rowSel.value===colSel.value)colSel.value=keys.find(k=>k!==rowSel.value)||rowSel.value;const f=otherDim();document.getElementById('filterBox').style.display=f?'inline-block':'none';filterSel.innerHTML=f?'<option value="__all__">全部</option>'+dims[f].map(v=>`<option value="${v}">${v}</option>`).join(''):'';render()}function cls(n){return n===0?'d0':(n<=1?'d1':(n<=3?'d2':'d3'))}function levelCls(v){return v==='入门'?'level-beginner':(v==='进阶'?'level-intermediate':(v==='高级'?'level-advanced':''))}function isDifficultyDim(dim){return dim==='difficulty'}function itemsFor(rDim,rVal,cDim,cVal,fDim,fVal){return entries.filter(e=>e[rDim]===rVal&&e[cDim]===cVal&&(!fDim||fVal==='__all__'||e[fDim]===fVal))}function itemHtml(x){return `<div class="kb"><div class="kb-title">${x.title}<span class="tag">${x.difficulty}</span></div><div><b>焦点：</b>${x.focus}</div><div><b>产出：</b>${x.output}</div><div><b>前导：</b>${x.prereq}</div></div>`}function render(){const rDim=rowSel.value,cDim=colSel.value,fDim=otherDim(),fVal=filterSel.value||'__all__',rows=dims[rDim],cols=dims[cDim];let html=`<tr><th>${dimLabel[rDim]} \\ ${dimLabel[cDim]}</th>`+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';for(const r of rows){html+=`<tr><td class="row-h">${r}</td>`;for(const c of cols){const items=itemsFor(rDim,r,cDim,c,fDim,fVal),cnt=items.length;let body='—',cellLevelClass=isDifficultyDim(rDim)?levelCls(r):(isDifficultyDim(cDim)?levelCls(c):'');if(items.length&&fDim&&fVal==='__all__'){body=dims[fDim].map(v=>{const group=items.filter(x=>x[fDim]===v),blockClass=isDifficultyDim(fDim)?` level-block ${levelCls(v)}`:'';return group.length?`<div class="${blockClass.trim()}"><div class="group">${v}</div>`+group.map(itemHtml).join('')+'</div>':''}).filter(Boolean).join('')}else if(items.length){body=items.map(itemHtml).join('');if(fDim&&isDifficultyDim(fDim)&&fVal!=='__all__')cellLevelClass=levelCls(fVal)}html+=`<td class="cell ${cellLevelClass||cls(cnt)}">${body}</td>`}html+='</tr>'}document.getElementById('mt').innerHTML=html}fillSelect(rowSel,'domain');fillSelect(colSel,'activity');syncDims();
</script></body></html>
