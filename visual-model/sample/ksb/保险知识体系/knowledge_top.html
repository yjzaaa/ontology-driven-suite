<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>保险知识体系顶层思维导图</title><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><style>body{margin:0;background:#f7f8fa;color:#1a1a2e;font-family:Arial,'Microsoft YaHei',sans-serif}header{padding:14px 20px;background:#fff;box-shadow:0 1px 8px #0001;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0 20px 0 0;font-size:18px}button{border:1px solid #d7dbe8;background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}svg{display:block}.link{fill:none}.node text{text-anchor:middle;dominant-baseline:middle;pointer-events:none}.node{cursor:pointer}</style></head><body><header><h2>顶层 · 保险知识体系主干</h2><button onclick="expandAll()">展开全部</button><button onclick="expandToThird()">展开到三级</button><button onclick="collapseAll()">折叠到主干</button><button onclick="resetZoom()">重置视图</button></header><svg id="svg"></svg><script>
const raw={"name": "保险知识体系", "children": [{"name": "保险基础与风险", "color": "#3f51b5", "children": [{"name": "风险与可保性", "children": [{"name": "风险转移"}, {"name": "大数法则"}, {"name": "逆选择"}]}, {"name": "保险合同", "children": [{"name": "保险利益"}, {"name": "最大诚信"}, {"name": "条款责任"}]}, {"name": "保险市场", "children": [{"name": "投保人"}, {"name": "保险人"}, {"name": "中介"}]}]}, {"name": "产品与险种", "color": "#009688", "children": [{"name": "人身险", "children": [{"name": "寿险"}, {"name": "健康险"}, {"name": "意外险"}]}, {"name": "财产险", "children": [{"name": "车险"}, {"name": "企财险"}, {"name": "责任险"}]}, {"name": "再保险", "children": [{"name": "比例再保"}, {"name": "非比例再保"}, {"name": "巨灾风险"}]}]}, {"name": "精算与定价", "color": "#ff9800", "children": [{"name": "费率厘定", "children": [{"name": "纯保费"}, {"name": "附加费用"}, {"name": "风险边际"}]}, {"name": "准备金", "children": [{"name": "未到期责任"}, {"name": "未决赔款"}, {"name": "长期责任"}]}, {"name": "经验分析", "children": [{"name": "赔付率"}, {"name": "费用率"}, {"name": "敏感性"}]}]}, {"name": "核保与承保", "color": "#e91e63", "children": [{"name": "核保规则", "children": [{"name": "风险选择"}, {"name": "健康告知"}, {"name": "财务核保"}]}, {"name": "承保流程", "children": [{"name": "报价"}, {"name": "出单"}, {"name": "批改"}]}, {"name": "保全服务", "children": [{"name": "续保"}, {"name": "变更"}, {"name": "退保"}]}]}, {"name": "理赔与服务", "color": "#4caf50", "children": [{"name": "报案查勘", "children": [{"name": "事故通知"}, {"name": "资料收集"}, {"name": "损失评估"}]}, {"name": "责任认定", "children": [{"name": "近因原则"}, {"name": "免责条款"}, {"name": "赔付计算"}]}, {"name": "客户服务", "children": [{"name": "时效"}, {"name": "争议处理"}, {"name": "反欺诈"}]}]}, {"name": "销售渠道运营", "color": "#00bcd4", "children": [{"name": "代理经纪", "children": [{"name": "代理人"}, {"name": "经纪人"}, {"name": "银保"}]}, {"name": "线上渠道", "children": [{"name": "互联网保险"}, {"name": "嵌入式保险"}, {"name": "私域运营"}]}, {"name": "客户经营", "children": [{"name": "续保"}, {"name": "交叉销售"}, {"name": "客户分层"}]}]}, {"name": "风控合规监管", "color": "#9c27b0", "children": [{"name": "偿付能力", "children": [{"name": "资本要求"}, {"name": "风险综合评级"}, {"name": "压力测试"}]}, {"name": "合规经营", "children": [{"name": "销售适当性"}, {"name": "消费者保护"}, {"name": "反洗钱"}]}, {"name": "公司治理", "children": [{"name": "三道防线"}, {"name": "内控"}, {"name": "审计"}]}]}, {"name": "投资与资产负债", "color": "#ff5722", "children": [{"name": "保险资金运用", "children": [{"name": "久期匹配"}, {"name": "信用风险"}, {"name": "流动性"}]}, {"name": "ALM", "children": [{"name": "负债特征"}, {"name": "资产配置"}, {"name": "利率风险"}]}, {"name": "利润分析", "children": [{"name": "承保利润"}, {"name": "投资收益"}, {"name": "内含价值"}]}]}, {"name": "数据与数字化", "color": "#795548", "children": [{"name": "数据治理", "children": [{"name": "客户数据"}, {"name": "保单数据"}, {"name": "理赔数据"}]}, {"name": "智能保险", "children": [{"name": "智能核保"}, {"name": "智能理赔"}, {"name": "反欺诈模型"}]}, {"name": "保险科技", "children": [{"name": "核心系统"}, {"name": "API生态"}, {"name": "云原生"}]}]}, {"name": "行业战略与创新", "color": "#607d8b", "children": [{"name": "普惠保险", "children": [{"name": "农业保险"}, {"name": "健康管理"}, {"name": "养老金融"}]}, {"name": "场景保险", "children": [{"name": "车联网"}, {"name": "航旅"}, {"name": "电商"}]}, {"name": "经营转型", "children": [{"name": "价值增长"}, {"name": "精细化运营"}, {"name": "生态合作"}]}]}]};const KSB_PALETTE={branches:["#3f51b5", "#009688", "#ff9800", "#e91e63", "#4caf50", "#00bcd4", "#9c27b0", "#ff5722", "#795548", "#607d8b"]};const svg=d3.select('#svg'),gZoom=svg.append('g'),g=gZoom.append('g'),linkG=g.append('g'),nodeG=g.append('g');const PAD=190,VGAP=44,HSTEP=185;function nodeWidth(d){return Math.max(d.depth===0?150:80,d.data.name.length*13+26)}function nodeHeight(d){return d.depth===0?42:(d.depth===1?31:27)}function colorOf(d){if(d.depth===0)return'#1a237e';let n=d;while(n.depth>1)n=n.parent;return n.data.color||KSB_PALETTE.branches[0]}function foldAfterDepth(n,depth=3,cur=0){if(!n.children)return;if(cur>=depth){n._children=n.children;n.children=null;n._folded=true;return}n.children.forEach(c=>foldAfterDepth(c,depth,cur+1))}function buildSide(branches,side){if(!branches.length)return[];const h=d3.hierarchy({name:'_',children:branches});d3.tree().nodeSize([VGAP,HSTEP]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);const nodes=h.descendants().filter(d=>d.depth>0);nodes.forEach(n=>{n.xx=side*n.y;n.yy=n.x;n.side=side});const ys=nodes.map(n=>n.yy),mid=(Math.min(...ys)+Math.max(...ys))/2;nodes.forEach(n=>n.yy-=mid);return nodes}function linkPath(s,t){const sw=nodeWidth(s),tw=nodeWidth(t),dir=t.side>=0?1:-1,x1=s.xx+dir*sw/2,x2=t.xx-dir*tw/2,dx=Math.abs(x2-x1),c=Math.max(26,dx*.42);return`M${x1},${s.yy} C${x1+dir*c},${s.yy} ${x2-dir*c},${t.yy} ${x2},${t.yy}`}function render(){const right=buildSide(raw.children.filter((_,i)=>i%2===0),1),left=buildSide(raw.children.filter((_,i)=>i%2===1),-1),sideNodes=right.concat(left),rootNode={depth:0,data:raw,xx:0,yy:0,side:0,parent:null},allNodes=sideNodes.concat([rootNode]),links=[];sideNodes.forEach(n=>links.push({source:n.depth===1?rootNode:n.parent,target:n}));const minX=Math.min(...allNodes.map(n=>n.xx))-PAD,maxX=Math.max(...allNodes.map(n=>n.xx))+PAD,minY=Math.min(...allNodes.map(n=>n.yy))-70,maxY=Math.max(...allNodes.map(n=>n.yy))+70,W=maxX-minX,H=maxY-minY;svg.attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`);g.attr('transform',`translate(${-minX},${-minY})`);linkG.selectAll('path').data(links,d=>d.target.data.name+d.target.depth).join('path').attr('class','link').attr('d',d=>linkPath(d.source,d.target)).attr('stroke',d=>colorOf(d.target)).attr('stroke-width',d=>d.target.depth===1?2.2:1.4).attr('opacity',d=>d.target.depth===1?.9:.55);const node=nodeG.selectAll('g.node').data(allNodes,d=>(d.depth===0?'__root__':d.data.name)+d.depth).join(enter=>{const e=enter.append('g').attr('class','node').on('click',(ev,d)=>{if(d.depth<1)return;if(d.data._children&&!d.data.children){d.data.children=d.data._children;d.data._children=null;d.data._folded=false}else if(d.data.children){d.data._children=d.data.children;d.data.children=null;d.data._folded=true}render()});e.append('rect');e.append('text');return e});node.attr('transform',d=>`translate(${d.xx-nodeWidth(d)/2},${d.yy-nodeHeight(d)/2})`).each(function(d){const sel=d3.select(this),w=nodeWidth(d),h=nodeHeight(d),c=colorOf(d);sel.selectAll('.bar').remove();if(d.depth===0){sel.select('rect').attr('width',w).attr('height',h).attr('rx',10).attr('fill',c);sel.select('text').text(d.data.name).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',18).attr('font-weight',700)}else if(d.depth===1){sel.select('rect').attr('width',w).attr('height',h).attr('rx',7).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#fff').attr('font-size',13).attr('font-weight',600)}else{sel.select('rect').attr('width',w).attr('height',h).attr('rx',6).attr('fill','#fff').attr('stroke','#e5e7ef');sel.insert('rect','text').attr('class','bar').attr('width',4).attr('height',h).attr('rx',2).attr('x',d.side<0?w-4:0).attr('fill',c);sel.select('text').text(d.data.name+(d.data._folded?(d.side<0?' ◂':' ▸'):'' )).attr('x',w/2).attr('y',h/2).attr('fill','#263238').attr('font-size',12.5)}})}function walk(n,fn){fn(n);(n.children||n._children||[]).forEach(c=>walk(c,fn))}function expandAll(){walk(raw,n=>{if(n._children){n.children=n._children;n._children=null;n._folded=false}});render()}function expandToThird(){expandAll();foldAfterDepth(raw,3);render()}function collapseAll(){raw.children.forEach(b=>{if(b.children){b._children=b.children;b.children=null;b._folded=true}});render()}const zoom=d3.zoom().scaleExtent([.35,2.5]).on('zoom',ev=>gZoom.attr('transform',ev.transform));svg.call(zoom);function resetZoom(){svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity)}expandToThird();
</script></body></html>
