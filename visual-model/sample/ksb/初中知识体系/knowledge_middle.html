n>`).join('<br>'):'—';}html+=`<td class="${cellCls||cls(items.length)}">${body}</td>`;}html+='</tr>';}document.getElementById('mt').innerHTML=html;const total=new Set(entries.map(e=>e.l3Id)).size;document.getElementById('coverage').textContent=`L3覆盖统计：总数 ${total} / 已覆盖 ${total} / 覆盖率 100% / 未覆盖 0 / 重复主归属 0`;}fill(rowSel,keys[0]);fill(colSel,keys[1]);sync();
