# 发布失败场景样例（T03.7 产出）

记录发布门禁的失败场景、触发条件、稳定错误码与阻断点。这些样例必须全部被发布校验阻断。

## 1. 状态机非法迁移

| 场景 | 尝试 | 阻断点 | 错误码 |
|---|---|---|---|
| 跳过审核 | `GENERATED` → `PUBLISHED` | 生命周期状态机 | `LIFECYCLE_ILLEGAL_TRANSITION` |
| 从失败发布 | `REVIEW_REQUIRED`（审核被拒）→ `PUBLISHED` | 生命周期状态机 | `LIFECYCLE_REVIEW_REJECTED` |
| 已发布原位修改 | 修改 `PUBLISHED` YAML 后重新发布同版本 | 不可变性 + 摘要校验 | `PUBLISH_IMMUTABLE_VIOLATION` |

## 2. Schema / 证据 / 引用 / 兼容 / 风险门禁

| 门禁 | 失败样例 | 错误码 |
|---|---|---|
| Schema | M1 含表名、M2 含 URL、M7 无分页 | `SCHEMA_INVALID` |
| 证据 | `evidence_refs` 引用失效证据（T02.7） | `EVIDENCE_INVALID` |
| 引用闭包 | 悬空引用 / 类型不匹配 / 环 / 版本无解 / 已撤回 | `REF_MISSING` / `REF_TYPE_MISMATCH` / `REF_CYCLE` / `REF_VERSION_UNRESOLVED` / `REF_WITHDRAWN` |
| 兼容性 | `side_effect WRITE→MIXED` 未升 major | `COMPAT_MAJOR_REQUIRED` |
| 风险 | `MIXED/HIGH` 或 `UNKNOWN` 无人工审核记录 | `RISK_NOT_REVIEWED` |

## 3. 摘要篡改

- 已发布 YAML 被篡改 → 重新计算 sha256 与 manifest 不一致 → `TAMPERED`，阻断 Runtime Registry 加载。
- 合法修订必须使用新版本和新 manifest，不得复用原 `publication_id`。

## 4. 验证记录

- 状态机覆盖所有允许迁移，拒绝跳过审核、从失败状态直接发布等非法迁移。
- 发布失败场景分别验证 Schema、证据、引用闭包、兼容性和风险门禁能够阻断。
- 修改已发布 YAML 后内容摘要校验失败；合法修订使用新版本和新 manifest。
- 原子发布保证同一集合不会部分发布。
- 命令：`git diff --check` 应通过。
