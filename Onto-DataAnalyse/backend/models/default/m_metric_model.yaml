  - id: MTR-USR-001
    name: 新增用户数
    alias: new_user_count
    description: 统计周期内，注册日期在周期内的用户数量
    formula_description: COUNT(user_id) WHERE register_date IN period
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-001
    rule_refs:
      - RULE-MTR-006
    sql_template: "SELECT strftime('%Y-%m-%d', register_date) AS period,\n       COUNT(DISTINCT user_id) AS new_user_count\nFROM t_user\nWHERE register_date BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
