  - id: MTR-TFC-001
    name: 访问转化率
    alias: view_to_order_rate
    description: 统计周期内，从浏览（VIEW）到下单（有效订单）的用户转化比例
    formula_description: COUNT(DISTINCT user_id with order) / COUNT(DISTINCT user_id with VIEW)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-002
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-011
    sql_template: "SELECT strftime('%Y-%m-%d', ub.gmt_create) AS period,\n       CAST(COUNT(DISTINCT o.buyer_id) AS REAL) / NULLIF(COUNT(DISTINCT ub.user_id), 0) AS view_to_order_rate\nFROM t_user_behavior ub\nLEFT JOIN t_order o ON ub.user_id = o.buyer_id\n  AND o.status NOT IN (5, 6)\n  AND o.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nWHERE ub.behavior_type = 'VIEW'\n  AND ub.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - channel
      - category
      - device_type
    default_visualization: line
    unit: '%'
    tags:
      - conversion
      - funnel
