    sql_template: "SELECT strftime('%Y-%m-%d', apply_time) AS period,\n       SUM(refund_amount) AS refund_amount\nFROM t_refund\nWHERE apply_time BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
