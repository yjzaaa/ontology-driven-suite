model_type: METRIC
version: '1.0'
domain: 电商经营分析
metrics:
  - id: MTR-TXN-001
    name: GMV
    alias: gmv
    description: 成交总额（有效订单实付金额之和，不含已取消和退款完成订单）
    formula_description: SUM(t_order.payment_amount) WHERE status NOT IN (5,6)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-001
      - RULE-DQ-001
    sql_template: "SELECT strftime('%Y-%m-%d', gmt_create) AS period,\n       SUM(payment_amount) AS gmv\nFROM t_order\nWHERE status NOT IN (5, 6)\n  AND gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - shop
      - category
      - channel
      - region
    default_visualization: line
    unit: 元
    tags:
      - core
      - growth
  - id: MTR-TXN-002
    name: 有效订单数
    alias: valid_order_count
    description: 统计周期内，状态不为5（已取消）和6（退款完成）的订单数量
    formula_description: COUNT(order_id) WHERE status NOT IN (5,6)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-002
      - RULE-DQ-001
    sql_template: "SELECT strftime('%Y-%m-%d', gmt_create) AS period,\n       COUNT(DISTINCT order_id) AS valid_order_count\nFROM t_order\nWHERE status NOT IN (5, 6)\n  AND gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - shop
      - category
      - channel
      - region
    default_visualization: line
    unit: 单
    tags:
      - core
      - growth
  - id: MTR-TXN-003
    name: 客单价
    alias: avg_order_value
    description: 统计周期内，GMV除以有效订单数
    formula_description: GMV / 有效订单数
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-003
    sql_template: "SELECT period,\n       CASE WHEN valid_order_count > 0 THEN gmv / valid_order_count ELSE 0 END AS avg_order_value\nFROM (\n  SELECT strftime('%Y-%m-%d', gmt_create) AS period,\n         SUM(payment_amount) AS gmv,\n         COUNT(DISTINCT order_id) AS valid_order_count\n  FROM t_order\n  WHERE status NOT IN (5, 6)\n    AND gmt_create BETWEEN '{date_start}' AND '{date_end}'\n  GROUP BY period\n) ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - shop
      - category
      - channel
      - region
    default_visualization: line
    unit: 元/单
    tags:
      - core
      - efficiency
  - id: MTR-TXN-004
    name: 订单取消率
    alias: order_cancel_rate
    description: 统计周期内，状态为5（已取消）的订单数除以总订单数
    formula_description: COUNT(order_id WHERE status=5) / COUNT(total_order_id)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-004
    sql_template: "SELECT strftime('%Y-%m-%d', gmt_create) AS period,\n       CAST(SUM(CASE WHEN status = 5 THEN 1 ELSE 0 END) AS REAL) / COUNT(DISTINCT order_id) AS order_cancel_rate\nFROM t_order\nWHERE gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - shop
      - category
      - channel
      - region
    default_visualization: line
    unit: '%'
    tags:
      - quality
      - risk
  - id: MTR-TXN-005
    name: 退款率
    alias: refund_rate
    description: 统计周期内，退款金额之和除以GMV（退款金额按申请时间归属）
    formula_description: SUM(t_refund.refund_amount) / GMV
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
      - ENT-ORD-004
    rule_refs:
      - RULE-MTR-005
      - RULE-MTR-014
    sql_template: "SELECT strftime('%Y-%m-%d', o.gmt_create) AS period,\n       COALESCE(SUM(r.refund_amount), 0) / NULLIF(SUM(o.payment_amount), 0) AS refund_rate\nFROM t_order o\nLEFT JOIN t_refund r ON o.order_id = r.order_id\n  AND r.apply_time BETWEEN '{date_start}' AND '{date_end}'\nWHERE o.status NOT IN (5, 6)\n  AND o.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - shop
      - category
      - channel
      - region
      - refund_reason
    default_visualization: line
    unit: '%'
    tags:
      - quality
      - risk
  - id: MTR-TXN-006
    name: 总订单数
    alias: total_order_count
    description: 统计周期内所有订单的数量（含已取消和退款完成）
    formula_description: COUNT(order_id)
    computation_type: SQL_COMPUTE
    depends_on_entities:
