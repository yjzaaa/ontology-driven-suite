  - id: MTR-TXN-008
    name: 退款完成金额
    alias: completed_refund_amount
    description: 统计周期内，退款完成时间在周期内的退款金额之和
    formula_description: SUM(t_refund.refund_amount) WHERE complete_time IN period AND status=COMPLETED
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-004
    rule_refs: []
    sql_template: "SELECT strftime('%Y-%m-%d', complete_time) AS period,\n       SUM(refund_amount) AS completed_refund_amount\nFROM t_refund\nWHERE status = 'COMPLETED'\n  AND complete_time BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
