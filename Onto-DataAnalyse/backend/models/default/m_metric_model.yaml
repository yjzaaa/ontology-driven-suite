    rule_refs: []
    sql_template: "SELECT strftime('%Y-%m-%d', gmt_create) AS period,\n       COUNT(DISTINCT order_id) AS total_order_count\nFROM t_order\nWHERE gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
