  - id: MTR-USR-002
    name: 活跃用户数
    alias: active_user_count
    description: 统计周期内，有过任一登录、浏览、搜索、加购或下单行为的用户数（去重）
    formula_description: COUNT(DISTINCT user_id) WHERE has behavior or order in period
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-001
      - ENT-USR-002
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-007
    sql_template: "SELECT period,\n       COUNT(DISTINCT user_id) AS active_user_count\nFROM (\n  SELECT strftime('%Y-%m-%d', gmt_create) AS period, user_id\n  FROM t_user_behavior\n  WHERE gmt_create BETWEEN '{date_start}' AND '{date_end}'\n  UNION\n  SELECT strftime('%Y-%m-%d', gmt_create) AS period, buyer_id AS user_id\n  FROM t_order\n  WHERE gmt_create BETWEEN '{date_start}' AND '{date_end}'\n) GROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - register_channel
      - province
      - user_level
    default_visualization: line
    unit: 人
    tags:
      - user
      - engagement
  - id: MTR-USR-003
    name: 复购率
    alias: repurchase_rate
    description: 统计周期内，有≥2笔有效订单的用户数除以有≥1笔有效订单的用户数
    formula_description: COUNT(DISTINCT user_id with >=2 orders) / COUNT(DISTINCT user_id with >=1 order)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-008
    sql_template: "SELECT strftime('%Y-%m-%d', gmt_create) AS period,\n       CAST(COUNT(DISTINCT CASE WHEN order_count >= 2 THEN buyer_id END) AS REAL) /\n       NULLIF(COUNT(DISTINCT buyer_id), 0) AS repurchase_rate\nFROM (\n  SELECT buyer_id,\n         strftime('%Y-%m-%d', gmt_create) AS period,\n         COUNT(DISTINCT order_id) AS order_count\n  FROM t_order\n  WHERE status NOT IN (5, 6)\n    AND gmt_create BETWEEN '{date_start}' AND '{date_end}'\n  GROUP BY buyer_id, period\n) GROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - register_channel
      - province
      - user_level
    default_visualization: line
    unit: '%'
    tags:
      - user
      - loyalty
  - id: MTR-USR-004
    name: 用户留存率
    alias: user_retention_rate
    description: 统计周期内，在指定时间点（如7/30/90天后）仍活跃的用户数除以初始活跃用户数
    formula_description: COUNT(DISTINCT user_id active at day N) / COUNT(DISTINCT user_id active at day 0)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-001
      - ENT-USR-002
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-009
    sql_template: "WITH initial_users AS (\n  SELECT DISTINCT user_id\n  FROM t_user_behavior\n  WHERE gmt_create BETWEEN '{date_start}' AND '{date_end}'\n  UNION\n  SELECT DISTINCT buyer_id AS user_id\n  FROM t_order\n  WHERE gmt_create BETWEEN '{date_start}' AND '{date_end}'\n),\nretained_users AS (\n  SELECT DISTINCT ub.user_id\n  FROM initial_users iu\n  JOIN t_user_behavior ub ON iu.user_id = ub.user_id\n  WHERE ub.gmt_create BETWEEN '{retention_start}' AND '{retention_end}'\n  UNION\n  SELECT DISTINCT o.buyer_id AS user_id\n  FROM initial_users iu\n  JOIN t_order o ON iu.user_id = o.buyer_id\n  WHERE o.gmt_create BETWEEN '{retention_start}' AND '{retention_end}'\n)\nSELECT CAST((SELECT COUNT(*) FROM retained_users) AS REAL) /\n       NULLIF((SELECT COUNT(*) FROM initial_users), 0) AS user_retention_rate\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - register_channel
      - province
      - user_level
    default_visualization: line
    unit: '%'
    tags:
      - user
      - retention
  - id: MTR-USR-005
    name: 用户流失率
    alias: user_churn_rate
    description: 统计周期内，曾经活跃但近期（如30天）无任何行为的用户数除以总活跃用户数
    formula_description: COUNT(DISTINCT user_id active before but not in recent 30 days) / COUNT(DISTINCT user_id active before)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-001
      - ENT-USR-002
    rule_refs:
      - RULE-MTR-010
    sql_template: "WITH previously_active AS (\n  SELECT DISTINCT user_id\n  FROM t_user_behavior\n  WHERE gmt_create BETWEEN '{prev_start}' AND '{prev_end}'\n  UNION\n  SELECT DISTINCT buyer_id AS user_id\n  FROM t_order\n  WHERE gmt_create BETWEEN '{prev_start}' AND '{prev_end}'\n),\nrecently_active AS (\n  SELECT DISTINCT user_id\n  FROM t_user_behavior\n  WHERE gmt_create BETWEEN '{recent_start}' AND '{recent_end}'\n  UNION\n  SELECT DISTINCT buyer_id AS user_id\n  FROM t_order\n  WHERE gmt_create BETWEEN '{recent_start}' AND '{recent_end}'\n)\nSELECT CAST(COUNT(DISTINCT pa.user_id) - COUNT(DISTINCT ra.user_id) AS REAL) /\n       NULLIF(COUNT(DISTINCT pa.user_id), 0) AS user_churn_rate\nFROM previously_active pa\nLEFT JOIN recently_active ra ON pa.user_id = ra.user_id\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - register_channel
      - province
      - user_level
    default_visualization: line
    unit: '%'
    tags:
      - user
      - churn
  - id: MTR-USR-006
    name: 新用户首单转化率
    alias: new_user_first_order_rate
    description: 统计周期内，注册后30天内完成首单（有效订单）的新用户比例
    formula_description: COUNT(DISTINCT user_id with first order within 30 days) / COUNT(DISTINCT new_user_id)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-001
      - ENT-ORD-001
    rule_refs:
      - RULE-MTR-017
    sql_template: "SELECT strftime('%Y-%m-%d', u.register_date) AS period,\n       CAST(COUNT(DISTINCT CASE WHEN o.order_id IS NOT NULL THEN u.user_id END) AS REAL) /\n       NULLIF(COUNT(DISTINCT u.user_id), 0) AS new_user_first_order_rate\nFROM t_user u\nLEFT JOIN t_order o ON u.user_id = o.buyer_id\n  AND o.status NOT IN (5, 6)\n  AND o.gmt_create >= u.register_date\n  AND o.gmt_create < date(u.register_date, '+30 days')\nWHERE u.register_date BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - register_channel
      - province
      - user_level
    default_visualization: line
    unit: '%'
    tags:
      - user
      - conversion
  - id: MTR-USR-007
    name: 总用户数
    alias: total_user_count
    description: 截至统计周期末的累计注册用户总数
    formula_description: COUNT(user_id) WHERE register_date <= period end
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-USR-001
    rule_refs: []
    sql_template: "SELECT '{date_end}' AS period,\n       COUNT(DISTINCT user_id) AS total_user_count\nFROM t_user\nWHERE register_date <= '{date_end}'\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - register_channel
      - province
      - user_level
    default_visualization: number
    unit: 人
    tags:
      - user
      - scale
  - id: MTR-PRD-001
    name: 商品销售额
    alias: product_sales_amount
    description: 统计周期内，按商品SPU汇总的有效订单实付金额
    formula_description: SUM(t_order_item.pay_price * quantity) WHERE order status NOT IN (5,6)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
      - ENT-ORD-002
      - ENT-PRD-001
    rule_refs: []
    sql_template: "SELECT strftime('%Y-%m-%d', o.gmt_create) AS period,\n       oi.product_id,\n       SUM(oi.pay_price * oi.quantity) AS product_sales_amount\nFROM t_order o\nJOIN t_order_item oi ON o.order_id = oi.order_id\nWHERE o.status NOT IN (5, 6)\n  AND o.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period, oi.product_id ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - product
      - category
      - shop
    default_visualization: bar
    unit: 元
    tags:
      - product
      - sales
  - id: MTR-PRD-002
    name: 商品销量
    alias: product_sales_quantity
    description: 统计周期内，按商品SPU汇总的有效订单销售数量
    formula_description: SUM(t_order_item.quantity) WHERE order status NOT IN (5,6)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-ORD-001
      - ENT-ORD-002
      - ENT-PRD-001
    rule_refs: []
    sql_template: "SELECT strftime('%Y-%m-%d', o.gmt_create) AS period,\n       oi.product_id,\n       SUM(oi.quantity) AS product_sales_quantity\nFROM t_order o\nJOIN t_order_item oi ON o.order_id = oi.order_id\nWHERE o.status NOT IN (5, 6)\n  AND o.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period, oi.product_id ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - product
      - category
      - shop
    default_visualization: bar
    unit: 件
    tags:
      - product
      - sales
  - id: MTR-PRD-003
    name: 商品动销率
    alias: product_sell_through_rate
    description: 统计周期内，有销售的商品SPU数除以总上架商品SPU数
    formula_description: COUNT(DISTINCT product_id with sales) / COUNT(DISTINCT product_id on shelf)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-PRD-001
      - ENT-ORD-002
    rule_refs:
      - RULE-MTR-018
    sql_template: "SELECT strftime('%Y-%m-%d', o.gmt_create) AS period,\n       CAST(COUNT(DISTINCT oi.product_id) AS REAL) /\n       NULLIF((SELECT COUNT(DISTINCT product_id) FROM t_product WHERE status = 1), 0) AS product_sell_through_rate\nFROM t_order o\nJOIN t_order_item oi ON o.order_id = oi.order_id\nWHERE o.status NOT IN (5, 6)\n  AND o.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - DAY
      - WEEK
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - category
      - shop
    default_visualization: line
    unit: '%'
    tags:
      - product
      - efficiency
  - id: MTR-PRD-004
    name: 库存周转率
    alias: inventory_turnover_rate
    description: 统计周期内，商品销售成本除以平均库存成本
    formula_description: SUM(sales_cost) / AVG(inventory_cost)
    computation_type: SQL_COMPUTE
    depends_on_entities:
      - ENT-PRD-002
      - ENT-ORD-002
    rule_refs:
      - RULE-MTR-019
    sql_template: "SELECT strftime('%Y-%m-%d', o.gmt_create) AS period,\n       SUM(oi.quantity * sku.cost_price) /\n       NULLIF(AVG(sku.stock * sku.cost_price), 0) AS inventory_turnover_rate\nFROM t_order o\nJOIN t_order_item oi ON o.order_id = oi.order_id\nJOIN t_sku sku ON oi.sku_id = sku.sku_id\nWHERE o.status NOT IN (5, 6)\n  AND o.gmt_create BETWEEN '{date_start}' AND '{date_end}'\nGROUP BY period ORDER BY period\n"
    stat_algorithm: null
    supported_grains:
      - MONTH
      - QUARTER
      - YEAR
    supported_dimensions:
      - product
      - category
      - shop
    default_visualization: line
    unit: 次
    tags:
      - product
      - efficiency
  - id: MTR-PRD-005
    name: 商品平均评分
    alias: avg_product_rating
    description: 统计周期内，有销售商品的平均评分
    formula_description: AVG(t_product.avg_rating) WHERE product has sales in period
    computation_type: SQL_COMP
