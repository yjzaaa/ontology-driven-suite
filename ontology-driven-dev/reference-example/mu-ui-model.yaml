application:
  menus:
  - children:
    - menuId: menu-contract-maintain
      name: 合同维护
      screenRef: frmContractMaintain
    - menuId: menu-contract-query
      name: 合同查询
      screenRef: frmContractQuery
    menuId: menu-contract
    name: 合同管理
  - children:
    - menuId: menu-invoice-maintain
      name: 开票录入
      screenRef: frmInvoiceMaintain
