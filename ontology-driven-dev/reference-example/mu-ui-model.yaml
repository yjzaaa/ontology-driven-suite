  name: 销售合同执行管理系统
domain: 销售合同执行管理
model_type: UI
screens:
- actions:
  - actionId: actSaveDraft
    actionType: DRAFT
    behaviorRef: Contract_SaveAsDraft
    name: 保存草稿
    permissionRef:
    - PERM-CONTRACT-SAVE-DRAFT
  - actionId: actSubmit
    actionType: SUBMIT
    behaviorRef: Contract_Submit
    name: 提交
    permissionRef:
    - PERM-CONTRACT-SUBMIT
  - actionId: actCancel
    actionType: BUTTON
    behaviorRef: Contract_SaveAsDraft
    name: 取消
  elements:
  - dataBinding: Contract.contractNo
    id: txtContractNo
    io: I
    label: 合同编号
    required: true
    type: TEXTBOX
  - dataBinding: Contract.contractName
    id: txtContractName
    io: I
    label: 合同名称
    required: true
    type: TEXTBOX
  - dataBinding: Contract.contractType
    id: cboContractType
    io: I
    label: 合同类型
    required: true
    type: COMBO
  - dataBinding: Contract.productId
    id: pslProduct
    io: I
    label: 所属产品
    required: true
    type: POPUP_SELECT
  - dataBinding: Contract.customerId
    id: pslCustomer
    io: I
    label: 所属客户
    required: true
    type: POPUP_SELECT
  - dataBinding: Contract.departmentId
    id: pslDepartment
    io: I
    label: 所属部门
    required: true
    type: POPUP_SELECT
  - dataBinding: Contract.ownerId
    id: pslOwner
    io: I
    label: 责任人
    required: true
    type: POPUP_SELECT
