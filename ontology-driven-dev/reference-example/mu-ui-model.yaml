    actionType: BUTTON
    behaviorRef: Contract_QueryList
    name: 查询
    permissionRef:
    - PERM-CONTRACT-QUERY-LIST
    - PERM-CONTRACT-QUERY-LIST-OWN-DEPT
  - actionId: actDetail
    actionType: BUTTON
    behaviorRef: Contract_QueryDetail
    name: 查看详情
    permissionRef:
    - PERM-CONTRACT-QUERY-DETAIL
    - PERM-CONTRACT-QUERY-DETAIL-OWN-DEPT
  elements:
  - dataBinding: Contract.contractNo
    id: txtContractNo
    io: I
    label: 合同编号
    type: TEXTBOX
  - dataBinding: Contract.contractName
    id: txtContractName
    io: I
    label: 合同名称
    type: TEXTBOX
  - dataBinding: Contract.contractType
    id: cboContractType
    io: I
    label: 合同类型
    type: COMBO
  - dataBinding: Contract.departmentId
