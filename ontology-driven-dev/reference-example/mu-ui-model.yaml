    id: grdResult
    io: O
    label: 查询结果
    type: GRID
  - id: btnQuery
    label: 查询
    type: BUTTON
  - id: btnReset
    label: 重置
    type: BUTTON
  - id: btnExport
    label: 导出
    type: BUTTON
  layout: '┌──────────────────────────────────────────────────────────────┐

    │ 销售合同执行管理系统                               [btnLogout] │

    ├──────────────────────────────────────────────────────────────┤

    │ 合同信息查询                                                  │

    │ 合同编号:[txtContractNo]  合同名称:[txtContractName]  合同类型:(cboContractType) │

    │ 所属部门:[pslDepartment]  签订日期从:{dtpFrom}  到:{dtpTo}     │

