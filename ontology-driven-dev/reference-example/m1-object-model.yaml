data_dictionaries:
- id: DICT-CONTRACT-TYPE
  name: 合同类型字典
  types:
  - items:
    - code: PRODUCT
      enabled: true
      label: 产品合同
      sortOrder: 10
    - code: SERVICE
      enabled: true
      label: 服务合同
      sortOrder: 20
    - code: INTEGRATION
      enabled: true
      label: 集成合同
      sortOrder: 30
    typeCode: CONTRACT_TYPE
    typeName: 合同类型
- id: DICT-RECEIPT-METHOD
  name: 收款方式字典
  types:
  - items:
    - code: BANK
      enabled: true
      label: 银行转账
      sortOrder: 10
    - code: BILL
      enabled: true
      label: 票据
      sortOrder: 20
    - code: OTHER
      enabled: true
      label: 其他
      sortOrder: 30
    typeCode: RECEIPT_METHOD
    typeName: 收款方式
- id: DICT-APPROVAL-NODE
  name: 审批节点字典
  types:
  - items:
    - code: FINANCE_MANAGER
      enabled: true
      label: 财务经理审批
      sortOrder: 10
    - code: GENERAL_MANAGER
      enabled: true
      label: 总经理审批
      sortOrder: 20
    typeCode: APPROVAL_NODE
    typeName: 审批节点
- id: DICT-APPROVAL-RESULT
  name: 审批结果字典
  types:
  - items:
    - code: APPROVE
      enabled: true
      label: 通过
      sortOrder: 10
    - code: REJECT
      enabled: true
      label: 驳回
      sortOrder: 20
    typeCode: APPROVAL_RESULT
    typeName: 审批结果
- id: DICT-BIZ-TYPE
  name: 审批业务类型字典
  types:
  - items:
    - code: CONTRACT_REG
      enabled: true
      label: 合同登记
      sortOrder: 10
    - code: INVOICE
      enabled: true
      label: 开票
      sortOrder: 20
    typeCode: BIZ_TYPE
    typeName: 业务类型
- id: DICT-PRODUCT-TYPE
  name: 产品类型字典
  types:
  - items: []
    typeCode: PRODUCT_TYPE
    typeName: 产品类型
- id: DICT-CUSTOMER-TYPE
  name: 客户类型字典
  types:
  - items: []
    typeCode: CUSTOMER_TYPE
    typeName: 客户类型
domain: 销售合同执行管理
model_type: OBJECT
version: '2.1'
