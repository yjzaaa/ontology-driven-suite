  type: reference
- cardinality: MANY_TO_ONE
  cascadeDelete: false
  referenceField: customerId
  source: AGG-CONTRACT-001
  sourceRole: 所属客户
  target: AGG-CUSTOMER-001
  targetRole: 客户合同
  type: reference
- cardinality: MANY_TO_ONE
  cascadeDelete: false
  referenceField: departmentId
  source: AGG-CONTRACT-001
  sourceRole: 归属部门
  target: AGG-DEPARTMENT-001
  targetRole: 部门合同
  type: reference
- cardinality: MANY_TO_ONE
  cascadeDelete: false
  referenceField: ownerId
  source: AGG-CONTRACT-001
  sourceRole: 责任人
  target: AGG-EMPLOYEE-001
  targetRole: 负责合同
  type: reference
- cardinality: MANY_TO_ONE
  cascadeDelete: false
  referenceField: departmentId
  source: AGG-EMPLOYEE-001
  sourceRole: 所属部门
  target: AGG-DEPARTMENT-001
  targetRole: 部门人员
  type: reference
- cardinality: ONE_TO_MANY
  cascadeDelete: false
  referenceField: contractId
  source: AGG-CONTRACT-001
  sourceRole: 产生开票
  target: AGG-INVOICE-001
  targetRole: 所属合同
